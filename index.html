<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3f5f7">
<title>授業記録システム v0.1</title>
<style>
:root{
  --bg:#f3f5f7;--card:#fff;--text:#1f2933;--sub:#6b7280;--line:#d7dde4;
  --primary:#315b8a;--primary-soft:#eaf1f8;
  --body-radius:10.5px
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Yu Gothic",sans-serif;font-variant-numeric:tabular-nums}
body{min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{touch-action:manipulation}
.app{max-width:720px;margin:0 auto;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
.header{
  --header-icon-size:30px;
  --header-curve-gap:6px;
  --header-control-height:calc(var(--header-icon-size) + var(--header-curve-gap)*2);
  --header-control-radius:calc(var(--header-icon-size)/2 + var(--header-curve-gap));
  position:sticky;top:0;z-index:20;
  background:rgba(255,255,255,.96);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-bottom:0;
  margin:0 -16px;
  padding:calc(10px + env(safe-area-inset-top)) 10px 10px
}
.header-row{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:8px
}
.header-center{
  text-align:center;
  min-width:0;
  height:var(--header-control-height);
  display:flex;
  justify-content:center;
  align-items:center
}
.header-title{
  font-size:17px;
  font-weight:700;
  letter-spacing:.01em;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  white-space:nowrap;
  line-height:1;
  height:var(--header-control-height)
}
.header-grade{
  display:inline-flex;
  align-items:center;
  line-height:1
}
.header-sep{
  width:1px;
  height:22px;
  background:#b8c1cb;
  display:inline-block;
  align-self:center;
  margin-left:1px;
  margin-right:-1px;
  font-size:0;
  line-height:0;
  flex:0 0 1px
}
.header-right{display:flex;justify-content:flex-end}
.header-left{display:flex;justify-content:flex-start}

.header-action{
  height:var(--header-control-height);
  border-radius:var(--header-control-radius);
  display:grid;
  align-items:center;
  border:1.25px solid #cbd3dc;
  background:#fff;
  font-weight:700;
  font-size:15px;
  white-space:nowrap;
  line-height:1;
  -webkit-tap-highlight-color:transparent;
  appearance:none;
  -webkit-appearance:none;
  transition:
    background-color .16s ease,
    border-color .16s ease,
    color .16s ease,
    transform .12s ease,
    box-shadow .16s ease,
    opacity .16s ease
}
.header-action .header-icon{
  width:var(--header-icon-size);
  height:var(--header-icon-size);
  border-radius:50%;
  display:grid;
  place-items:center;
  justify-self:center;
  align-self:center
}
.header-action .header-icon svg{
  width:20px;
  height:20px;
  display:block;
  fill:none;
  stroke:currentColor;
  stroke-width:2.15;
  stroke-linecap:round;
  stroke-linejoin:round;
  shape-rendering:geometricPrecision
}
.icon-back-svg{transform:translateX(-0.45px)}
.icon-submit-svg{transform:translateY(-0.7px)}
.header-action > span:not(.header-icon){
  display:block;
}
/*
  同心円ルール：
  外カプセル高 42px → 端の半径 21px
  内円 30px → 半径 15px
  21 - 15 = 6px
  左右端の42pxゾーンの中心に内円を置くことで、
  CSS上でも円周間距離を常に6pxにする。
*/
.header-back{
  grid-template-columns:var(--header-control-height) auto;
  column-gap:2px;
  padding:0 12px 0 0;
  color:var(--text)
}
.header-back .header-icon{
  border:1.25px solid #aeb8c3;
  color:#243140;
  transition:
    background-color .16s ease,
    border-color .16s ease,
    color .16s ease,
    transform .12s ease
}
.header-submit{
  grid-template-columns:auto var(--header-control-height);
  column-gap:2px;
  padding:0 0 0 12px;
  color:#fff;
  background:linear-gradient(180deg,#2f8cff 0%, #2278ef 100%);
  border-color:#2278ef;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12)
}
.header-submit .header-icon{
  border:0;
  color:#2278ef;
  transition:
    background-color .16s ease,
    color .16s ease,
    transform .12s ease,
    opacity .16s ease
}
.header-back .header-icon,
.header-submit .header-icon{
  background:#fff;
  box-shadow:none;
}
/* 参照モックに合わせたタップ時の見え方 */
.header-back:active,
.header-back.is-pressed{
  background:#edf3f8;
  border-color:#d4dde7;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55)
}
.header-back:active .header-icon,
.header-back.is-pressed .header-icon{
  background:#fff;
  border-color:#96a4b2;
  color:#243140
}
.header-submit:active,
.header-submit.is-pressed{
  background:linear-gradient(180deg,#247cf1 0%, #1a67da 100%);
  border-color:#1a67da;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10)
}
.header-submit:active .header-icon,
.header-submit.is-pressed .header-icon{
  background:#fff;
  color:#1a67da
}
.header-action:active,
.header-action.is-pressed{transform:scale(.985)}
.text-btn{border:0;background:none;color:var(--primary);padding:8px 0;font-weight:600}
.badge{display:inline-block;border-radius:999px;padding:6px 10px;background:#e9edf1;color:#55606d;font-size:12px}.badge.done{background:#e7f3ea;color:#28663a}
.page-title{font-size:22px;font-weight:700;margin:20px 0 4px}.page-sub{font-size:13px;color:var(--sub);margin-bottom:14px}
.lesson-list{display:grid;gap:12px;margin-top:14px}
.lesson-card{width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--body-radius);padding:16px;display:grid;grid-template-columns:66px 1fr auto;gap:12px;align-items:center}
.lesson-time{font-weight:700}.lesson-name{font-size:17px;font-weight:700}.lesson-meta{font-size:13px;color:var(--sub);margin-top:3px}
.record-section{
  --record-list-inset:15px;
  --record-status-size:10.5px;
  --record-label-gap:6.4px;
  --record-half-label-gap:3.2px;
  --record-content-gap:10px;
  --record-item-gap:15px;
  --record-horizontal-space-preferred:10px;
  --record-horizontal-space-min:6px;
  --record-horizontal-space:var(--record-horizontal-space-preferred);

  /* Body controls stay flat; header/footer own the glossy material language. */
  --record-control-height:42px;
  --record-control-font-size:14px;
  --record-control-font-weight:700;
  --record-control-bg:#fff;
  --record-control-border:#cbd3dc;
  --record-control-text:#56616e;
  --record-control-active-bg:#dce9f7;
  --record-control-active-border:#7fa3cc;
  --record-control-active-text:#234e7a;
  --record-control-pressed-bg:#f2f5f8;
  --record-control-active-pressed-bg:#d2e2f3;
  --record-control-active-pressed-border:#6f95c0;

  --record-control-inset:calc(var(--record-status-size) + var(--record-half-label-gap));
  --record-divider-start:calc(var(--record-list-inset) + var(--record-control-inset));
  margin:0;
  padding-top:20px;
  padding-bottom:var(--record-item-gap);
  scroll-margin-top:86px;
  display:grid;
  row-gap:var(--record-item-gap);
}

/* Preview shows only the values that were actually selected. */
.app.preview-mode .record-section{
  --record-control-active-bg:#dcf7e9;
  --record-control-active-border:#7fcca3;
  --record-control-active-text:#237a4b;
  --record-control-active-pressed-bg:#d2f3e1;
  --record-control-active-pressed-border:#6fc095;
}
.preview-option-hidden{
  display:none!important;
}
.record-section-title{
  margin:0 4px 0;
  display:flex;
  align-items:center;
  gap:8px;
  font-size:20px;
  font-weight:800;
  line-height:1.2;
  letter-spacing:.01em;
}
.record-section-title::before{
  content:"";
  width:3px;
  height:1.15em;
  flex:0 0 3px;
  border-radius:999px;
  background:#44515e;
  transform:translateY(.5px);
  transition:background-color .15s cubic-bezier(.22,.72,.26,1);
}
.record-section.is-current .record-section-title::before{
  background:#2278ef;
}
.app.preview-mode .record-section.is-current .record-section-title::before{
  background:#2faa68;
}
.record-section-title::after{
  content:"";
  height:1px;
  flex:1 1 auto;
  background:#cbd3dc;
}
.record-section .card-title-row{
  display:flex;
  align-items:baseline;
  gap:var(--record-label-gap);
  min-height:21px;
  margin:0 0 var(--record-content-gap);
}
.record-section .card-title-row .card-title{margin:0}
.record-section .inline-auto-hint{
  margin:0;
  white-space:nowrap;
}

/* Rounded square = content/input state. */
.record-section .card-status{
  position:relative;
  width:var(--record-status-size);
  height:var(--record-status-size);
  flex:0 0 var(--record-status-size);
  box-sizing:border-box;
  transform:translateY(.5px);
  align-self:center;
  border:1.75px solid #56616e;
  border-radius:25%;
  background:#fff;
  transition:
    background-color .15s cubic-bezier(.22,.72,.26,1),
    border-color .15s cubic-bezier(.22,.72,.26,1);
}
.record-section .card.is-complete .card-status{
  background:#56616e;
  border-color:#56616e;
}

/* Color means current location, not completion. */
.record-section.is-current .card-status{
  border-color:#2278ef;
}
.record-section.is-current .card.is-complete .card-status{
  background:#2278ef;
  border-color:#2278ef;
}
.app.preview-mode .record-section.is-current .card-status{
  border-color:#2faa68;
}
.app.preview-mode .record-section.is-current .card.is-complete .card-status{
  background:#2faa68;
  border-color:#2faa68;
}

/* Record cards are list items, not enclosing boxes. */
.record-section .card{
  position:relative;
  background:transparent;
  border:0;
  border-radius:0;
  margin:0;
  padding:0 4px var(--record-item-gap) var(--record-list-inset);
}
.record-section .card::after{
  content:"";
  position:absolute;
  left:var(--record-divider-start);
  right:4px;
  bottom:0;
  height:1px;
  background:#d7dde4;
}

/* Body and separator share the midpoint between status square and title. */
.record-section .card-body{
  margin-left:var(--record-control-inset);
  min-width:0;
}

.card-title{font-size:16px;font-weight:700;margin:0 0 4px}.hint{font-size:13px;color:var(--sub);margin:0 0 12px}
.readonly{border:1px solid var(--line);background:#f7f8fa;border-radius:var(--body-radius);padding:13px 14px;line-height:1.45}

/* Direct-edit date/time blocks */
.datetime-blocks{
  display:flex;
  align-items:center;
  gap:var(--record-horizontal-space);
  min-width:0;
  width:100%;
}
.datetime-main{
  display:flex;
  align-items:center;
  gap:var(--record-horizontal-space);
  min-width:0;
}
.datetime-blocks.datetime-wrap{
  flex-wrap:wrap;
}
.datetime-blocks.datetime-wrap .datetime-duration{
  margin-left:var(--record-control-inset);
}
.datetime-main .dt-block,
.datetime-blocks > .dt-block{
  flex:0 0 auto;
}
.datetime-duration{
  margin-left:auto;
}
.datetime-end-time{
  flex:0 0 auto;
  font-size:var(--record-control-font-size);
  font-weight:var(--record-control-font-weight);
  color:var(--record-control-text);
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.dt-block{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:auto;
  height:var(--record-control-height);
  min-width:0;
  border:1px solid #cbd3dc;
  background:#f7f8fa;
  border-radius:var(--body-radius);
  padding:0 var(--record-horizontal-space);
  font-weight:var(--record-control-font-weight);
  font-size:var(--record-control-font-size);
  color:var(--record-control-text);
  white-space:nowrap;
  box-shadow:0 1px 0 rgba(31,41,51,.02);
  -webkit-appearance:none;
  appearance:none;
  text-align:center;
  text-align-last:center;
}
.dt-block:active{background:#eef2f6}

.field{margin-top:14px}.label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.material-entry{
  display:grid;
  gap:14px;
}
.material-entry>.field,
.material-detail-field{
  margin-top:0;
}
.material-range-row{
  display:flex;
  align-items:center;
  gap:14px;
  min-width:0;
}
.material-range-controls{
  display:flex;
  align-items:center;
  gap:var(--record-horizontal-space);
  flex:0 0 auto;
}
.material-page-input{
  flex:0 0 auto;
  width:calc(3ch + var(--record-horizontal-space)*2 + 2px);
  min-width:calc(3ch + var(--record-horizontal-space)*2 + 2px);
  height:var(--record-control-height);
  padding:0 var(--record-horizontal-space);
  font-size:var(--record-control-font-size);
  font-weight:var(--record-control-font-weight);
  color:var(--record-control-text);
  text-align:center;
  -moz-appearance:textfield;
}
.material-unit-window{
  flex:1 1 auto;
  min-width:0;
  overflow-x:auto;
  overflow-y:hidden;
  white-space:nowrap;
  color:var(--record-control-text);
  font-size:var(--record-control-font-size);
  font-weight:var(--record-control-font-weight);
  line-height:var(--record-control-height);
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-x;
}
.material-unit-window::-webkit-scrollbar{
  display:none;
}
.material-unit-track{
  display:inline-block;
  min-width:max-content;
  padding-right:2px;
}
.review-unit-prompt{
  color:#8a5b22;
}
.material-page-input::-webkit-inner-spin-button,
.material-page-input::-webkit-outer-spin-button{
  -webkit-appearance:none;
  margin:0;
}
.material-range-separator{
  flex:0 0 auto;
  color:var(--record-control-text);
  font-size:var(--record-control-font-size);
  font-weight:var(--record-control-font-weight);
}
input,textarea,select{width:100%;max-width:100%;min-width:0;border:1px solid #cbd3dc;border-radius:var(--body-radius);background:#fff;padding:12px 13px;outline:none}
select{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#333 50%),linear-gradient(135deg,#333 50%,transparent 50%);background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}
select.dt-block{-webkit-appearance:none;appearance:none;background-image:none;padding-right:var(--record-horizontal-space)}
textarea{min-height:140px;resize:vertical;line-height:1.65}
input:focus,textarea:focus,select:focus{border-color:#7a9ec7;box-shadow:0 0 0 3px rgba(49,91,138,.10)}
.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:var(--record-horizontal-space);
}
.row input{
  padding-left:var(--record-horizontal-space);
  padding-right:var(--record-horizontal-space);
}
.choice-grid{
  display:flex;
  flex-wrap:nowrap;
  gap:var(--record-horizontal-space);
  min-width:0;
}
.choice-grid.adaptive-wrap{
  flex-wrap:wrap;
}
.choice-button{
  flex:0 0 auto;
  width:auto;
  min-width:0;
  height:var(--record-control-height);
  border:1px solid var(--record-control-border);
  background:var(--record-control-bg);
  border-radius:var(--body-radius);
  padding:0 var(--record-horizontal-space);
  font-size:var(--record-control-font-size);
  font-weight:var(--record-control-font-weight);
  line-height:1;
  text-align:center;
  white-space:nowrap;
  color:var(--record-control-text);
  box-shadow:none;
  -webkit-appearance:none;
  appearance:none;
}
.choice-button.active{
  background:var(--record-control-active-bg);
  border-color:var(--record-control-active-border);
  color:var(--record-control-active-text);
}
.choice-button:active{background:var(--record-control-pressed-bg)}
.choice-button.active:active{
  background:var(--record-control-active-pressed-bg);
  border-color:var(--record-control-active-pressed-border);
}
.record-option-label{
  position:relative;
  z-index:1;
  display:block;
  white-space:nowrap;
  line-height:1;
  transform:translateX(0);
  will-change:opacity,transform;
}
.guide{font-size:13px;line-height:1.7;color:#4b5563;background:#faf9f5;border:1px solid #ebe4ce;border-radius:var(--body-radius);padding:10px 12px;margin-bottom:10px}
.counter{text-align:right;font-size:12px;color:var(--sub);margin-top:6px}.link-row{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px}.link-btn{border:0;background:none;color:var(--primary);padding:8px 0;font-weight:600}
.history{margin-top:10px;display:grid;gap:8px}.history-item{border:1px solid var(--line);background:#f7f8fa;border-radius:var(--body-radius);padding:11px}.history-date{font-size:12px;color:var(--sub);margin-bottom:5px}
.rating{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:var(--record-horizontal-space);
}
.rating button{
  border:1px solid var(--record-control-border);
  background:var(--record-control-bg);
  border-radius:var(--body-radius);
  padding:12px var(--record-horizontal-space);
  font-size:19px;
  font-weight:700;
  color:var(--record-control-text);
  box-shadow:none;
}
.rating button.active{
  background:var(--record-control-active-bg);
  border-color:var(--record-control-active-border);
  color:var(--record-control-active-text);
}
.rating button.active:active{
  background:var(--record-control-active-pressed-bg);
  border-color:var(--record-control-active-pressed-border);
}
.chips{
  display:flex;
  flex-wrap:nowrap;
  gap:var(--record-horizontal-space);
  min-width:0;
}
.chips.adaptive-wrap{
  flex-wrap:wrap;
}
.chip{
  flex:0 0 auto;
  border:1px solid var(--record-control-border);
  background:var(--record-control-bg);
  border-radius:var(--body-radius);
  padding:10px var(--record-horizontal-space);
  white-space:nowrap;
}
.chip.active{
  background:var(--record-control-active-bg);
  border-color:var(--record-control-active-border);
  color:var(--record-control-active-text);
  font-weight:700;
}
.hidden{display:none!important}

/* Motion: layout itself moves; no page-level crossfade */
@media (prefers-reduced-motion:no-preference){
  .soft-reveal{
    display:grid;
    grid-template-rows:0fr;
    opacity:0;
    transform:translateY(-5px) scale(.995);
    margin-top:0!important;
    pointer-events:none;
    transition:
      grid-template-rows 360ms cubic-bezier(.16,1,.3,1),
      opacity 180ms ease-out,
      transform 360ms cubic-bezier(.16,1,.3,1),
      margin-top 360ms cubic-bezier(.16,1,.3,1);
  }
  .soft-reveal>*{overflow:hidden;min-height:0}
  .soft-reveal.open{
    grid-template-rows:1fr;
    opacity:1;
    transform:translateY(0) scale(1);
    margin-top:14px!important;
    pointer-events:auto;
  }
  .history{overflow:hidden}

  button{
    transition:
      background-color 180ms ease-out,
      border-color 180ms ease-out,
      color 180ms ease-out,
      transform 140ms cubic-bezier(.16,1,.3,1),
      opacity 180ms ease-out;
  }
  button:active{
    transform:scale(.985);
  }
}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#20252b;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1}
.note{font-size:12px;color:var(--sub);line-height:1.6}

/* Record footer navigation */
.record-footer{
  --footer-outer-h:62px;
  --footer-outer-r:calc(var(--footer-outer-h)/2);
  --footer-item-h:42px;
  --footer-item-r:calc(var(--footer-item-h)/2);
  --footer-icon-scale:.7142857;

  /* Motion */
  --footer-motion-dur:.21s;
  --footer-motion-ease:cubic-bezier(.22,.72,.26,1);
  --footer-fade-dur:.10s;
  --footer-color-dur:.15s;
  --footer-color-ease:cubic-bezier(.22,.72,.26,1);

  /* Shared materials */
  --footer-white-bg:linear-gradient(180deg,#ffffff 0%,#edf1f5 100%);
  --footer-white-outline:#cbd3dc;
  --footer-white-shadow:
    inset 0 0 0 1.25px var(--footer-white-outline),
    inset 0 1px 0 rgba(255,255,255,1),
    inset 0 -1px 0 rgba(31,41,51,.035);

  --footer-blue-bg:linear-gradient(180deg,#3993ff 0%,#1f73e6 100%);
  --footer-blue-outline:#2278ef;
  --footer-blue-shadow:
    inset 0 0 0 1.25px var(--footer-blue-outline),

<div id="app"></div>
<script>
(() => {
  const STORAGE_KEY="lesson-record-v01-github";
  const SUBJECTS=["国語","数学","英語","理科","社会"];
  const INSTRUCTORS=["石井","田中","佐々木"];

  function isElementaryGrade(grade){
    return String(grade||"").startsWith("小");
  }

  function subjectsForGrade(grade){
    return SUBJECTS.map(subject=>
      isElementaryGrade(grade)&&subject==="数学"?"算数":subject
    );
  }

  function normalizeSubjectForGrade(subject,grade){
    if(isElementaryGrade(grade)&&subject==="数学")return "算数";
    if(!isElementaryGrade(grade)&&subject==="算数")return "数学";
    return subject;
  }
  const now=new Date(), Y=now.getFullYear(), M=now.getMonth()+1, D=now.getDate();

  const materialDb={
    "小学5年 算数 標準問題集":[{from:42,to:49,unit:"分数のたし算・ひき算"},{from:50,to:57,unit:"分数と小数"},{from:58,to:65,unit:"割合"}],
    "新中学問題集 数学2年":[{from:36,to:47,unit:"連立方程式"},{from:48,to:55,unit:"連立方程式の利用"},{from:56,to:73,unit:"一次関数"}],
    "計算トレーニング 数学2年":[{from:22,to:33,unit:"連立方程式の計算"}],
    "新中学問題集 英語2年":[{from:40,to:51,unit:"不定詞"},{from:52,to:63,unit:"動名詞"}],
    "標準問題集 国語3年":[{from:18,to:29,unit:"説明的文章の読解"},{from:30,to:41,unit:"文学的文章の読解"}]
  };

  const lessons=[
    {id:"l0",student:"山田 葵",familyName:"山田",givenName:"葵",familyKana:"やまだ",givenKana:"あおい",grade:"小5",subject:"算数",instructor:"石井",hour:15,minute:40,type:"通常",materials:["小学5年 算数 標準問題集"],prevHomework:"小学5年 算数 標準問題集 p.46〜47",history:[
      {date:"2026/09/12",text:"通分してから計算する手順を確認しました。分母をそろえる理由を図でも確認し、自力で解ける問題が増えました。"}]},
    {id:"l1",student:"佐藤 陽菜",familyName:"佐藤",givenName:"陽菜",familyKana:"さとう",givenKana:"ひな",grade:"中2",subject:"数学",instructor:"石井",hour:17,minute:0,type:"通常",materials:["新中学問題集 数学2年","計算トレーニング 数学2年"],prevHomework:"新中学問題集 数学2年 p.46〜47 の残り（大問3・4）",history:[
      {date:"2026/09/12",text:"加減法で係数をそろえる手順を確認しました。途中式を省略するとミスが出るため、一行ずつ書く練習を行いました。"},
      {date:"2026/09/05",text:"分数を含む連立方程式を扱いました。分母をはらう処理を確認した後は、自力で解ける問題が増えました。"}]},
    {id:"l2",student:"鈴木 大輝",familyName:"鈴木",givenName:"大輝",familyKana:"すずき",givenKana:"だいき",grade:"中2",subject:"英語",instructor:"田中",hour:18,minute:20,type:"振替",materials:["新中学問題集 英語2年"],prevHomework:"新中学問題集 英語2年 p.46〜47、単語テスト範囲の復習",history:[
      {date:"2026/09/11",text:"不定詞の名詞的用法・副詞的用法の識別を演習しました。英作文ではtoの位置を確認しました。"}]},
    {id:"l3",student:"高橋 芽衣",familyName:"高橋",givenName:"芽衣",familyKana:"たかはし",givenKana:"めい",grade:"中3",subject:"国語",instructor:"石井",hour:19,minute:40,type:"講習",materials:["標準問題集 国語3年"],prevHomework:"標準問題集 国語3年 p.24〜25 の記述問題",history:[
      {date:"2026/09/10",text:"接続語に着目して段落関係を整理しました。記述問題では必要な要素を意識して書けるようになりました。"}]}
  ];

  const state={lessonId:null,records:load(),forgot:new Set(),rating:"",showPrev:false,showHistory:false};

  function load(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}")}catch(e){return {}}}
  function persist(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state.records))}
  function pad(n){return String(n).padStart(2,"0")}
  function formatDateTime(x){return x.year+"/"+pad(x.month)+"/"+pad(x.day)+" "+pad(x.hour)+":"+pad(x.minute)}
  function lessonBase(l){return {year:Y,month:M,day:D,hour:l.hour,minute:l.minute}}
  function getLesson(){return lessons.find(x=>x.id===state.lessonId)}
  function getRecord(){return state.records[state.lessonId]||null}
  function esc(s){return String(s??"").replace(/[&<>"']/g,c=>c==="&"?"&amp;":c==="<"?"&lt;":c===">"?"&gt;":c==="\""?"&quot;":"&#39;")}
  function unitFor(material,from,to){
    const a=Number(from),b=Number(to||from);
    if(!Number.isFinite(a))return "";
    return (materialDb[material]||[])
      .filter(r=>a<=r.to&&b>=r.from)
      .map(r=>r.unit)
      .join(" / ");
  }

  function unitListForRanges(material,ranges=[]){
    return [...new Set(
      ranges
        .map(range=>unitFor(material,range.from,range.to))
        .flatMap(unit=>unit?unit.split(" / "):[])
        .filter(Boolean)
    )];
  }

  function normalizeMaterialEntry(entry,fallbackMaterial=""){
    const material=entry?.material||fallbackMaterial;
    const customMaterial=entry?.customMaterial||"";
    const ranges=Array.isArray(entry?.ranges)
      ? entry.ranges
          .map(range=>({
            from:String(range?.from??""),
            to:String(range?.to??"")
          }))
          .filter(range=>range.from||range.to)
      : [];

    return {material,customMaterial,ranges};
  }

  function rangeHasUnitData(material,range){
    const from=Number(range?.from);
    const to=Number(range?.to||range?.from);
    if(!Number.isFinite(from))return false;
    return (materialDb[material]||[]).some(unit=>
      from<=unit.to&&to>=unit.from
    );
  }

  function materialNeedsUnitPrompt(material,ranges=[]){
    const enteredRanges=ranges.filter(range=>range?.from||range?.to);
    return enteredRanges.length>0 &&
      enteredRanges.some(range=>!rangeHasUnitData(material,range));
  }

  function materialsFromRecord(record,lesson){
    if(Array.isArray(record?.materials)&&record.materials.length){
      return record.materials.map((entry,index)=>
        normalizeMaterialEntry(entry,index===0?lesson.materials[0]:"")
      );
    }

    const material=record?.material||lesson.materials[0]||"";
    const from=String(record?.pageFrom??"");
    const to=String(record?.pageTo??"");

    return [normalizeMaterialEntry({
      material,
      customMaterial:record?.customMaterial||"",
      ranges:(from||to)?[{from,to}]:[]
    },material)];
  }
  function toast(msg){let t=document.querySelector(".toast");if(!t){t=document.createElement("div");t.className="toast";document.body.appendChild(t)}t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1300)}

  function bindPressFeedback(el){
    if(!el) return;
    const on = ()=>el.classList.add("is-pressed");
    const off = ()=>el.classList.remove("is-pressed");
    el.addEventListener("touchstart", on, {passive:true});
    el.addEventListener("touchend", off);
    el.addEventListener("touchcancel", off);
    el.addEventListener("pointerdown", on);
    el.addEventListener("pointerup", off);
    el.addEventListener("pointerleave", off);
    el.addEventListener("blur", off);
  }

  let autoSaveTimer=null;
  let footerScrollHandler=null;

      subject:_legacySubject,
      material:_legacyMaterial,
      customMaterial:_legacyCustomMaterial,
      pageFrom:_legacyPageFrom,
      pageTo:_legacyPageTo,
      unit:_legacyUnit,
      manualUnit:_legacyManualUnit,
      ...current
    }=prev;
    state.records[l.id]={
      ...current,
      performedAt:c.dt,
      duration:c.duration,
      type:c.type,
      instructor:c.instructor,
      subjects:c.subjects,
      materials:c.materials,
      review:c.review,
      rating:state.rating,

      nextHomework:c.nextHomework,
      forgot:[...state.forgot],
      forgotOther:state.forgot.has("その他")?c.forgotOther:"",
      note:c.note,
      savedAt:new Date().toISOString()
    };
    persist();

  function springProgress(t){
    if(t<=0)return 0;
    if(t>=1)return 1;
    return 1-Math.exp(-12*t)*(Math.cos(11*t)+0.35*Math.sin(11*t));
  }

  function heightSpringFrames(from,to,steps=30){
    return Array.from({length:steps+1},(_,i)=>{
      const t=i/steps,p=i===steps?1:springProgress(t);
      return {height:(from+(to-from)*p)+"px",offset:t};
    });
  }

  function endTimeLabel(dt,duration){
    const total=(Number(dt.hour)*60+Number(dt.minute)+Number(duration||70))%(24*60);
    return "〜"+pad(Math.floor(total/60))+":"+pad(total%60);
  }

  function datetimeBlocks(v){
    const dt=v.dt;
    const monthOptions=Array.from({length:12},(_,i)=>i+1).map(value=>'<option value="'+value+'" '+(Number(dt.month)===value?'selected':'')+'>'+pad(value)+'月</option>').join("");
    const maxDay=new Date(dt.year,dt.month,0).getDate();
    const dayOptions=Array.from({length:maxDay},(_,i)=>i+1).map(value=>'<option value="'+value+'" '+(Number(dt.day)===value?'selected':'')+'>'+pad(value)+'日</option>').join("");
    const timeOptions=["11:00","13:00","14:20","15:40","17:00","18:20","19:40"].map(value=>'<option value="'+value+'" '+((pad(dt.hour)+':'+pad(dt.minute))===value?'selected':'')+'>'+value+'</option>').join("");
    const durationOptions=[30,70].map(value=>'<option value="'+value+'" '+(Number(v.duration||70)===value?'selected':'')+'>'+value+'分</option>').join("");
    return '<div class="datetime-blocks" aria-label="実施日時">'+
      '<div class="datetime-main">'+
        '<select class="dt-block" data-dt-part="month" aria-label="月を変更">'+monthOptions+'</select>'+
        '<select class="dt-block" data-dt-part="day" aria-label="日を変更">'+dayOptions+'</select>'+
        '<select class="dt-block datetime-start-time" data-dt-part="time" aria-label="開始時刻を変更">'+timeOptions+'</select>'+
        '<span class="datetime-end-time" id="dtEndTimeValue" aria-label="終了時刻">'+endTimeLabel(dt,v.duration)+'</span>'+
      '</div>'+
      '<select class="dt-block datetime-duration" data-dt-part="duration" aria-label="授業時間を変更">'+durationOptions+'</select>'+
    '</div>';
  }

  function horizontalSpacingLimits(root){
    const style=getComputedStyle(root);
    return {
      preferred:parseFloat(style.getPropertyValue("--record-horizontal-space-preferred"))||10,
      minimum:parseFloat(style.getPropertyValue("--record-horizontal-space-min"))||6
    };
  }

  function fitDateTimeControls(){
    const root=document.querySelector(".datetime-blocks");
    if(!root)return;

    const controls=[...root.querySelectorAll(".dt-block")];
    const endTime=root.querySelector(".datetime-end-time");
    if(controls.length!==4||!endTime)return;

    const {preferred,minimum}=horizontalSpacingLimits(root);

    root.classList.remove("datetime-wrap");
    root.style.setProperty("--record-horizontal-space","0px");

    const controlsWidth=controls.reduce((sum,control)=>sum+control.getBoundingClientRect().width,0);
    const endWidth=endTime.getBoundingClientRect().width;
    const available=root.clientWidth;

    // 4 controls × 2 inner paddings + 4 horizontal gaps = 12 equal slots.
    const spacingSlots=controls.length*2+4;
    const fitted=(available-controlsWidth-endWidth)/spacingSlots;
    const spacing=Math.max(minimum,Math.min(preferred,fitted));

    root.style.setProperty("--record-horizontal-space",spacing.toFixed(3)+"px");
    root.classList.toggle("datetime-wrap",fitted<minimum);
  }

  function fitAdaptiveChoiceRows(){
    document.querySelectorAll('[data-adaptive-horizontal="choices"]').forEach(root=>{
      const items=[...root.children].filter(el=>el.matches("button"));
      if(items.length<2)return;

      const {preferred,minimum}=horizontalSpacingLimits(root);

      // Measure one-line intrinsic content first.
      root.classList.remove("adaptive-wrap");
      root.style.setProperty("--record-horizontal-space","0px");

      const intrinsicWidth=items.reduce((sum,item)=>sum+item.getBoundingClientRect().width,0);
      const available=root.clientWidth;

      // Every item contributes left/right padding; adjacent items share one gap.
      const spacingSlots=items.length*2+(items.length-1);
      const fitted=(available-intrinsicWidth)/spacingSlots;
      const spacing=Math.max(minimum,Math.min(preferred,fitted));

      root.style.setProperty("--record-horizontal-space",spacing.toFixed(3)+"px");
      root.classList.toggle("adaptive-wrap",fitted<minimum);
    });
  }

  function fitRecordHorizontalControls(){
    fitDateTimeControls();
    fitAdaptiveChoiceRows();
  }

  function refreshDateTimeBlocks(v){
    const dt=v.dt;
    const monthEl=document.querySelector('[data-dt-part="month"]');
    const dayEl=document.querySelector('[data-dt-part="day"]');
    const timeEl=document.querySelector('[data-dt-part="time"]');
    const durationEl=document.querySelector('[data-dt-part="duration"]');
    const endTimeEl=document.getElementById("dtEndTimeValue");

    if(monthEl)monthEl.value=String(dt.month);
    if(dayEl){
      const maxDay=new Date(dt.year,dt.month,0).getDate();
      if(dt.day>maxDay)dt.day=maxDay;
      dayEl.innerHTML=Array.from({length:maxDay},(_,i)=>i+1).map(value=>'<option value="'+value+'">'+pad(value)+'日</option>').join("");
      dayEl.value=String(dt.day);
    }
    if(timeEl)timeEl.value=pad(dt.hour)+':'+pad(dt.minute);
    if(durationEl)durationEl.value=String(Number(v.duration||70));
    if(endTimeEl)endTimeEl.textContent=endTimeLabel(dt,v.duration);
    requestAnimationFrame(fitRecordHorizontalControls);
  }

      duration:Number(v.duration||70),

        const customMaterial=document.getElementById("customMaterial")?.value||"";
        const from=document.getElementById("pageFrom")?.value||"";
        const to=document.getElementById("pageTo")?.value||"";
        return {
          material,
          customMaterial,
          ranges:(from||to)?[{from,to}]:[]
        };
      })()],
      review:document.getElementById("review")?.value??v.review,
      homeworkComment:document.getElementById("homeworkComment")?.value??v.homeworkComment,

  function updateCardCompletion(c){

      datetime:true,

      material:!!c.materials?.some(entry=>
        entry.material==="__custom__"
          ? !!String(entry.customMaterial||"").trim()
          : !!String(entry.material||"").trim()
      ),

        String(c.homeworkComment||"").trim()
      ),
      nexthomework:!!String(c.nextHomework||"").trim(),

  function updateFooterCompletion(c){

    const completed={
      basic:true,
      lesson:!!(
        String(c.review||"").trim() ||
        c.materials?.some(entry=>
          String(entry.customMaterial||"").trim() ||

          )

      ),

      ),

  function bindRecordFooter(v){
    const targets={
      basic:document.querySelector('[data-record-section="basic"]'),
      lesson:document.querySelector('[data-record-section="lesson"]'),
      homework:document.querySelector('[data-record-section="homework"]'),
      other:document.querySelector('[data-record-section="other"]')
    };

    const unlockFooterScroll=(runSpy=true)=>{
      footerScrollLock=null;
      clearTimeout(footerScrollUnlockTimer);
      footerScrollUnlockTimer=null;
      if(runSpy && footerScrollHandler)requestAnimationFrame(footerScrollHandler);
    };

    document.querySelectorAll("[data-footer-section]").forEach(btn=>{
      btn.onclick=()=>{
        const key=btn.dataset.footerSection,target=targets[key];
        if(!target)return;

        const headerH=document.querySelector(".header")?.getBoundingClientRect().height||0;
        // Align the section box directly below the sticky header.
        // The section's own 20px top padding then becomes the visible header-to-title gap,
        // so spacing has a single source of truth instead of a second scroll-only offset.
        const rawY=window.scrollY+target.getBoundingClientRect().top-headerH;
        const maxY=Math.max(0,document.documentElement.scrollHeight-window.innerHeight);
        const y=Math.min(maxY,Math.max(0,rawY));

        // During a tap-triggered smooth scroll, keep the tapped tab selected.
        // This prevents the scroll-spy from activating sections merely passed en route.
        footerScrollLock={key,targetY:y,started:performance.now()};
        clearTimeout(footerScrollUnlockTimer);
        setFooterActive(key);

        window.scrollTo({top:y,behavior:"smooth"});

        // Safety unlock for interrupted/older Safari smooth-scroll behavior.
        footerScrollUnlockTimer=setTimeout(()=>unlockFooterScroll(true),1100);
      };
    });

    if(footerScrollHandler)window.removeEventListener("scroll",footerScrollHandler);
    let ticking=false;
    footerScrollHandler=()=>{
      if(ticking)return;
      ticking=true;
      requestAnimationFrame(()=>{
        ticking=false;

        if(footerScrollLock){
          const distance=Math.abs(window.scrollY-footerScrollLock.targetY);
          const elapsed=performance.now()-footerScrollLock.started;

          // Keep the requested section active until the scroll actually arrives.
          setFooterActive(footerScrollLock.key);

          if(distance<=2 || elapsed>1050){
            unlockFooterScroll(true);
          }
          return;
        }

        const headerH=document.querySelector(".header")?.getBoundingClientRect().height||0;
        const probe=window.scrollY+headerH+24;
        let active="basic";
        [["lesson",targets.lesson],["homework",targets.homework],["other",targets.other]].forEach(([key,target])=>{
          if(target&&target.offsetTop<=probe)active=key;
        });
        setFooterActive(active);
      });
    };
    window.addEventListener("scroll",footerScrollHandler,{passive:true});
    footerScrollHandler();
  }

  function bindRecord(v){
    bindRecordFooter(v);
    updateFooterCompletion(capture(v));
    const backBtn=document.getElementById("backBtn");
    bindPressFeedback(backBtn);
    backBtn.onclick=()=>{
      autoSaveNow(v);
      renderList();
    };

    const submitBtn=document.getElementById("submitBtn");
    bindPressFeedback(submitBtn);
    if(submitBtn)submitBtn.onclick=()=>{
      autoSaveNow(v);
      toast("提出ボタンの動作は次に決めます");
    };

    const previewBtn=document.getElementById("previewBtn");
    const recordFooter=document.querySelector(".record-footer");
    const recordApp=document.querySelector("#app > .app");
    let previewUnlockTimer=null;

    const PREVIEW_OPTION_SELECTOR=".choice-button, .rating button, .chip";
    const PREVIEW_OPTION_GROUP_SELECTOR=".choice-grid, .rating, .chips";

    function cssTimeToMs(value,fallback){
      const raw=String(value||"").trim();
      if(!raw)return fallback;
      const n=parseFloat(raw);
      if(!Number.isFinite(n))return fallback;
      return raw.endsWith("ms")?n:n*1000;
    }

    const footerMotionStyle=getComputedStyle(recordFooter);
    const PREVIEW_OPTION_MOTION={
      move:cssTimeToMs(footerMotionStyle.getPropertyValue("--footer-motion-dur"),210),
      fade:cssTimeToMs(footerMotionStyle.getPropertyValue("--footer-fade-dur"),100),
      ease:footerMotionStyle.getPropertyValue("--footer-motion-ease").trim()||"cubic-bezier(.22,.72,.26,1)"
    };

    let previewOptionMotionToken=0;
    let previewOptionCleanupTimer=null;
    let previewOptionAnimations=[];

    const px=value=>value+"px";
    const previewOptions=()=>[...document.querySelectorAll(PREVIEW_OPTION_SELECTOR)];
    const activePreviewOptions=()=>previewOptions().filter(option=>option.classList.contains("active"));
    const inactivePreviewOptions=()=>previewOptions().filter(option=>!option.classList.contains("active"));
    const optionLabel=option=>option.querySelector(".record-option-label");
    const captureRects=elements=>new Map(elements.map(element=>[element,element.getBoundingClientRect()]));

    function rememberMotionStyle(option){
      if(!option.hasAttribute("data-preview-motion-style")){
        option.setAttribute("data-preview-motion-style",option.getAttribute("style")||"");
      }
    }

    function restoreMotionStyle(option){
      if(!option.hasAttribute("data-preview-motion-style"))return;
      const style=option.getAttribute("data-preview-motion-style");
      if(style)option.setAttribute("style",style);
      else option.removeAttribute("style");
      option.removeAttribute("data-preview-motion-style");
    }

    function trackPreviewAnimation(element,keyframes,options){
      const animation=element.animate(keyframes,options);
      previewOptionAnimations.push(animation);
      return animation;
    }

    function stopPreviewOptionMotion(compact){
      previewOptionMotionToken+=1;
      clearTimeout(previewOptionCleanupTimer);
      previewOptionCleanupTimer=null;
      previewOptionAnimations.forEach(animation=>animation.cancel());
      previewOptionAnimations=[];

      previewOptions().forEach(option=>{
        restoreMotionStyle(option);
        option.style.removeProperty("visibility");
        option.classList.toggle("preview-option-hidden",compact&&!option.classList.contains("active"));
      });
    }

    function previewStackInfo(option){
      const group=option.closest(PREVIEW_OPTION_GROUP_SELECTOR);
      if(!group)return null;

      const options=[...group.children].filter(child=>child.matches(PREVIEW_OPTION_SELECTOR));
      const index=options.indexOf(option);
      if(index<0)return null;

      const selected=options
        .map((candidate,targetIndex)=>({
          target:candidate,
          targetIndex,
          distance:Math.abs(targetIndex-index)
        }))
        .filter(({target})=>target.classList.contains("active"));

      if(!selected.length)return null;

      // Nearest selected card wins; an equal-distance tie goes to the left.
      selected.sort((a,b)=>
        a.distance-b.distance ||
        (a.targetIndex<index?-1:1)-(b.targetIndex<index?-1:1)
      );

      const {target,targetIndex,distance}=selected[0];
      const isLeft=index<targetIndex;

      // Farther cards sit lower. At the same distance, the card on the left
      // sits one layer above the card on the right.
      const zIndex=Math.max(
        1,
        (options.length-distance)*2 + (isLeft?1:0)
      );

      return {target,distance,isLeft,zIndex,groupSize:options.length};
    }

    function raiseActiveOptions(options){
      options.forEach(option=>{
        rememberMotionStyle(option);
        const group=option.closest(PREVIEW_OPTION_GROUP_SELECTOR);
        const groupSize=group
          ? [...group.children].filter(child=>child.matches(PREVIEW_OPTION_SELECTOR)).length
          : 1;
        option.style.position="relative";
        option.style.zIndex=String(groupSize*2+2);
      });
    }

    function animateActiveMove(options,before){
      options.forEach(option=>{
        const from=before.get(option);
        if(!from)return;

        const to=option.getBoundingClientRect();
        const dx=from.left-to.left;
        const dy=from.top-to.top;
        if(Math.abs(dx)<.5&&Math.abs(dy)<.5)return;

        trackPreviewAnimation(
          option,
          [
            {transform:`translate(${dx}px, ${dy}px)`},
            {transform:"translate(0, 0)"}
          ],
          {
            duration:PREVIEW_OPTION_MOTION.move,
            easing:PREVIEW_OPTION_MOTION.ease
          }
        );
      });
    }

    function animateOptionLabel(option,show){
      const label=optionLabel(option);
      if(!label)return;

      // Same motion language as the footer:
      // opacity resolves quickly, while the 4px position shift runs for the
      // full capsule-motion duration.
      trackPreviewAnimation(
        label,
        show ? [{opacity:0},{opacity:1}] : [{opacity:1},{opacity:0}],
        {
          duration:PREVIEW_OPTION_MOTION.fade,
          easing:"ease",
          fill:show?"both":"forwards"
        }
      );

      trackPreviewAnimation(
        label,
        show
          ? [{transform:"translateX(-4px)"},{transform:"translateX(0)"}]
          : [{transform:"translateX(0)"},{transform:"translateX(-4px)"}],
        {
          duration:PREVIEW_OPTION_MOTION.move,
          easing:PREVIEW_OPTION_MOTION.ease,
          fill:show?"both":"forwards"
        }
      );
    }

    function floatOption(option,rect,zIndex=1){
      rememberMotionStyle(option);
      Object.assign(option.style,{
        position:"fixed",
        left:px(rect.left),
        top:px(rect.top),
        width:px(rect.width),
        height:px(rect.height),
        margin:"0",
        pointerEvents:"none",
        zIndex:String(zIndex),
        overflow:"hidden"
      });
    }

    function boxFrame(rect){
      return {
        left:px(rect.left),
        top:px(rect.top),
        width:px(rect.width)
      };
    }

    function animateBox(element,from,to){
      trackPreviewAnimation(
        element,
        [boxFrame(from),boxFrame(to)],
        {
          duration:PREVIEW_OPTION_MOTION.move,
          easing:PREVIEW_OPTION_MOTION.ease,
          fill:"forwards"
        }
      );
    }

    function stackedRect(optionRect,targetRect){
      const width=Math.min(optionRect.width,targetRect.width);
      return {
        left:targetRect.left+(targetRect.width-width)/2,
        top:targetRect.top+(targetRect.height-optionRect.height)/2,
        width
      };
    }

    function schedulePreviewCleanup(token,cleanup){
      previewOptionCleanupTimer=setTimeout(()=>{
        if(token!==previewOptionMotionToken)return;
        cleanup();
        previewOptionCleanupTimer=null;
      },PREVIEW_OPTION_MOTION.move+20);
    }

    function collapsePreviewOptions(){
      const inactive=inactivePreviewOptions();
      const active=activePreviewOptions();

      if(matchMedia("(prefers-reduced-motion: reduce)").matches){
        inactive.forEach(option=>option.classList.add("preview-option-hidden"));
        return;
      }

      const token=++previewOptionMotionToken;
      const activeBefore=captureRects(active);
      const inactiveBefore=captureRects(inactive);
      const stackInfo=new Map(inactive.map(option=>[option,previewStackInfo(option)]));

      raiseActiveOptions(active);

      inactive.forEach(option=>{
        const info=stackInfo.get(option);
        floatOption(option,inactiveBefore.get(option),info?.zIndex||1);
        animateOptionLabel(option,false);
      });

      const activeAfter=captureRects(active);
      animateActiveMove(active,activeBefore);

      inactive.forEach(option=>{
        const from=inactiveBefore.get(option);
        const info=stackInfo.get(option);
        const targetRect=info?.target?activeAfter.get(info.target):null;

        if(!from||!targetRect){
          trackPreviewAnimation(
            option,
            [{opacity:1},{opacity:0}],
            {
              duration:PREVIEW_OPTION_MOTION.fade,
              easing:"ease",
              fill:"forwards"
            }
          );
          return;
        }

        animateBox(option,from,stackedRect(from,targetRect));
      });

      schedulePreviewCleanup(token,()=>{
        inactive.forEach(option=>{
          option.classList.add("preview-option-hidden");
          restoreMotionStyle(option);
        });
        active.forEach(restoreMotionStyle);
      });
    }

    function expandPreviewOptions(){
      const inactive=inactivePreviewOptions();
      const active=activePreviewOptions();

      if(matchMedia("(prefers-reduced-motion: reduce)").matches){
        inactive.forEach(option=>option.classList.remove("preview-option-hidden"));
        return;
      }

      const token=++previewOptionMotionToken;
      const activeBefore=captureRects(active);
      const stackInfo=new Map(inactive.map(option=>[option,previewStackInfo(option)]));
      const uniqueTargets=[
        ...new Set(
          [...stackInfo.values()]
            .map(info=>info?.target)
            .filter(Boolean)
        )
      ];
      const targetBefore=captureRects(uniqueTargets);

      // Put the real controls back into layout invisibly first. This establishes
      // their true final positions without showing a temporary clone or causing
      // a clone→real-element handoff at the end.
      inactive.forEach(option=>{
        option.classList.remove("preview-option-hidden");
        rememberMotionStyle(option);
        option.style.visibility="hidden";
      });

      const inactiveAfter=captureRects(inactive);

      // The selected controls now sit at their edit-mode positions. FLIP them
      // smoothly from the compact preview positions to those final positions.
      raiseActiveOptions(active);
      animateActiveMove(active,activeBefore);

      inactive.forEach(option=>{
        const to=inactiveAfter.get(option);
        const info=stackInfo.get(option);
        const targetRect=info?.target?targetBefore.get(info.target):null;
        if(!to)return;

        const label=optionLabel(option);
        if(label){
          label.style.opacity="0";
          label.style.transform="translateX(-4px)";
        }

        option.style.visibility="visible";
        option.style.position="relative";
        option.style.zIndex=String(info?.zIndex||1);
        option.style.transformOrigin="50% 50%";
        option.style.overflow="hidden";

        if(!targetRect){
          animateOptionLabel(option,true);
          return;
        }

        const startWidth=Math.min(to.width,targetRect.width);
        const startScaleX=startWidth/to.width;
        const startCenterX=targetRect.left+targetRect.width/2;
        const startCenterY=targetRect.top+targetRect.height/2;
        const endCenterX=to.left+to.width/2;
        const endCenterY=to.top+to.height/2;
        const dx=startCenterX-endCenterX;
        const dy=startCenterY-endCenterY;

        // The real card begins visually underneath its selected target, then
        // slides out while returning from the stacked width to its natural width.
        // Because the actual DOM element is used throughout, there is no visible
        // swap at the end of the animation.
        trackPreviewAnimation(
          option,
          [
            {transform:`translate(${dx}px, ${dy}px) scaleX(${startScaleX})`},
            {transform:"translate(0, 0) scaleX(1)"}
          ],
          {
            duration:PREVIEW_OPTION_MOTION.move,
            easing:PREVIEW_OPTION_MOTION.ease
          }
        );

        animateOptionLabel(option,true);
      });

      schedulePreviewCleanup(token,()=>{
        inactive.forEach(option=>{
          const label=optionLabel(option);
          if(label){
            label.style.removeProperty("opacity");
            label.style.removeProperty("transform");
          }
          restoreMotionStyle(option);
        });
        active.forEach(restoreMotionStyle);
      });
    }

    if(previewBtn&&recordFooter&&recordApp)previewBtn.onclick=()=>{
      autoSaveNow(v);

      const on=!recordFooter.classList.contains("preview-mode");
      clearTimeout(previewUnlockTimer);

      if(on){
        // Close the keyboard before locking the form.
        if(document.activeElement instanceof HTMLElement){
          document.activeElement.blur();
        }

        stopPreviewOptionMotion(false);
        recordApp.classList.add("preview-mode");
        document.querySelectorAll(".card").forEach(card=>card.setAttribute("inert",""));
        recordFooter.classList.add("preview-mode");
        collapsePreviewOptions();

        previewBtn.setAttribute("aria-pressed","true");
        previewBtn.setAttribute("aria-label","プレビューを閉じる");
        return;
      }

      stopPreviewOptionMotion(true);
      recordFooter.classList.remove("preview-mode");
      recordApp.classList.remove("preview-mode");
      expandPreviewOptions();
      previewBtn.setAttribute("aria-pressed","false");
      previewBtn.setAttribute("aria-label","プレビュー");

      previewUnlockTimer=setTimeout(()=>{
        // If preview was reopened during the morph, keep it locked.
        if(recordFooter.classList.contains("preview-mode")) return;
        document.querySelectorAll(".card").forEach(card=>card.removeAttribute("inert"));
      },400);
    };

    document.querySelectorAll("[data-dt-part]").forEach(select=>{
      select.onchange=()=>{
        const part=select.dataset.dtPart;
        const raw=select.value;
        if(part==="time"){
          const [hour,minute]=raw.split(":").map(Number);
          v.dt.hour=hour;
          v.dt.minute=minute;
        }else if(part==="duration"){
          v.duration=Number(raw);
        }else{
          v.dt[part]=Number(raw);
        }
        refreshDateTimeBlocks(v);
        autoSaveNow(v);
      };
    });

    document.querySelectorAll("[data-type]").forEach(b=>b.onclick=()=>{
      document.querySelectorAll("[data-type]").forEach(x=>{
        const selected=x===b;
        x.classList.toggle("active",selected);
        x.setAttribute("aria-pressed",String(selected));
      });
      v.type=b.dataset.type;
      autoSaveNow(v);
    });

    document.querySelectorAll("[data-instructor]").forEach(b=>b.onclick=()=>{
      document.querySelectorAll("[data-instructor]").forEach(x=>{
        const selected=x===b;
        x.classList.toggle("active",selected);
        x.setAttribute("aria-pressed",String(selected));
      });
      v.instructor=b.dataset.instructor;
      autoSaveNow(v);
    });

    const subjectButtons=[...document.querySelectorAll("#subjectChoices [data-subject]")];
    subjectButtons.forEach(b=>b.onclick=()=>{
      const selected=subjectButtons.filter(x=>x.classList.contains("active"));
      if(b.classList.contains("active")&&selected.length===1)return;
      b.classList.toggle("active");
      b.setAttribute("aria-pressed",String(b.classList.contains("active")));
      v.subjects=subjectButtons.filter(x=>x.classList.contains("active")).map(x=>x.dataset.subject);
      autoSaveNow(v);
    });

    const mat=document.getElementById("material");
    const pageInputs=[
      document.getElementById("pageFrom"),
      document.getElementById("pageTo")
    ];
    const unitDisplay=document.getElementById("unitDisplay");
    const reviewUnitPrompt=document.getElementById("reviewUnitPrompt");

    const currentMaterialRanges=()=>{
      const from=pageInputs[0]?.value||"";
      const to=pageInputs[1]?.value||"";
      return (from||to)?[{from,to}]:[];
    };

    const updateUnit=()=>{
      const ranges=currentMaterialRanges();
      const units=unitListForRanges(mat?.value,ranges);

      if(unitDisplay){
        unitDisplay.innerHTML=units.length
          ? '<span class="material-unit-track">'+units.map(esc).join(" ／ ")+'</span>'
          : "";
        unitDisplay.scrollLeft=0;
      }

      reviewUnitPrompt?.classList.toggle(
        "hidden",
        !materialNeedsUnitPrompt(mat?.value,ranges)
      );
    };

    pageInputs.forEach(input=>{
      input.oninput=()=>{
        updateUnit();
        scheduleAutoSave(v);
      };
    });

    mat.onchange=()=>{
      document.getElementById("customMaterialWrap").classList.toggle("hidden",mat.value!=="__custom__");
      updateUnit();
      autoSaveNow(v);
    };

    document.getElementById("review").oninput=e=>{
      document.getElementById("reviewCount").textContent=e.target.value.length+"文字";
      scheduleAutoSave(v);
    };

    document.getElementById("prevBtn").onclick=()=>{state.showPrev=!state.showPrev;renderHistory()};
    document.getElementById("historyBtn").onclick=()=>{state.showHistory=!state.showHistory;renderHistory()};

    document.querySelectorAll("[data-rating]").forEach(b=>b.onclick=()=>{
      state.rating=b.dataset.rating;
      document.querySelectorAll("[data-rating]").forEach(x=>x.classList.toggle("active",x.dataset.rating===state.rating));
      autoSaveNow(v);
    });

    document.querySelectorAll("[data-forgot]").forEach(b=>b.onclick=()=>{
      const x=b.dataset.forgot;
      if(x==="なし")state.forgot=new Set(["なし"]);
      else{
        state.forgot.delete("なし");
        state.forgot.has(x)?state.forgot.delete(x):state.forgot.add(x);
        if(!state.forgot.size)state.forgot.add("なし");
      }
      document.querySelectorAll("[data-forgot]").forEach(z=>z.classList.toggle("active",state.forgot.has(z.dataset.forgot)));
      document.getElementById("forgotOtherWrap").classList.toggle("open",state.forgot.has("その他"));
      autoSaveNow(v);
    });

    ["customMaterial","homeworkComment","nextHomework","forgotOther","note"].forEach(id=>{
      const el=document.getElementById(id);
      if(el)el.addEventListener("input",()=>scheduleAutoSave(v));
    });
  }

  function renderHistory(){
    const l=getLesson(),a=document.getElementById("historyArea");
    const oldHeight=a.getBoundingClientRect().height;
    let items=[];
    if(state.showPrev&&l.history[0])items=[l.history[0]];
    if(state.showHistory)items=l.history;

    a.innerHTML=items.map(h=>'<div class="history-item"><div class="history-date">'+esc(h.date)+'</div><div>'+esc(h.text)+'</div></div>').join("");
    a.style.height="auto";
    const newHeight=a.getBoundingClientRect().height;

    if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){
      a.style.height="";
      a.style.opacity=newHeight?"1":"0";
      return;
    }

    a.style.height=oldHeight+"px";
    a.style.overflow="hidden";
    const anim=a.animate(heightSpringFrames(oldHeight,newHeight,26),{
      duration:420,easing:"linear",fill:"both"
    });
    a.animate([
      {opacity:oldHeight?1:0,transform:oldHeight?"translateY(0)":"translateY(6px)"},
      {opacity:newHeight?1:0,transform:"translateY(0)"}
    ],{duration:220,easing:"cubic-bezier(.16,1,.3,1)",fill:"both"});
    anim.onfinish=()=>{
      a.style.height=newHeight+"px";
      anim.cancel();
      requestAnimationFrame(()=>{a.style.height="";a.style.overflow=""});
    };
  }
  window.addEventListener("resize",()=>requestAnimationFrame(fitRecordHorizontalControls),{passive:true});
  renderList();
})();
</script>
</body>
</html>
