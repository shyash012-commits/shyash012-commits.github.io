<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3f5f7">
<title>授業記録システム v0.1</title>
<style>
:root{
  --bg:#f3f5f7;--card:#fff;--text:#1f2933;--sub:#6b7280;--line:#d7dde4;
  --primary:#315b8a;
  --body-radius:10.5px;
  --motion-dur:.21s;
  --motion-ease:cubic-bezier(.22,.72,.26,1);
  --fade-dur:.10s
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Yu Gothic",sans-serif;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:clip}
body{min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{touch-action:manipulation}
.app{max-width:720px;margin:0 auto;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
.header{
  --header-icon-size:30px;
  --header-curve-gap:6px;
  --header-control-height:calc(var(--header-icon-size) + var(--header-curve-gap)*2);
  --header-control-radius:calc(var(--header-icon-size)/2 + var(--header-curve-gap));
  position:sticky;top:0;z-index:20;
  background:rgba(255,255,255,.96);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-bottom:0;
  margin:0 -16px;
  padding:calc(10px + env(safe-area-inset-top)) 10px 10px
}
html.line-inapp .app{
  padding-top:var(--line-header-height,0px);
}
html.line-inapp .header{
  position:fixed;
  top:0;
  left:50%;
  width:100%;
  max-width:720px;
  margin:0;
  transform:translateX(-50%);
}
.header-row{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:8px
}
.header-center{
  text-align:center;
  min-width:0;
  height:var(--header-control-height);
  display:flex;
  justify-content:center;
  align-items:center
}
.header-title{
  font-size:17px;
  font-weight:700;
  letter-spacing:.01em;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  white-space:nowrap;
  line-height:1;
  height:var(--header-control-height)
}
.header-grade{
  display:inline-flex;
  align-items:center;
  line-height:1
}
.header-sep{
  width:1px;
  height:22px;
  background:#b8c1cb;
  display:inline-block;
  align-self:center;
  margin-left:1px;
  margin-right:-1px;
  font-size:0;
  line-height:0;
  flex:0 0 1px
}
.header-right{display:flex;justify-content:flex-end}
.header-left{display:flex;justify-content:flex-start}

.header-action{
  height:var(--header-control-height);
  border-radius:var(--header-control-radius);
  display:grid;
  align-items:center;
  border:1.25px solid #cbd3dc;
  background:#fff;
  font-weight:700;
  font-size:16px;
  white-space:nowrap;
  line-height:1;
  -webkit-tap-highlight-color:transparent;
  appearance:none;
  -webkit-appearance:none;
  transition:
    background-color .16s ease,
    border-color .16s ease,
    color .16s ease,
    transform .12s ease,
    box-shadow .16s ease,
    opacity .16s ease
}
.header-action .header-icon{
  width:var(--header-icon-size);
  height:var(--header-icon-size);
  border-radius:50%;
  display:grid;
  place-items:center;
  justify-self:center;
  align-self:center
}
.header-action .header-icon svg{
  width:20px;
  height:20px;
  display:block;
  fill:none;
  stroke:currentColor;
  stroke-width:2.15;
  stroke-linecap:round;
  stroke-linejoin:round;
  shape-rendering:geometricPrecision
}
.icon-back-svg{transform:translateX(-0.45px)}
.icon-submit-svg{transform:translateY(-0.7px)}
.header-action > span:not(.header-icon){
  display:block;
}
/*
  同心円ルール：
  外カプセル高 42px → 端の半径 21px
  内円 30px → 半径 15px
  21 - 15 = 6px
  左右端の42pxゾーンの中心に内円を置くことで、
  CSS上でも円周間距離を常に6pxにする。
*/
.header-back{
  grid-template-columns:var(--header-control-height) auto;
  column-gap:2px;
  padding:0 12px 0 0;
  color:var(--text)
}
.header-back .header-icon{
  border:1.25px solid #aeb8c3;
  color:#243140;
  transition:
    background-color .16s ease,
    border-color .16s ease,
    color .16s ease,
    transform .12s ease
}
.header-submit{
  grid-template-columns:auto var(--header-control-height);
  column-gap:2px;
  padding:0 0 0 12px;
  color:#fff;
  background:linear-gradient(180deg,#2f8cff 0%, #2278ef 100%);
  border-color:#2278ef;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12)
}
.header-submit .header-icon{
  border:0;
  color:#2278ef;
  transition:
    background-color .16s ease,
    color .16s ease,
    transform .12s ease,
    opacity .16s ease
}
.header-back .header-icon,
.header-submit .header-icon{
  background:#fff;
  box-shadow:none;
}
/* 参照モックに合わせたタップ時の見え方 */
.header-back:active,
.header-back.is-pressed{
  background:#edf3f8;
  border-color:#d4dde7;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55)
}
.header-back:active .header-icon,
.header-back.is-pressed .header-icon{
  background:#fff;
  border-color:#96a4b2;
  color:#243140
}
.header-submit:active,
.header-submit.is-pressed{
  background:linear-gradient(180deg,#247cf1 0%, #1a67da 100%);
  border-color:#1a67da;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10)
}
.header-submit:active .header-icon,
.header-submit.is-pressed .header-icon{
  background:#fff;
  color:#1a67da
}
.header-action:active,
.header-action.is-pressed{transform:scale(.985)}
.badge{display:inline-block;border-radius:999px;padding:6px 10px;background:#e9edf1;color:#55606d;font-size:12px}.badge.done{background:#e7f3ea;color:#28663a}
.page-title{font-size:22px;font-weight:700;margin:20px 0 4px}.page-sub{font-size:14px;color:var(--sub);margin-bottom:14px}
.lesson-list{display:grid;gap:12px;margin-top:14px}
.lesson-card{width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--body-radius);padding:16px;display:grid;grid-template-columns:66px 1fr auto;gap:12px;align-items:center}
.lesson-time{font-weight:700}.lesson-name{font-size:18px;font-weight:700}.lesson-meta{font-size:14px;color:var(--sub);margin-top:3px}
.build-id{
  margin-top:12px;
  text-align:right;
  font-size:11px;
  font-weight:600;
  color:#9aa3ad;
  letter-spacing:.01em;
  user-select:text;
}
.record-section{
  --record-list-inset:15px;
  --record-status-size:10.5px;
  --record-mark-size:10.5px;
  --record-mark-stroke:1.75px;
  --record-mark-optical-y:.5px;
  --record-label-gap:7px;
  --record-half-label-gap:3.5px;
  --record-field-gap:8px;
  --record-content-gap:12px;
  --record-item-gap:16px;
  --record-horizontal-space-preferred:10px;
  --record-horizontal-space-min:6px;
  --record-horizontal-space:var(--record-horizontal-space-preferred);
  --record-color-dur:.15s;
  --record-color-ease:cubic-bezier(.22,.72,.26,1);

  /* Body controls stay flat; header/footer own the glossy material language. */
  --record-control-height:42px;
  --record-section-title-font-size:20px;
  --record-card-title-font-size:18px;
  --record-control-font-size:16px;
  --record-label-font-size:14px;
  --record-textarea-line-height:1.65;
  --record-textarea-visual-inset:12px;
  --record-textarea-half-leading:.325em;
  --record-control-font-weight:700;
  --record-control-bg:#fff;
  --record-control-border:#cbd3dc;
  --record-control-text:#56616e;
  --record-control-active-bg:#dce9f7;
  --record-control-active-border:#7fa3cc;
  --record-control-active-text:#234e7a;
  --record-control-pressed-bg:#f2f5f8;
  --record-control-active-pressed-bg:#d2e2f3;
  --record-control-active-pressed-border:#6f95c0;

  --record-control-inset:calc(var(--record-status-size) + var(--record-half-label-gap));
  --record-divider-start:calc(var(--record-list-inset) + var(--record-control-inset));
  margin:0;
  padding-top:20px;
  padding-bottom:var(--record-item-gap);
  scroll-margin-top:86px;
  display:grid;
  row-gap:var(--record-item-gap);
}

/* Preview shows only the values that were actually selected. */
.app.preview-mode .record-section{
  --record-control-active-bg:#dcf7e9;
  --record-control-active-border:#7fcca3;
  --record-control-active-text:#237a4b;
  --record-control-active-pressed-bg:#d2f3e1;
  --record-control-active-pressed-border:#6fc095;
}
.preview-option-hidden{
  display:none!important;
}
.record-section-title{
  margin:0 4px 0;
  display:flex;
  align-items:center;
  gap:8px;
  font-size:var(--record-section-title-font-size);
  font-weight:800;
  line-height:1.2;
  letter-spacing:.01em;
}
.record-section-title::before{
  content:"";
  width:3px;
  height:1.15em;
  flex:0 0 3px;
  border-radius:999px;
  background:#44515e;
  transform:translateY(var(--record-mark-optical-y));
  transition:background-color var(--record-color-dur) var(--record-color-ease);
}
.record-section.is-current .record-section-title::before{
  background:#2278ef;
}
.app.preview-mode .record-section.is-current .record-section-title::before{
  background:#2faa68;
}
.record-section-title::after{
  content:"";
  height:1px;
  flex:1 1 auto;
  background:#cbd3dc;
}
.record-section .card-title-row{
  display:flex;
  align-items:baseline;
  gap:var(--record-label-gap);
  min-height:calc(var(--record-card-title-font-size) + 4px);
  margin:0 0 var(--record-content-gap);
}
.record-section .card-title-row .card-title{margin:0}
.material-card-title{
  display:inline-flex;
  align-items:baseline;
  flex:0 0 auto;
  line-height:1.2;
}
.material-card-number-slot{
  display:inline-block;
  width:1em;
  max-width:0;
  flex:0 0 auto;
  overflow:hidden;
  white-space:nowrap;
  opacity:0;
  line-height:1.2;
  transform:translateX(-4px);
  will-change:max-width,opacity,transform;
  transition:
    max-width var(--motion-dur) var(--motion-ease),
    transform var(--motion-dur) var(--motion-ease),
    opacity var(--fade-dur) ease;
}
.material-card-number-slot.is-visible{
  max-width:1em;
  opacity:1;
  transform:translateX(0);
}
.record-section .inline-auto-hint{
  min-width:0;
  margin:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* Preview rule: keep recorded values; remove edit/reference-only affordances. */
.preview-edit-hint{
  display:inline-block;
  max-width:14em;
  overflow:hidden;
  opacity:1;
  transform:translateX(0);
  transition:
    max-width var(--motion-dur) var(--motion-ease),
    transform var(--motion-dur) var(--motion-ease),
    opacity var(--fade-dur) ease;
  will-change:max-width,opacity,transform;
}
.app.preview-mode .preview-edit-hint{
  max-width:0;
  opacity:0;
  transform:translateX(-4px);
}

.vt-review .counter{
  max-height:1.5em;
  overflow:hidden;
  opacity:1;
  transform:translateX(0);
  transition:
    max-height var(--motion-dur) var(--motion-ease),
    margin-top var(--motion-dur) var(--motion-ease),
    transform var(--motion-dur) var(--motion-ease),
    opacity var(--fade-dur) ease;
}
.app.preview-mode .vt-review .counter{
  max-height:0;
  margin-top:0;
  opacity:0;
  transform:translateX(-4px);
}

.app.preview-mode .vt-review #review::placeholder{
  opacity:0;
}
.vt-review #review::placeholder{
  transition:opacity var(--fade-dur) ease;
}

.app.preview-mode .vt-material .record-select-icon{
  opacity:0;
}
.vt-material .record-select-icon{
  opacity:1;
  transition:
    opacity var(--fade-dur) ease,
    color var(--record-color-dur) var(--record-color-ease);
}

.review-prev-row{
  max-height:1.5em;
  overflow:hidden;
  opacity:1;
  transform:translateX(0);
  transition:
    max-height var(--motion-dur) var(--motion-ease),
    margin-top var(--motion-dur) var(--motion-ease),
    transform var(--motion-dur) var(--motion-ease),
    opacity var(--fade-dur) ease;
}
.app.preview-mode .review-prev-row{
  max-height:0;
  margin-top:0;
  opacity:0;
  transform:translateX(-4px);
  pointer-events:none;
}
.app.preview-mode .previous-review-reveal{
  grid-template-rows:0fr;
}
.app.preview-mode .previous-review-content{
  opacity:0;
  transform:translateX(-4px);
}

/* Rounded square = content/input state. */
.record-section .card-status{
  position:relative;
  width:var(--record-status-size);
  height:var(--record-status-size);
  flex:0 0 var(--record-status-size);
  box-sizing:border-box;
  transform:translateY(var(--record-mark-optical-y));
  align-self:center;
  border:var(--record-mark-stroke) solid #56616e;
  border-radius:25%;
  background:#fff;
  transition:
    background-color var(--record-color-dur) var(--record-color-ease),
    border-color var(--record-color-dur) var(--record-color-ease);
}
.record-section .card.is-complete .card-status{
  background:#56616e;
  border-color:#56616e;
}

/* Color means current location, not completion. */
.record-section.is-current .card-status{
  border-color:#2278ef;
}
.record-section.is-current .card.is-complete .card-status{
  background:#2278ef;
  border-color:#2278ef;
}
.app.preview-mode .record-section.is-current .card-status{
  border-color:#2faa68;
}
.app.preview-mode .record-section.is-current .card.is-complete .card-status{
  background:#2faa68;
  border-color:#2faa68;
}

/* Record cards are list items, not enclosing boxes. */
.record-section .card{
  position:relative;
  background:transparent;
  border:0;
  border-radius:0;
  margin:0;
  padding:0 4px var(--record-item-gap) var(--record-list-inset);
}
.record-section .card::after{
  content:"";
  position:absolute;
  left:var(--record-divider-start);
  right:4px;
  bottom:0;
  height:1px;
  background:#d7dde4;
}

/* Body and separator share the midpoint between status square and title. */
.record-section .card-body{
  margin-left:var(--record-control-inset);
  min-width:0;
}

.card-title{font-size:var(--record-card-title-font-size);font-weight:700;line-height:1.2;margin:0 0 4px}.hint{font-size:var(--record-label-font-size);color:var(--sub);margin:0 0 12px}
.readonly{
  min-height:var(--record-control-height,42px);
  display:flex;
  align-items:center;
  border:1px solid var(--line);
  background:#f7f8fa;
  border-radius:var(--body-radius);
  padding:8px var(--record-horizontal-space,10px);
  line-height:1.45;
}

/* Direct-edit date/time blocks */
.datetime-blocks{
  display:flex;
  align-items:center;
  gap:var(--record-horizontal-space);
  min-width:0;
  width:100%;
}
.datetime-main{
  display:flex;
  align-items:center;
  gap:var(--record-horizontal-space);
  min-width:0;
}
.datetime-blocks.datetime-wrap{
  flex-wrap:wrap;
}
.datetime-blocks.datetime-wrap .datetime-duration{
  margin-left:var(--record-control-inset);
}
.datetime-main .dt-block,
.datetime-blocks > .dt-block{
  flex:0 0 auto;
}
.datetime-duration{
  margin-left:auto;
}
.datetime-end-time{
  flex:0 0 auto;
  font-size:var(--record-control-font-size);
  font-weight:var(--record-control-font-weight);
  color:var(--record-control-text);
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.dt-block{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:auto;
  height:var(--record-control-height);
  min-width:0;
  border:1px solid #cbd3dc;
  background:#f7f8fa;
  border-radius:var(--body-radius);
  padding:0 var(--record-horizontal-space);
  font-weight:var(--record-control-font-weight);
  font-size:var(--record-control-font-size);
  color:var(--record-control-text);
  white-space:nowrap;
  box-shadow:0 1px 0 rgba(31,41,51,.02);
  -webkit-appearance:none;
  appearance:none;
  text-align:center;
  text-align-last:center;
}
.dt-block:active{background:#eef2f6}

.field{margin-top:var(--record-item-gap)}.label{display:block;font-size:var(--record-label-font-size);font-weight:600;margin-bottom:var(--record-field-gap)}
.material-entries{
  display:grid;
}
.material-entry-shell{
  display:grid;
  grid-template-rows:1fr;
  overflow:visible;
  transition:grid-template-rows var(--motion-dur) var(--motion-ease);
}
.material-entry-shell.is-collapsed{
  grid-template-rows:0fr;
}
.material-entry-clip{
  min-height:0;
  overflow:hidden;
}
.material-entry-content{
  position:relative;
  min-width:0;
  padding-top:calc(var(--record-item-gap) * 2 + 1px);
  transition:padding-top var(--motion-dur) var(--motion-ease);
}

/* Footer grammar:
   the shell clips the content while its size changes.
   Do not fade the whole material set; only label-like text fades/moves. */
.material-entry-shell.is-collapsed .material-entry-heading{
  opacity:0;
  transform:translateX(-4px);
}
.material-entry-content::before{
  content:"";
  position:absolute;
  top:var(--record-item-gap);
  left:0;
  right:0;
  height:1px;
  background:var(--line);
  opacity:1;
  transition:opacity var(--fade-dur) ease;
}
.material-entry-heading{
  display:flex;
  align-items:center;
  height:calc(var(--record-card-title-font-size) + 4px);
  overflow:hidden;
  line-height:1.2;
  margin-bottom:var(--record-content-gap);
  opacity:1;
  transform:translateX(0);
  transition:
    height var(--motion-dur) var(--motion-ease),
    margin-bottom var(--motion-dur) var(--motion-ease),
    transform var(--motion-dur) var(--motion-ease),
    opacity var(--fade-dur) ease;
}
.material-entry-shell.is-primary .material-entry-content{
  padding-top:0;
}
.material-entry-shell.is-primary .material-entry-content::before{
  opacity:0;
}
.material-entry-shell.is-primary .material-entry-heading{
  height:0;
  margin-bottom:0;
  opacity:0;
  transform:translateX(-4px);
  pointer-events:none;
}
.material-entry-title{
  font-size:var(--record-card-title-font-size);
  font-weight:700;
  line-height:1.2;
}
.material-entry{
  display:grid;
  gap:var(--record-item-gap);
}
.material-entry>.field,
.material-detail-field{
  margin-top:0;
}
.material-selection-stack{
  display:grid;
}
.material-custom-shell{
  display:grid;
  grid-template-rows:0fr;
  pointer-events:none;
  transition:grid-template-rows var(--motion-dur) var(--motion-ease);
}
.material-custom-shell.is-open{
  grid-template-rows:1fr;
  pointer-events:auto;
}
.material-custom-clip{
  min-height:0;
  overflow:hidden;
}
.material-custom-content{
  padding-top:var(--record-item-gap);
  opacity:0;
  transform:translateX(-4px);
  transition:
    transform var(--motion-dur) var(--motion-ease),
    opacity var(--fade-dur) ease;
}
.material-custom-shell.is-open .material-custom-content{
  opacity:1;
  transform:translateX(0);
}
.material-custom-field{
  margin-top:0;
}
.material-range-list{
  display:grid;
  gap:var(--record-item-gap);
}
.material-range-shell{
  display:grid;
  grid-template-rows:1fr;
  transition:grid-template-rows var(--motion-dur) var(--motion-ease);
}
.material-range-shell.is-collapsed{
  grid-template-rows:0fr;
}
.material-range-clip{
  min-height:0;
  overflow:hidden;
}
.material-range-content{
  position:relative;
  min-width:0;
}
.material-range-delete{
  position:absolute;
  top:0;
  right:0;
  padding:0;
  border:0;
  background:none;
  color:var(--primary);
  font-size:var(--record-label-font-size);
  font-weight:600;
  line-height:1.2;
  white-space:nowrap;
}
.material-range-add-action{
  gap:6px;
  margin-top:0;
}
.app.preview-mode .material-range-add-action,
.app.preview-mode .material-range-delete{
  display:none;
}
.material-detail-stack{
  --material-page-input-width:calc(3ch + var(--record-horizontal-space)*2 + 6px);
  --material-range-separator-width:var(--record-control-font-size);
  --material-left-track-width:calc(

/* iPhone landscape: keep every section-navigation capsule open.
   Colors/states remain exactly the same as portrait. */
@media (orientation:landscape) and (max-height:500px) and (min-width:600px){
  /* Open every section capsule using the exact same geometry as
     the portrait active capsule. Only visibility changes here;
     each item's portrait color/state rules continue to win. */
  .record-nav-item,
  .record-nav-item.active,
  .record-footer.preview-mode .record-nav-item,

<body>
<div id="app"></div>
<script>
(() => {
  const IS_LINE_INAPP=/\bLine\//i.test(navigator.userAgent);
  document.documentElement.classList.toggle("line-inapp",IS_LINE_INAPP);

  const STORAGE_KEY="lesson-record-v01-github";
  const BUILD_ID="2026-09-21 16:20";
  const SUBJECTS=["国語","数学","英語","理科","社会"];
  const INSTRUCTORS=["石井","田中","佐々木"];

  function isElementaryGrade(grade){
    return String(grade||"").startsWith("小");
  }

  function subjectsForGrade(grade){
    return SUBJECTS.map(subject=>
      isElementaryGrade(grade)&&subject==="数学"?"算数":subject
    );
  }

  function normalizeSubjectForGrade(subject,grade){
    if(isElementaryGrade(grade)&&subject==="数学")return "算数";
    if(!isElementaryGrade(grade)&&subject==="算数")return "数学";
    return subject;
  }
  const now=new Date(), Y=now.getFullYear(), M=now.getMonth()+1, D=now.getDate();

  const materialDb={
    "小学5年 算数 標準問題集":[{from:42,to:49,unit:"分数のたし算・ひき算"},{from:50,to:57,unit:"分数と小数"},{from:58,to:65,unit:"割合"}],
    "新中学問題集 数学2年":[{from:36,to:47,unit:"連立方程式"},{from:48,to:55,unit:"連立方程式の利用"},{from:56,to:73,unit:"一次関数"}],
    "計算トレーニング 数学2年":[{from:22,to:33,unit:"連立方程式の計算"}],
    "新中学問題集 英語2年":[{from:40,to:51,unit:"不定詞"},{from:52,to:63,unit:"動名詞"}],
    "標準問題集 国語3年":[{from:18,to:29,unit:"説明的文章の読解"},{from:30,to:41,unit:"文学的文章の読解"}]
  };

  const lessons=[
    {id:"l0",student:"山田 葵",familyName:"山田",givenName:"葵",familyKana:"やまだ",givenKana:"あおい",grade:"小5",subject:"算数",instructor:"石井",hour:15,minute:40,type:"通常",materials:["小学5年 算数 標準問題集"],prevHomework:"小学5年 算数 標準問題集 p.46〜47",history:[
      {date:"2026/09/12",hour:15,minute:40,instructor:"石井",text:"通分してから計算する手順を確認しました。分母をそろえる理由を図でも確認し、自力で解ける問題が増えました。"}]},
    {id:"l1",student:"佐藤 陽菜",familyName:"佐藤",givenName:"陽菜",familyKana:"さとう",givenKana:"ひな",grade:"中2",subject:"数学",instructor:"石井",hour:17,minute:0,type:"通常",materials:["新中学問題集 数学2年","計算トレーニング 数学2年"],prevHomework:"新中学問題集 数学2年 p.46〜47 の残り（大問3・4）",history:[
      {date:"2026/09/12",hour:17,minute:0,instructor:"石井",text:"加減法で係数をそろえる手順を確認しました。途中式を省略するとミスが出るため、一行ずつ書く練習を行いました。"},
      {date:"2026/09/05",hour:17,minute:0,instructor:"石井",text:"分数を含む連立方程式を扱いました。分母をはらう処理を確認した後は、自力で解ける問題が増えました。"}]},
    {id:"l2",student:"鈴木 大輝",familyName:"鈴木",givenName:"大輝",familyKana:"すずき",givenKana:"だいき",grade:"中2",subject:"英語",instructor:"田中",hour:18,minute:20,type:"振替",materials:["新中学問題集 英語2年"],prevHomework:"新中学問題集 英語2年 p.46〜47、単語テスト範囲の復習",history:[
      {date:"2026/09/11",hour:18,minute:20,instructor:"石井",text:"不定詞の名詞的用法・副詞的用法の識別を演習しました。英作文ではtoの位置を確認しました。"}]},
    {id:"l3",student:"高橋 芽衣",familyName:"高橋",givenName:"芽衣",familyKana:"たかはし",givenKana:"めい",grade:"中3",subject:"国語",instructor:"石井",hour:19,minute:40,type:"講習",materials:["標準問題集 国語3年"],prevHomework:"標準問題集 国語3年 p.24〜25 の記述問題",history:[
      {date:"2026/09/10",hour:19,minute:40,instructor:"石井",text:"接続語に着目して段落関係を整理しました。記述問題では必要な要素を意識して書けるようになりました。"}]}
  ];

  const state={lessonId:null,records:load(),forgot:new Set(),rating:"",showPrev:false};
  const REDUCED_MOTION_QUERY=window.matchMedia("(prefers-reduced-motion: reduce)");
  const prefersReducedMotion=()=>REDUCED_MOTION_QUERY.matches;

  function load(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}")}catch(e){return {}}}
  function persist(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state.records))}
  function pad(n){return String(n).padStart(2,"0")}
  function lessonBase(l){return {year:Y,month:M,day:D,hour:l.hour,minute:l.minute}}
  function getLesson(){return lessons.find(x=>x.id===state.lessonId)}
  function getRecord(){return state.records[state.lessonId]||null}
  function esc(s){return String(s??"").replace(/[&<>"']/g,c=>c==="&"?"&amp;":c==="<"?"&lt;":c===">"?"&gt;":c==="\""?"&quot;":"&#39;")}
  function unitFor(material,from,to){
    const a=Number(from),b=Number(to||from);
    if(!Number.isFinite(a))return "";
    return (materialDb[material]||[])
      .filter(r=>a<=r.to&&b>=r.from)
      .map(r=>r.unit)
      .join(" / ");
  }

  function unitListForRanges(material,ranges=[]){
    return [...new Set(
      ranges
        .map(range=>unitFor(material,range.from,range.to))
        .flatMap(unit=>unit?unit.split(" / "):[])
        .filter(Boolean)
    )];
  }

  function normalizeMaterialEntry(entry,fallbackMaterial=""){
    const material=entry?.material||fallbackMaterial;
    const customMaterial=entry?.customMaterial||"";
    const ranges=Array.isArray(entry?.ranges)
      ? entry.ranges
          .map(range=>({
            from:String(range?.from??""),
            to:String(range?.to??"")
          }))
          .filter(range=>range.from||range.to)
      : [];

    return {material,customMaterial,ranges};
  }

  const MATERIAL_NUMBERS=[
    "①","②","③","④","⑤","⑥","⑦","⑧","⑨","⑩",
    "⑪","⑫","⑬","⑭","⑮","⑯","⑰","⑱","⑲","⑳"
  ];
  const MATERIAL_MAX=MATERIAL_NUMBERS.length;

  function materialsFromRecord(record,lesson){
    if(Array.isArray(record?.materials)&&record.materials.length){
      return record.materials.slice(0,MATERIAL_MAX).map((entry,index)=>
        normalizeMaterialEntry(entry,index===0?lesson.materials[0]:"")
      );
    }

    const material=record?.material||lesson.materials[0]||"";
    const from=String(record?.pageFrom??"");
    const to=String(record?.pageTo??"");

    return [normalizeMaterialEntry({
      material,
      customMaterial:record?.customMaterial||"",
      ranges:(from||to)?[{from,to}]:[]
    },material)];
  }

  function materialNumberLabel(index){
    return MATERIAL_NUMBERS[index-1]||"";
  }

  function availableMaterialsForLesson(lesson){
    return [...new Set([...lesson.materials,...Object.keys(materialDb)])];
  }

  function previousReviewText(lesson){
    const previous=lesson.history?.[0];
    if(!previous)return "";

    const meta=[];
    if(previous.instructor||lesson.instructor)meta.push(previous.instructor||lesson.instructor);

    if(previous.date){
      const hasStartTime=Number.isInteger(previous.hour)&&Number.isInteger(previous.minute);
      const startTime=hasStartTime?" "+pad(previous.hour)+":"+pad(previous.minute)+"〜":"";
      meta.push(previous.date+startTime);
    }

    return previous.text+(meta.length?"（"+meta.join("・")+"）":"");
  }


  function materialRangeMarkup(range,material,showDelete=false){
    const units=unitListForRanges(material,[range]);

    return '<div class="material-range-shell" data-material-range>'+
      '<div class="material-range-clip">'+
        '<div class="material-range-content">'+
          '<div class="material-detail-stack">'+
            '<div class="material-detail-field"><label class="label material-range-label">ページ範囲<span class="material-range-number hidden" data-range-number><span class="material-range-number-symbol" data-range-number-symbol></span><span data-range-number-index></span></span></label>'+
              '<div class="material-range-controls">'+
                '<input class="material-page-input" data-material-page-from inputmode="numeric" type="number" min="1" aria-label="開始ページ" value="'+esc(range.from||"")+'">'+
                '<span class="material-range-separator" aria-hidden="true">〜</span>'+
                '<input class="material-page-input" data-material-page-to inputmode="numeric" type="number" min="1" aria-label="終了ページ" value="'+esc(range.to||"")+'">'+
              '</div>'+
            '</div>'+
            '<span class="material-relation-line" aria-hidden="true"></span>'+
            '<div class="material-detail-field"><label class="label">単元</label>'+
              '<div class="material-unit-window" data-material-unit aria-label="単元名" aria-readonly="true">'+

  function bindPressFeedback(el){
    if(!el) return;
    const on = ()=>el.classList.add("is-pressed");
    const off = ()=>el.classList.remove("is-pressed");
    el.addEventListener("touchstart", on, {passive:true});
    el.addEventListener("touchend", off);
    el.addEventListener("touchcancel", off);
    el.addEventListener("pointerdown", on);
    el.addEventListener("pointerup", off);
    el.addEventListener("pointerleave", off);
    el.addEventListener("blur", off);
  }

  function writeRecord(v){
    if(!state.lessonId)return;
    const c=capture(v),l=getLesson(),prev=state.records[l.id]||{};
    const {
      subject:_legacySubject,
      material:_legacyMaterial,
      customMaterial:_legacyCustomMaterial,
      pageFrom:_legacyPageFrom,
      pageTo:_legacyPageTo,
      unit:_legacyUnit,
      manualUnit:_legacyManualUnit,
      ...current
    }=prev;
    state.records[l.id]={
      ...current,
      performedAt:c.dt,
      duration:c.duration,
      type:c.type,
      instructor:c.instructor,
      subjects:c.subjects,
      materials:c.materials,
      review:c.review,
      rating:state.rating,
      homeworkComment:c.homeworkComment,
      nextHomework:c.nextHomework,
      forgot:[...state.forgot],
      forgotOther:state.forgot.has("その他")?c.forgotOther:"",
      note:c.note,
      savedAt:new Date().toISOString()
    };
    persist();
    updateFooterCompletion(c);
  }
  function autoSaveNow(v){
    clearTimeout(autoSaveTimer);
    autoSaveTimer=null;
    writeRecord(v);

  function scheduleAutoSave(v,delay=420){
    clearTimeout(autoSaveTimer);

  }

  function springProgress(t){
    if(t<=0)return 0;
    if(t>=1)return 1;
    return 1-Math.exp(-12*t)*(Math.cos(11*t)+0.35*Math.sin(11*t));
  }

  function heightSpringFrames(from,to,steps=30){
    return Array.from({length:steps+1},(_,i)=>{
      const t=i/steps,p=i===steps?1:springProgress(t);
      return {height:(from+(to-from)*p)+"px",offset:t};
    });
  }

    if(!IS_LINE_INAPP)return;

    app.style.setProperty("--line-header-height",height+"px");

    state.lessonId=id;state.showPrev=false;

      materials=materialsFromRecord(r,l);

    const savedSubjects=(Array.isArray(r?.subjects)?r.subjects:(r?.subject?[r.subject]:[]))
      .map(subject=>normalizeSubjectForGrade(subject,l.grade));
    const subjects=subjectOptions.filter(subject=>savedSubjects.includes(subject));
    if(!subjects.length)subjects.push(normalizeSubjectForGrade(l.subject,l.grade));

      dt,
      duration,

      review:r?.review||"",

      nextHomework:r?.nextHomework||"",
      note:r?.note||"",
      forgotOther:r?.forgotOther||"",
      type:r?.type||l.type,
      instructor,
      subjects
    });
  }

  function endTimeLabel(dt,duration){
    const total=(Number(dt.hour)*60+Number(dt.minute)+Number(duration||70))%(24*60);
    return "〜"+pad(Math.floor(total/60))+":"+pad(total%60);
  }

  function datetimeBlocks(v){
    const dt=v.dt;
    const monthOptions=Array.from({length:12},(_,i)=>i+1).map(value=>'<option value="'+value+'" '+(Number(dt.month)===value?'selected':'')+'>'+pad(value)+'月</option>').join("");
    const maxDay=new Date(dt.year,dt.month,0).getDate();
    const dayOptions=Array.from({length:maxDay},(_,i)=>i+1).map(value=>'<option value="'+value+'" '+(Number(dt.day)===value?'selected':'')+'>'+pad(value)+'日</option>').join("");
    const timeOptions=["11:00","13:00","14:20","15:40","17:00","18:20","19:40"].map(value=>'<option value="'+value+'" '+((pad(dt.hour)+':'+pad(dt.minute))===value?'selected':'')+'>'+value+'</option>').join("");
    const durationOptions=[30,70].map(value=>'<option value="'+value+'" '+(Number(v.duration||70)===value?'selected':'')+'>'+value+'分</option>').join("");
    return '<div class="datetime-blocks" aria-label="実施日時">'+
      '<div class="datetime-main">'+
        '<select class="dt-block" data-dt-part="month" aria-label="月を変更">'+monthOptions+'</select>'+
        '<select class="dt-block" data-dt-part="day" aria-label="日を変更">'+dayOptions+'</select>'+
        '<select class="dt-block datetime-start-time" data-dt-part="time" aria-label="開始時刻を変更">'+timeOptions+'</select>'+
        '<span class="datetime-end-time" id="dtEndTimeValue" aria-label="終了時刻">'+endTimeLabel(dt,v.duration)+'</span>'+
      '</div>'+
      '<select class="dt-block datetime-duration" data-dt-part="duration" aria-label="授業時間を変更">'+durationOptions+'</select>'+
    '</div>';
  }

  function horizontalSpacingLimits(root){
    const style=getComputedStyle(root);
    return {
      preferred:parseFloat(style.getPropertyValue("--record-horizontal-space-preferred"))||10,
      minimum:parseFloat(style.getPropertyValue("--record-horizontal-space-min"))||6
    };
  }

  function fitDateTimeControls(){
    const root=document.querySelector(".datetime-blocks");
    if(!root)return;

    const controls=[...root.querySelectorAll(".dt-block")];
    const endTime=root.querySelector(".datetime-end-time");
    if(controls.length!==4||!endTime)return;

    const {preferred,minimum}=horizontalSpacingLimits(root);

    root.classList.remove("datetime-wrap");
    root.style.setProperty("--record-horizontal-space","0px");

    const controlsWidth=controls.reduce((sum,control)=>sum+control.getBoundingClientRect().width,0);
    const endWidth=endTime.getBoundingClientRect().width;
    const available=root.clientWidth;

    // 4 controls × 2 inner paddings + 4 horizontal gaps = 12 equal slots.
    const spacingSlots=controls.length*2+4;
    const fitted=(available-controlsWidth-endWidth)/spacingSlots;
    const spacing=Math.max(minimum,Math.min(preferred,fitted));

    root.style.setProperty("--record-horizontal-space",spacing.toFixed(3)+"px");
    root.classList.toggle("datetime-wrap",fitted<minimum);
  }

  function updateChoiceScrollAffordance(group){
    const shell=group.closest(".card")?.querySelector(".card-title-row .choice-scroll-affordance");
    if(!shell)return;

    const maxScroll=Math.max(0,group.scrollWidth-group.clientWidth);
    const scrollable=maxScroll>1;
    const left=shell.querySelector('[data-scroll-direction="left"]');
    const right=shell.querySelector('[data-scroll-direction="right"]');

    shell.classList.toggle("is-visible",scrollable);
    if(!scrollable)return;

    const current=Math.max(0,group.scrollLeft);
    left?.classList.toggle("is-muted",current<=1);
    right?.classList.toggle("is-muted",current>=maxScroll-1);
  }

  function refreshDateTimeBlocks(v){
    const dt=v.dt;
    const monthEl=document.querySelector('[data-dt-part="month"]');
    const dayEl=document.querySelector('[data-dt-part="day"]');
    const timeEl=document.querySelector('[data-dt-part="time"]');

    const endTimeEl=document.getElementById("dtEndTimeValue");

    if(monthEl)monthEl.value=String(dt.month);
    if(dayEl){
      const maxDay=new Date(dt.year,dt.month,0).getDate();
      if(dt.day>maxDay)dt.day=maxDay;
      dayEl.innerHTML=Array.from({length:maxDay},(_,i)=>i+1).map(value=>'<option value="'+value+'">'+pad(value)+'日</option>').join("");
      dayEl.value=String(dt.day);

    if(timeEl)timeEl.value=pad(dt.hour)+':'+pad(dt.minute);
    if(durationEl)durationEl.value=String(Number(v.duration||70));
    if(endTimeEl)endTimeEl.textContent=endTimeLabel(dt,v.duration);

  function bindRecordFooter(v){
    const targets={
      basic:document.querySelector('[data-record-section="basic"]'),
      lesson:document.querySelector('[data-record-section="lesson"]'),
      homework:document.querySelector('[data-record-section="homework"]'),
      other:document.querySelector('[data-record-section="other"]')
    };

    const headerBottom=()=>{
      const header=document.querySelector(".header");
      if(!header)return 0;
      // Use the header's actual viewport position, not only its height.
      // In in-app browsers (e.g. LINE), the sticky header's rect can be
      // offset while browser chrome / the visual viewport is changing.
      return Math.max(0,header.getBoundingClientRect().bottom);
    };

    const targetDelta=target=>
      target.getBoundingClientRect().top-headerBottom();

    const unlockFooterScroll=(runSpy=true)=>{
      footerScrollLock=null;
      clearTimeout(footerScrollUnlockTimer);
      footerScrollUnlockTimer=null;
      if(runSpy && footerScrollHandler)requestAnimationFrame(footerScrollHandler);
    };

    const finalizeFooterScroll=()=>{
      if(!footerScrollLock)return;

      const target=footerScrollLock.target;
      const delta=targetDelta(target);

      // One exact geometry-based correction after the smooth scroll settles.
      // This absorbs LINE/Safari toolbar and visualViewport changes without
      // changing the section's own 20px top-padding rule.
      if(Math.abs(delta)>.5){
        window.scrollBy({top:delta,behavior:"auto"});
      }

      requestAnimationFrame(()=>unlockFooterScroll(true));
    };

    document.querySelectorAll("[data-footer-section]").forEach(btn=>{
      btn.onclick=()=>{
        const key=btn.dataset.footerSection,target=targets[key];
        if(!target)return;

        const delta=targetDelta(target);

        // During a tap-triggered smooth scroll, keep the tapped tab selected.
        // This prevents the scroll-spy from activating sections merely passed en route.
        footerScrollLock={key,target,started:performance.now()};
        clearTimeout(footerScrollUnlockTimer);
        setFooterActive(key);

        // Scroll by the measured viewport delta. This remains correct even when
        // the sticky header is not sitting at viewport y=0 in an in-app browser.
        window.scrollBy({top:delta,behavior:"smooth"});

        // Final geometry correction after mobile browser chrome has settled.
        footerScrollUnlockTimer=setTimeout(finalizeFooterScroll,900);
      };
    });

    if(footerScrollHandler)window.removeEventListener("scroll",footerScrollHandler);
    let ticking=false;
    footerScrollHandler=()=>{
      if(ticking)return;
      ticking=true;
      requestAnimationFrame(()=>{
        ticking=false;

        if(footerScrollLock){
          const distance=Math.abs(targetDelta(footerScrollLock.target));
          const elapsed=performance.now()-footerScrollLock.started;

          // Keep the requested section active until the scroll actually arrives.
          setFooterActive(footerScrollLock.key);

          if(distance<=1){
            // Do not unlock immediately: the visual viewport can still move
            // for a moment in LINE/Safari. Let finalizeFooterScroll verify it.
            return;
          }
          if(elapsed>1100){
            finalizeFooterScroll();
          }
          return;
        }

        const probe=headerBottom()+24;
        let active="basic";
        [["lesson",targets.lesson],["homework",targets.homework],["other",targets.other]].forEach(([key,target])=>{
          if(target&&target.getBoundingClientRect().top<=probe)active=key;
        });
        setFooterActive(active);
      });
    };
    window.addEventListener("scroll",footerScrollHandler,{passive:true});
    footerScrollHandler();
  }

  function bindRecord(v){
    const l=getLesson();
    const allMaterials=availableMaterialsForLesson(l);

    bindRecordFooter(v);
    updateFooterCompletion(capture(v));
    const backBtn=document.getElementById("backBtn");
    bindPressFeedback(backBtn);
    backBtn.onclick=()=>{
      autoSaveNow(v);
      renderList();
    };

    const submitBtn=document.getElementById("submitBtn");
    bindPressFeedback(submitBtn);
    if(submitBtn)submitBtn.onclick=()=>{
      autoSaveNow(v);
      toast("提出ボタンの動作は次に決めます");
    };

    const previewBtn=document.getElementById("previewBtn");
    const recordFooter=document.querySelector(".record-footer");
    const recordApp=document.querySelector("#app > .app");
    let previewUnlockTimer=null;

    const PREVIEW_OPTION_SELECTOR=".choice-button, .rating button, .chip";
    const PREVIEW_OPTION_GROUP_SELECTOR=".choice-grid, .rating, .chips";
    const PREVIEW_EDITABLE_SELECTOR=".card input, .card textarea, .card select, .card button";

    function setPreviewInteractionLocked(locked){
      document.querySelectorAll(PREVIEW_EDITABLE_SELECTOR).forEach(control=>{
        if(locked)control.setAttribute("inert","");
        else control.removeAttribute("inert");
      });
    }


    function cssTimeToMs(value,fallback){
      const raw=String(value||"").trim();
      if(!raw)return fallback;
      const n=parseFloat(raw);
      if(!Number.isFinite(n))return fallback;
      return raw.endsWith("ms")?n:n*1000;
    }

    const motionStyle=getComputedStyle(recordFooter);
    const MOTION={
      move:cssTimeToMs(motionStyle.getPropertyValue("--motion-dur"),210),
      fade:cssTimeToMs(motionStyle.getPropertyValue("--fade-dur"),100),
      ease:motionStyle.getPropertyValue("--motion-ease").trim()||"cubic-bezier(.22,.72,.26,1)"
    };
    // Shared motion grammar:
    // layout 210ms, X -4px <-> 0 over 210ms, opacity over 100ms.
    // Preview and material interactions use the same timing.

    let previewOptionMotionToken=0;
    let previewOptionCleanupTimer=null;
    let previewOptionAnimations=[];

    const px=value=>value+"px";
    const previewOptions=()=>[...document.querySelectorAll(PREVIEW_OPTION_SELECTOR)];
    const activePreviewOptions=()=>previewOptions().filter(option=>option.classList.contains("active"));
    const inactivePreviewOptions=()=>previewOptions().filter(option=>!option.classList.contains("active"));
    const optionLabel=option=>option.querySelector(".record-option-label");
    const captureRects=elements=>new Map(elements.map(element=>[element,element.getBoundingClientRect()]));

    function rememberMotionStyle(option){
      if(!option.hasAttribute("data-preview-motion-style")){
        option.setAttribute("data-preview-motion-style",option.getAttribute("style")||"");
      }
    }

    function restoreMotionStyle(option){
      if(!option.hasAttribute("data-preview-motion-style"))return;
      const style=option.getAttribute("data-preview-motion-style");
      if(style)option.setAttribute("style",style);
      else option.removeAttribute("style");
      option.removeAttribute("data-preview-motion-style");
    }

    function trackPreviewAnimation(element,keyframes,options){
      const animation=element.animate(keyframes,options);
      previewOptionAnimations.push(animation);
      return animation;
    }

    function stopPreviewOptionMotion(compact){
      previewOptionMotionToken+=1;
      clearTimeout(previewOptionCleanupTimer);
      previewOptionCleanupTimer=null;
      previewOptionAnimations.forEach(animation=>animation.cancel());
      previewOptionAnimations=[];

      previewOptions().forEach(option=>{
        restoreMotionStyle(option);
        option.style.removeProperty("visibility");
        option.classList.toggle("preview-option-hidden",compact&&!option.classList.contains("active"));
      });
    }

    function previewStackInfo(option){
      const group=option.closest(PREVIEW_OPTION_GROUP_SELECTOR);
      if(!group)return null;

      const options=[...group.children].filter(child=>child.matches(PREVIEW_OPTION_SELECTOR));
      const index=options.indexOf(option);
      if(index<0)return null;

      const selected=options
        .map((candidate,targetIndex)=>({
          target:candidate,
          targetIndex,
          distance:Math.abs(targetIndex-index)
        }))
        .filter(({target})=>target.classList.contains("active"));

      if(!selected.length)return null;

      // Nearest selected card wins; an equal-distance tie goes to the left.
      selected.sort((a,b)=>
        a.distance-b.distance ||
        (a.targetIndex<index?-1:1)-(b.targetIndex<index?-1:1)
      );

      const {target,targetIndex,distance}=selected[0];
      const isLeft=index<targetIndex;

      // Farther cards sit lower. At the same distance, the card on the left
      // sits one layer above the card on the right.
      const zIndex=Math.max(
        1,
        (options.length-distance)*2 + (isLeft?1:0)
      );

      return {target,distance,isLeft,zIndex,groupSize:options.length};
    }

    function raiseActiveOptions(options){
      options.forEach(option=>{
        rememberMotionStyle(option);
        const group=option.closest(PREVIEW_OPTION_GROUP_SELECTOR);
        const groupSize=group
          ? [...group.children].filter(child=>child.matches(PREVIEW_OPTION_SELECTOR)).length
          : 1;
        option.style.position="relative";
        option.style.zIndex=String(groupSize*2+2);
      });
    }

    function animateActiveMove(options,before){
      options.forEach(option=>{
        const from=before.get(option);
        if(!from)return;

        const to=option.getBoundingClientRect();
        const dx=from.left-to.left;
        const dy=from.top-to.top;
        if(Math.abs(dx)<.5&&Math.abs(dy)<.5)return;

        trackPreviewAnimation(
          option,
          [
            {transform:`translate(${dx}px, ${dy}px)`},
            {transform:"translate(0, 0)"}
          ],
          {
            duration:MOTION.move,
            easing:MOTION.ease
          }
        );
      });
    }

    function animateOptionLabel(option,show){
      const label=optionLabel(option);
      if(!label)return;

      // Same motion language as the footer:
      // opacity resolves quickly, while the 4px position shift runs for the
      // full capsule-motion duration.
      trackPreviewAnimation(
        label,
        show ? [{opacity:0},{opacity:1}] : [{opacity:1},{opacity:0}],
        {
          duration:MOTION.fade,
          easing:"ease",
          fill:show?"both":"forwards"
        }
      );

      trackPreviewAnimation(
        label,
        show
          ? [{transform:"translateX(-4px)"},{transform:"translateX(0)"}]
          : [{transform:"translateX(0)"},{transform:"translateX(-4px)"}],
        {
          duration:MOTION.move,
          easing:MOTION.ease,
          fill:show?"both":"forwards"
        }
      );
    }

    function floatOption(option,rect,zIndex=1){
      rememberMotionStyle(option);
      Object.assign(option.style,{
        position:"fixed",
        left:px(rect.left),
        top:px(rect.top),
        width:px(rect.width),
        height:px(rect.height),
        margin:"0",
        pointerEvents:"none",
        zIndex:String(zIndex),
        overflow:"hidden"
      });
    }

    function boxFrame(rect){
      return {
        left:px(rect.left),
        top:px(rect.top),
        width:px(rect.width)
      };
    }

    function animateBox(element,from,to){
      trackPreviewAnimation(
        element,
        [boxFrame(from),boxFrame(to)],
        {
          duration:MOTION.move,
          easing:MOTION.ease,
          fill:"forwards"
        }
      );
    }

    function stackedRect(optionRect,targetRect){
      const width=Math.min(optionRect.width,targetRect.width);
      return {
        left:targetRect.left+(targetRect.width-width)/2,
        top:targetRect.top+(targetRect.height-optionRect.height)/2,
        width
      };
    }

    function schedulePreviewCleanup(token,cleanup){
      previewOptionCleanupTimer=setTimeout(()=>{
        if(token!==previewOptionMotionToken)return;
        cleanup();
        previewOptionCleanupTimer=null;
      },MOTION.move+20);
    }

    function collapsePreviewOptions(){
      const inactive=inactivePreviewOptions();
      const active=activePreviewOptions();

      if(prefersReducedMotion()){
        inactive.forEach(option=>option.classList.add("preview-option-hidden"));
        return;
      }

      const token=++previewOptionMotionToken;
      const activeBefore=captureRects(active);
      const inactiveBefore=captureRects(inactive);
      const stackInfo=new Map(inactive.map(option=>[option,previewStackInfo(option)]));

      raiseActiveOptions(active);

      inactive.forEach(option=>{
        const info=stackInfo.get(option);
        floatOption(option,inactiveBefore.get(option),info?.zIndex||1);
        animateOptionLabel(option,false);
      });

      const activeAfter=captureRects(active);
      animateActiveMove(active,activeBefore);

      inactive.forEach(option=>{
        const from=inactiveBefore.get(option);
        const info=stackInfo.get(option);
        const targetRect=info?.target?activeAfter.get(info.target):null;

        if(!from||!targetRect){
          trackPreviewAnimation(
            option,
            [{opacity:1},{opacity:0}],
            {
              duration:MOTION.fade,
              easing:"ease",
              fill:"forwards"
            }
          );
          return;
        }

        animateBox(option,from,stackedRect(from,targetRect));
      });

      schedulePreviewCleanup(token,()=>{
        inactive.forEach(option=>{
          option.classList.add("preview-option-hidden");
          restoreMotionStyle(option);
        });
        active.forEach(restoreMotionStyle);
        document.querySelectorAll("[data-choice-scroll]").forEach(group=>{
          group.scrollLeft=0;
          updateChoiceScrollAffordance(group);
        });
      });
    }

    function expandPreviewOptions(){
      const inactive=inactivePreviewOptions();
      const active=activePreviewOptions();
      const scrollGroups=[...document.querySelectorAll("[data-choice-scroll]")];

      scrollGroups.forEach(group=>{group.scrollLeft=0});

      if(prefersReducedMotion()){
        inactive.forEach(option=>option.classList.remove("preview-option-hidden"));
        return;
      }

      const token=++previewOptionMotionToken;
      const activeBefore=captureRects(active);
      const stackInfo=new Map(inactive.map(option=>[option,previewStackInfo(option)]));
      const uniqueTargets=[
        ...new Set(
          [...stackInfo.values()]
            .map(info=>info?.target)
            .filter(Boolean)
        )
      ];
      const targetBefore=captureRects(uniqueTargets);

      // Put the real controls back into layout invisibly first. This establishes
      // their true final positions without showing a temporary clone or causing
      // a clone→real-element handoff at the end.
      inactive.forEach(option=>{
        option.classList.remove("preview-option-hidden");
        rememberMotionStyle(option);
        option.style.visibility="hidden";
      });

      const inactiveAfter=captureRects(inactive);

      // The selected controls now sit at their edit-mode positions. FLIP them
      // smoothly from the compact preview positions to those final positions.
      raiseActiveOptions(active);
      animateActiveMove(active,activeBefore);

      inactive.forEach(option=>{
        const to=inactiveAfter.get(option);
        const info=stackInfo.get(option);
        const targetRect=info?.target?targetBefore.get(info.target):null;
        if(!to)return;

        const label=optionLabel(option);
        if(label){
          label.style.opacity="0";
          label.style.transform="translateX(-4px)";
        }

        option.style.visibility="visible";
        option.style.position="relative";
        option.style.zIndex=String(info?.zIndex||1);
        option.style.transformOrigin="50% 50%";
        option.style.overflow="hidden";

        if(!targetRect){
          animateOptionLabel(option,true);
          return;
        }

        const startWidth=Math.min(to.width,targetRect.width);
        const startScaleX=startWidth/to.width;
        const startCenterX=targetRect.left+targetRect.width/2;
        const startCenterY=targetRect.top+targetRect.height/2;
        const endCenterX=to.left+to.width/2;
        const endCenterY=to.top+to.height/2;
        const dx=startCenterX-endCenterX;
        const dy=startCenterY-endCenterY;

        // The real card begins visually underneath its selected target, then
        // slides out while returning from the stacked width to its natural width.
        // Because the actual DOM element is used throughout, there is no visible
        // swap at the end of the animation.
        trackPreviewAnimation(
          option,
          [
            {transform:`translate(${dx}px, ${dy}px) scaleX(${startScaleX})`},
            {transform:"translate(0, 0) scaleX(1)"}
          ],
          {
            duration:MOTION.move,
            easing:MOTION.ease
          }
        );

        animateOptionLabel(option,true);
      });

      schedulePreviewCleanup(token,()=>{
        inactive.forEach(option=>{
          const label=optionLabel(option);
          if(label){
            label.style.removeProperty("opacity");
            label.style.removeProperty("transform");
          }
          restoreMotionStyle(option);
        });
        active.forEach(restoreMotionStyle);
        scrollGroups.forEach(updateChoiceScrollAffordance);
      });
    }

    if(previewBtn&&recordFooter&&recordApp)previewBtn.onclick=()=>{
      autoSaveNow(v);

      const on=!recordFooter.classList.contains("preview-mode");
      clearTimeout(previewUnlockTimer);

      if(on){
        // Close the keyboard before locking the form.
        if(document.activeElement instanceof HTMLElement){
          document.activeElement.blur();
        }

        stopPreviewOptionMotion(false);
        recordApp.classList.add("preview-mode");
        setPreviewInteractionLocked(true);
        recordFooter.classList.add("preview-mode");
        collapsePreviewOptions();

        previewBtn.setAttribute("aria-pressed","true");
        previewBtn.setAttribute("aria-label","プレビューを閉じる");
        return;
      }

      stopPreviewOptionMotion(true);
      recordFooter.classList.remove("preview-mode");
      recordApp.classList.remove("preview-mode");
      expandPreviewOptions();
      previewBtn.setAttribute("aria-pressed","false");
      previewBtn.setAttribute("aria-label","プレビュー");

      previewUnlockTimer=setTimeout(()=>{
        // Unlock exactly when the shared preview morph finishes.
        // If preview was reopened during the morph, keep editing controls locked.
        if(recordFooter.classList.contains("preview-mode"))return;
        setPreviewInteractionLocked(false);
      },MOTION.move);
    };

    document.querySelectorAll("[data-dt-part]").forEach(select=>{
      select.onchange=()=>{
        const part=select.dataset.dtPart;
        const raw=select.value;
        if(part==="time"){
          const [hour,minute]=raw.split(":").map(Number);
          v.dt.hour=hour;
          v.dt.minute=minute;
        }else if(part==="duration"){
          v.duration=Number(raw);
        }else{
          v.dt[part]=Number(raw);
        }
        refreshDateTimeBlocks(v);
        autoSaveNow(v);
      };
    });

    document.querySelectorAll("[data-type]").forEach(b=>b.onclick=()=>{
      document.querySelectorAll("[data-type]").forEach(x=>{
        const selected=x===b;
        x.classList.toggle("active",selected);
        x.setAttribute("aria-pressed",String(selected));
      });
      v.type=b.dataset.type;
      autoSaveNow(v);
    });

    document.querySelectorAll("[data-instructor]").forEach(b=>b.onclick=()=>{
      document.querySelectorAll("[data-instructor]").forEach(x=>{
        const selected=x===b;
        x.classList.toggle("active",selected);
        x.setAttribute("aria-pressed",String(selected));
      });
      v.instructor=b.dataset.instructor;
      autoSaveNow(v);
    });

    const subjectButtons=[...document.querySelectorAll("#subjectChoices [data-subject]")];
    subjectButtons.forEach(b=>b.onclick=()=>{
      const selected=subjectButtons.filter(x=>x.classList.contains("active"));
      if(b.classList.contains("active")&&selected.length===1)return;
      b.classList.toggle("active");
      b.setAttribute("aria-pressed",String(b.classList.contains("active")));
      v.subjects=subjectButtons.filter(x=>x.classList.contains("active")).map(x=>x.dataset.subject);
      autoSaveNow(v);
    });

    const materialEntries=document.getElementById("materialEntries");
    const materialCardNumber=document.getElementById("materialCardNumber");
    const deleteFirstMaterialBtn=document.getElementById("deleteFirstMaterialBtn");
    const addMaterialBtn=document.getElementById("addMaterialBtn");

    const materialEntryList=()=>[
      ...materialEntries.querySelectorAll("[data-material-entry]")
    ];

    const refreshMaterialEntryLabels=()=>{
      const entries=materialEntryList();
      const multiple=entries.length>1;
      const atLimit=entries.length>=MATERIAL_MAX;

      addMaterialBtn.classList.toggle("hidden",atLimit);
      addMaterialBtn.setAttribute("aria-hidden",String(atLimit));

      materialCardNumber.textContent="①";
      materialCardNumber.classList.toggle("is-visible",multiple);
      deleteFirstMaterialBtn.classList.toggle("is-visible",multiple);
      deleteFirstMaterialBtn.setAttribute("aria-hidden",String(!multiple));

      entries.forEach((entry,index)=>{
        const number=materialNumberLabel(index+1);
        const title=entry.querySelector("[data-material-entry-title]");
        const deleteBtn=entry.querySelector("[data-delete-material]");

        entry.classList.toggle("is-primary",index===0);
        if(title)title.textContent="使用教材"+number;
        if(deleteBtn){
          deleteBtn.classList.add("is-visible");
          deleteBtn.setAttribute("aria-label","教材"+number+"を削除");
        }

        const ranges=[...entry.querySelectorAll("[data-material-range]")];
        const showRangeNumbers=ranges.length>1;

        ranges.forEach((range,rangeIndex)=>{
          const rangeNumber=range.querySelector("[data-range-number]");
          const rangeNumberSymbol=range.querySelector("[data-range-number-symbol]");
          const rangeNumberIndex=range.querySelector("[data-range-number-index]");

          rangeNumber?.classList.toggle("hidden",!showRangeNumbers);
          if(rangeNumberSymbol)rangeNumberSymbol.textContent=showRangeNumbers?number:"";
          if(rangeNumberIndex)rangeNumberIndex.textContent=showRangeNumbers?"-"+(rangeIndex+1):"";
        });
      });

      if(multiple){
        deleteFirstMaterialBtn.setAttribute("aria-label","教材①を削除");
      }
    };

    const NATIVE_CONFIRM_DISMISS_MS=180;

    const runAfterNativeConfirmDismiss=callback=>{
      setTimeout(()=>{
        requestAnimationFrame(()=>{
          requestAnimationFrame(callback);
        });
      },NATIVE_CONFIRM_DISMISS_MS);
    };

    const requestMaterialDelete=entry=>{
      const entries=materialEntryList();
      if(entries.length<=1)return;

      const index=entries.indexOf(entry);
      if(index<0)return;

      const number=materialNumberLabel(index+1);
      if(window.confirm("教材"+number+"を削除しますか？")){
        runAfterNativeConfirmDismiss(()=>removeMaterialEntry(entry));
      }
    };

    const readMaterialEntry=entry=>{
      const material=entry.querySelector("[data-material-select]")?.value||"";
      const customMaterial=entry.querySelector("[data-custom-material]")?.value||"";
      const ranges=[...entry.querySelectorAll("[data-material-range]")]
        .map(range=>{
          const from=range.querySelector("[data-material-page-from]")?.value||"";
          const to=range.querySelector("[data-material-page-to]")?.value||"";
          return {from,to};
        })
        .filter(range=>range.from||range.to);
      return {
        material,
        customMaterial,
        ranges
      };
    };

    const animateMaterialTitleSwap=(title,nextText)=>{
      if(!title||title.textContent===nextText){
        if(title)title.textContent=nextText;
        return;
      }

      if(prefersReducedMotion()){
        title.textContent=nextText;
        return;
      }

      const out=title.animate(
        [
          {opacity:1,transform:"translateX(0)"},
          {opacity:0,transform:"translateX(-4px)"}
        ],
        {
          duration:MOTION.fade,
          easing:"ease",
          fill:"forwards"
        }
      );

      out.onfinish=()=>{
        title.textContent=nextText;
        out.cancel();

        title.animate(
          [
            {opacity:0,transform:"translateX(-4px)"},
            {opacity:1,transform:"translateX(0)"}
          ],
          {
            duration:MOTION.move-MOTION.fade,
            easing:MOTION.ease
          }
        );
      };
    };

    const removeMaterialEntry=entry=>{
      const entriesBefore=materialEntryList();
      const removedIndex=entriesBefore.indexOf(entry);

      if(entriesBefore.length===2){
        materialCardNumber.classList.remove("is-visible");
        deleteFirstMaterialBtn.classList.remove("is-visible");
        deleteFirstMaterialBtn.setAttribute("aria-hidden","true");
      }

      if(removedIndex===0 && entriesBefore[1]){
        entriesBefore[1].classList.add("is-primary");
      }

      entriesBefore.slice(removedIndex+1).forEach((remaining,offset)=>{
        const nextIndex=removedIndex+offset;
        const title=remaining.querySelector("[data-material-entry-title]");
        const nextText="使用教材"+materialNumberLabel(nextIndex+1);

        if(nextIndex===0){
          if(title)title.textContent=nextText;
        }else{
          animateMaterialTitleSwap(title,nextText);
        }

        const deleteBtn=remaining.querySelector("[data-delete-material]");
        if(deleteBtn){
          deleteBtn.setAttribute(
            "aria-label",
            "教材"+materialNumberLabel(nextIndex+1)+"を削除"
          );
        }
      });

      const finish=()=>{
        entry.remove();
        refreshMaterialEntryLabels();
        v.materials=capture(v).materials;
        autoSaveNow(v);
      };

      if(prefersReducedMotion()){
        finish();
        return;
      }

      let finished=false;
      const finishOnce=()=>{
        if(finished)return;
        finished=true;
        finish();
      };

      entry.addEventListener("transitionend",e=>{
        if(e.target===entry && e.propertyName==="grid-template-rows"){
          finishOnce();
        }
      },{once:true});

      entry.classList.add("is-collapsed");
      setTimeout(finishOnce,MOTION.move+80);
    };

    const bindMaterialEntry=entry=>{
      const mat=entry.querySelector("[data-material-select]");
      const customWrap=entry.querySelector("[data-custom-material-wrap]");
      const customInput=entry.querySelector("[data-custom-material]");
      const rangeList=entry.querySelector("[data-material-range-list]");
      const addRangeBtn=entry.querySelector("[data-add-range]");
      const deleteBtn=entry.querySelector("[data-delete-material]");

      const rangeItems=()=>[...entry.querySelectorAll("[data-material-range]")];

      const updateRangeDeleteVisibility=()=>{
        const multiple=rangeItems().length>1;
        rangeItems().forEach(range=>{
          range.querySelector("[data-delete-range]")?.classList.toggle("hidden",!multiple);
        });
      };

      const updateRangeUnit=range=>{
        const from=range.querySelector("[data-material-page-from]")?.value||"";
        const to=range.querySelector("[data-material-page-to]")?.value||"";
        const unitDisplay=range.querySelector("[data-material-unit]");
        const units=unitListForRanges(mat?.value,(from||to)?[{from,to}]:[]);

        if(unitDisplay){
          unitDisplay.innerHTML=units.length
            ? '<span class="material-unit-track">'+units.map(esc).join(" ／ ")+'</span>'
            : "";
          unitDisplay.scrollLeft=0;
        }
      };

      const bindRange=range=>{
        range.querySelectorAll("[data-material-page-from],[data-material-page-to]").forEach(input=>{
          input.oninput=()=>{
            updateRangeUnit(range);
            scheduleAutoSave(v);
          };
        });

        const deleteRangeBtn=range.querySelector("[data-delete-range]");
        if(deleteRangeBtn){
          deleteRangeBtn.onclick=()=>{
            if(rangeItems().length<=1)return;

            const finish=()=>{
              range.remove();
              updateRangeDeleteVisibility();
              refreshMaterialEntryLabels();
              v.materials=capture(v).materials;
              autoSaveNow(v);
            };

            if(prefersReducedMotion()){
              finish();
              return;
            }

            let finished=false;
            const finishOnce=()=>{
              if(finished)return;
              finished=true;
              finish();
            };

            range.addEventListener("transitionend",e=>{
              if(e.target===range && e.propertyName==="grid-template-rows"){
                finishOnce();
              }
            },{once:true});

            range.classList.add("is-collapsed");
            setTimeout(finishOnce,MOTION.move+80);
          };
        }
      };

      rangeItems().forEach(bindRange);
      updateRangeDeleteVisibility();

      addRangeBtn.onclick=()=>{
        const holder=document.createElement("div");
        holder.innerHTML=materialRangeMarkup({from:"",to:""},mat?.value||"",true);
        const range=holder.firstElementChild;
        range.classList.add("is-collapsed");
        rangeList.append(range);
        bindRange(range);
        updateRangeDeleteVisibility();
        refreshMaterialEntryLabels();

        if(prefersReducedMotion()){
          range.classList.remove("is-collapsed");
        }else{
          requestAnimationFrame(()=>{
            requestAnimationFrame(()=>range.classList.remove("is-collapsed"));
          });
        }

        v.materials=capture(v).materials;
        autoSaveNow(v);
      };

      const updateCustomMaterialVisibility=()=>{
        const open=mat.value==="__custom__";
        customWrap?.classList.toggle("is-open",open);
        customWrap?.setAttribute("aria-hidden",String(!open));
        if(customInput)customInput.disabled=!open;
      };

      mat.onchange=()=>{
        updateCustomMaterialVisibility();
        rangeItems().forEach(updateRangeUnit);
        autoSaveNow(v);
      };

      customInput?.addEventListener("input",()=>scheduleAutoSave(v));

      if(deleteBtn){
        deleteBtn.onclick=()=>requestMaterialDelete(entry);
      }
    };
    materialEntries.querySelectorAll("[data-material-entry]").forEach(bindMaterialEntry);

    deleteFirstMaterialBtn.onclick=()=>{
      const first=materialEntryList()[0];
      if(first)requestMaterialDelete(first);
    };

    refreshMaterialEntryLabels();

    const revealMaterialEntry=entry=>{
      if(prefersReducedMotion()){
        entry.classList.remove("is-collapsed");
        return;
      }

      // Footer grammar: append in the closed state, then let the same DOM
      // transition to its open state on the next frame.
      requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{
          entry.classList.remove("is-collapsed");
        });
      });
    };

    addMaterialBtn.onclick=()=>{
      if(materialEntryList().length>=MATERIAL_MAX)return;

      const current=capture(v);
      v.materials=current.materials;

      const newEntry=normalizeMaterialEntry(
        null,
        l.materials[0]||allMaterials[0]||""
      );
      v.materials.push(newEntry);

      const holder=document.createElement("div");
      holder.innerHTML=materialEntryMarkup(newEntry,allMaterials,false);
      const entry=holder.firstElementChild;
      entry.classList.add("is-collapsed");
      materialEntries.append(entry);
      bindMaterialEntry(entry);
      refreshMaterialEntryLabels();
      revealMaterialEntry(entry);
      autoSaveNow(v);
    };

    document.getElementById("review").oninput=e=>{
      document.getElementById("reviewCount").textContent=e.target.value.length+"文字";
      scheduleAutoSave(v);
    };

    const prevRow=document.getElementById("prevRow");
    const prevBtn=document.getElementById("prevBtn");
    const prevBtnLabel=document.getElementById("prevBtnLabel");
    const previousReview=document.getElementById("previousReview");

    if(!l.history[0]){
      prevRow.hidden=true;
    }

    prevBtn.onclick=()=>{
      state.showPrev=!state.showPrev;
      previousReview.classList.toggle("open",state.showPrev);
      previousReview.setAttribute("aria-hidden",String(!state.showPrev));
      prevBtn.setAttribute("aria-expanded",String(state.showPrev));
      prevBtnLabel.textContent=state.showPrev?"前回の講評を閉じる":"前回の講評を見る";
    };

    document.querySelectorAll("[data-rating]").forEach(b=>b.onclick=()=>{
      state.rating=b.dataset.rating;
      document.querySelectorAll("[data-rating]").forEach(x=>x.classList.toggle("active",x.dataset.rating===state.rating));
      autoSaveNow(v);
    });

    document.querySelectorAll("[data-forgot]").forEach(b=>b.onclick=()=>{
      const x=b.dataset.forgot;
      if(x==="なし")state.forgot=new Set(["なし"]);
      else{
        state.forgot.delete("なし");
        state.forgot.has(x)?state.forgot.delete(x):state.forgot.add(x);
        if(!state.forgot.size)state.forgot.add("なし");
      }
      document.querySelectorAll("[data-forgot]").forEach(z=>z.classList.toggle("active",state.forgot.has(z.dataset.forgot)));
      document.getElementById("forgotOtherWrap").classList.toggle("open",state.forgot.has("その他"));
      autoSaveNow(v);
    });

    ["homeworkComment","nextHomework","forgotOther","note"].forEach(id=>{
      const el=document.getElementById(id);
      if(el)el.addEventListener("input",()=>scheduleAutoSave(v));
    });
  }

  window.addEventListener("resize",()=>{
    requestAnimationFrame(fitRecordHorizontalControls);
    scheduleLineHeaderLayout();
  },{passive:true});
  if(IS_LINE_INAPP&&window.visualViewport){
    window.visualViewport.addEventListener("resize",scheduleLineHeaderLayout,{passive:true});
  }
  renderList();
})();
</script>
</body>
</html>
