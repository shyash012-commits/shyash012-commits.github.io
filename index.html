    const previewBtn=document.getElementById("previewBtn");
    const recordFooter=document.querySelector(".record-footer");
    const recordApp=document.querySelector("#app > .app");
    let previewUnlockTimer=null;

    const PREVIEW_OPTION_SELECTOR=".choice-button, .rating button, .chip";
    const PREVIEW_OPTION_GROUP_SELECTOR=".choice-grid, .rating, .chips";
    const PREVIEW_EDITABLE_SELECTOR=".card input, .card textarea:not(#review), .card select, .card button";

    function setPreviewInteractionLocked(locked){
      document.querySelectorAll(PREVIEW_EDITABLE_SELECTOR).forEach(control=>{
        if(locked)control.setAttribute("inert","");
        else control.removeAttribute("inert");
      });

      const review=document.getElementById("review");
      if(review){
        review.readOnly=locked;
        review.setAttribute("aria-readonly",String(locked));
      }
    }


    function cssTimeToMs(value,fallback){
      const raw=String(value||"").trim();
      if(!raw)return fallback;
      const n=parseFloat(raw);
      if(!Number.isFinite(n))return fallback;
      return raw.endsWith("ms")?n:n*1000;
    }

    const motionStyle=getComputedStyle(recordFooter);
    const MOTION={
      move:cssTimeToMs(motionStyle.getPropertyValue("--motion-dur"),210),
      fade:cssTimeToMs(motionStyle.getPropertyValue("--fade-dur"),100),
      ease:motionStyle.getPropertyValue("--motion-ease").trim()||"cubic-bezier(.22,.72,.26,1)"
    };
    // Shared motion grammar:
    // layout 210ms, X -4px <-> 0 over 210ms, opacity over 100ms.
    // Preview and material interactions use the same timing.

    let previewOptionMotionToken=0;
    let previewOptionCleanupTimer=null;
    let previewOptionAnimations=[];

    const px=value=>value+"px";
    const previewOptions=()=>[...document.querySelectorAll(PREVIEW_OPTION_SELECTOR)];
    const activePreviewOptions=()=>previewOptions().filter(option=>option.classList.contains("active"));
    const inactivePreviewOptions=()=>previewOptions().filter(option=>!option.classList.contains("active"));
    const optionLabel=option=>option.querySelector(".record-option-label");
    const captureRects=elements=>new Map(elements.map(element=>[element,element.getBoundingClientRect()]));

    function rememberMotionStyle(option){
      if(!option.hasAttribute("data-preview-motion-style")){
        option.setAttribute("data-preview-motion-style",option.getAttribute("style")||"");
      }
    }

    function restoreMotionStyle(option){
      if(!option.hasAttribute("data-preview-motion-style"))return;
      const style=option.getAttribute("data-preview-motion-style");
      if(style)option.setAttribute("style",style);
      else option.removeAttribute("style");
      option.removeAttribute("data-preview-motion-style");
    }

    function trackPreviewAnimation(element,keyframes,options){
      const animation=element.animate(keyframes,options);
      previewOptionAnimations.push(animation);
      return animation;
    }

    function stopPreviewOptionMotion(compact){
      previewOptionMotionToken+=1;
      clearTimeout(previewOptionCleanupTimer);
      previewOptionCleanupTimer=null;
      previewOptionAnimations.forEach(animation=>animation.cancel());
      previewOptionAnimations=[];

      previewOptions().forEach(option=>{
        restoreMotionStyle(option);
        option.style.removeProperty("visibility");
        option.classList.toggle("preview-option-hidden",compact&&!option.classList.contains("active"));
      });
    }

    function previewStackInfo(option){
      const group=option.closest(PREVIEW_OPTION_GROUP_SELECTOR);
      if(!group)return null;

      const options=[...group.children].filter(child=>child.matches(PREVIEW_OPTION_SELECTOR));
      const index=options.indexOf(option);
      if(index<0)return null;

      const selected=options
        .map((candidate,targetIndex)=>({
          target:candidate,
          targetIndex,
          distance:Math.abs(targetIndex-index)
        }))
        .filter(({target})=>target.classList.contains("active"));

      if(!selected.length)return null;

      // Nearest selected card wins; an equal-distance tie goes to the left.
      selected.sort((a,b)=>
        a.distance-b.distance ||
        (a.targetIndex<index?-1:1)-(b.targetIndex<index?-1:1)
      );

      const {target,targetIndex,distance}=selected[0];
      const isLeft=index<targetIndex;

      // Farther cards sit lower. At the same distance, the card on the left
      // sits one layer above the card on the right.
      const zIndex=Math.max(
        1,
        (options.length-distance)*2 + (isLeft?1:0)
      );

      return {target,distance,isLeft,zIndex,groupSize:options.length};
    }

    function raiseActiveOptions(options){
      options.forEach(option=>{
        rememberMotionStyle(option);
        const group=option.closest(PREVIEW_OPTION_GROUP_SELECTOR);
        const groupSize=group
          ? [...group.children].filter(child=>child.matches(PREVIEW_OPTION_SELECTOR)).length
          : 1;
        option.style.position="relative";
        option.style.zIndex=String(groupSize*2+2);
      });
    }

    function animateActiveMove(options,before){
      options.forEach(option=>{
        const from=before.get(option);
        if(!from)return;

        const to=option.getBoundingClientRect();
        const dx=from.left-to.left;
        const dy=from.top-to.top;
        if(Math.abs(dx)<.5&&Math.abs(dy)<.5)return;

        trackPreviewAnimation(
          option,
          [
            {transform:`translate(${dx}px, ${dy}px)`},
            {transform:"translate(0, 0)"}
          ],
          {
            duration:MOTION.move,
            easing:MOTION.ease
          }
        );
      });
    }

    function animateOptionLabel(option,show){
      const label=optionLabel(option);
      if(!label)return;

      // Same motion language as the footer:
      // opacity resolves quickly, while the 4px position shift runs for the
      // full capsule-motion duration.
      trackPreviewAnimation(
        label,
        show ? [{opacity:0},{opacity:1}] : [{opacity:1},{opacity:0}],
        {
          duration:MOTION.fade,
          easing:"ease",
          fill:show?"both":"forwards"
        }
      );

      trackPreviewAnimation(
        label,
        show
          ? [{transform:"translateX(-4px)"},{transform:"translateX(0)"}]
          : [{transform:"translateX(0)"},{transform:"translateX(-4px)"}],
        {
          duration:MOTION.move,
          easing:MOTION.ease,
          fill:show?"both":"forwards"
        }
      );
    }

    function floatOption(option,rect,zIndex=1){
      rememberMotionStyle(option);
      Object.assign(option.style,{
        position:"fixed",
        left:px(rect.left),
        top:px(rect.top),
        width:px(rect.width),
        height:px(rect.height),
        margin:"0",
        pointerEvents:"none",
        zIndex:String(zIndex),
        overflow:"hidden"
      });
    }

    function boxFrame(rect){
      return {
        left:px(rect.left),
        top:px(rect.top),
        width:px(rect.width)
      };
    }

    function animateBox(element,from,to){
      trackPreviewAnimation(
        element,
        [boxFrame(from),boxFrame(to)],
        {
          duration:MOTION.move,
          easing:MOTION.ease,
          fill:"forwards"
        }
      );
    }

    function stackedRect(optionRect,targetRect){
      const width=Math.min(optionRect.width,targetRect.width);
      return {
        left:targetRect.left+(targetRect.width-width)/2,
        top:targetRect.top+(targetRect.height-optionRect.height)/2,
        width
      };
    }

    function schedulePreviewCleanup(token,cleanup){
      previewOptionCleanupTimer=setTimeout(()=>{
        if(token!==previewOptionMotionToken)return;
        cleanup();
        previewOptionCleanupTimer=null;
      },MOTION.move+20);
    }

    function collapsePreviewOptions(){
      const inactive=inactivePreviewOptions();
      const active=activePreviewOptions();

      if(prefersReducedMotion()){
        inactive.forEach(option=>option.classList.add("preview-option-hidden"));
        return;
      }

      const token=++previewOptionMotionToken;
      const activeBefore=captureRects(active);
      const inactiveBefore=captureRects(inactive);
      const stackInfo=new Map(inactive.map(option=>[option,previewStackInfo(option)]));

      raiseActiveOptions(active);

      inactive.forEach(option=>{
        const info=stackInfo.get(option);
        floatOption(option,inactiveBefore.get(option),info?.zIndex||1);
        animateOptionLabel(option,false);
      });

      const activeAfter=captureRects(active);
      animateActiveMove(active,activeBefore);

      inactive.forEach(option=>{
        const from=inactiveBefore.get(option);
        const info=stackInfo.get(option);
        const targetRect=info?.target?activeAfter.get(info.target):null;

        if(!from||!targetRect){
          trackPreviewAnimation(
            option,
            [{opacity:1},{opacity:0}],
            {
              duration:MOTION.fade,
              easing:"ease",
              fill:"forwards"
            }
          );
          return;
        }

        animateBox(option,from,stackedRect(from,targetRect));
      });

      schedulePreviewCleanup(token,()=>{
        inactive.forEach(option=>{
          option.classList.add("preview-option-hidden");
          restoreMotionStyle(option);
        });
        active.forEach(restoreMotionStyle);
        document.querySelectorAll("[data-choice-scroll]").forEach(group=>{
          group.scrollLeft=0;
          updateChoiceScrollAffordance(group);
        });
      });
    }

    function expandPreviewOptions(){
      const inactive=inactivePreviewOptions();
      const active=activePreviewOptions();
      const scrollGroups=[...document.querySelectorAll("[data-choice-scroll]")];

      scrollGroups.forEach(group=>{group.scrollLeft=0});

      if(prefersReducedMotion()){
        inactive.forEach(option=>option.classList.remove("preview-option-hidden"));
        return;
      }

      const token=++previewOptionMotionToken;
      const activeBefore=captureRects(active);
      const stackInfo=new Map(inactive.map(option=>[option,previewStackInfo(option)]));
      const uniqueTargets=[
        ...new Set(
          [...stackInfo.values()]
            .map(info=>info?.target)
            .filter(Boolean)
        )
      ];
      const targetBefore=captureRects(uniqueTargets);

      // Put the real controls back into layout invisibly first. This establishes
      // their true final positions without showing a temporary clone or causing
      // a clone→real-element handoff at the end.
      inactive.forEach(option=>{
        option.classList.remove("preview-option-hidden");
        rememberMotionStyle(option);
        option.style.visibility="hidden";
      });

      const inactiveAfter=captureRects(inactive);

      // The selected controls now sit at their edit-mode positions. FLIP them
      // smoothly from the compact preview positions to those final positions.
      raiseActiveOptions(active);
      animateActiveMove(active,activeBefore);

      inactive.forEach(option=>{
        const to=inactiveAfter.get(option);
        const info=stackInfo.get(option);
        const targetRect=info?.target?targetBefore.get(info.target):null;
        if(!to)return;

        const label=optionLabel(option);
        if(label){
          label.style.opacity="0";
          label.style.transform="translateX(-4px)";
        }

        option.style.visibility="visible";
        option.style.position="relative";
        option.style.zIndex=String(info?.zIndex||1);
        option.style.transformOrigin="50% 50%";
        option.style.overflow="hidden";

        if(!targetRect){
          animateOptionLabel(option,true);
          return;
        }

        const startWidth=Math.min(to.width,targetRect.width);
        const startScaleX=startWidth/to.width;
        const startCenterX=targetRect.left+targetRect.width/2;
        const startCenterY=targetRect.top+targetRect.height/2;
        const endCenterX=to.left+to.width/2;
        const endCenterY=to.top+to.height/2;
        const dx=startCenterX-endCenterX;
        const dy=startCenterY-endCenterY;

        // The real card begins visually underneath its selected target, then
        // slides out while returning from the stacked width to its natural width.
        // Because the actual DOM element is used throughout, there is no visible
        // swap at the end of the animation.
        trackPreviewAnimation(
          option,
          [
            {transform:`translate(${dx}px, ${dy}px) scaleX(${startScaleX})`},
            {transform:"translate(0, 0) scaleX(1)"}
          ],
          {
            duration:MOTION.move,
            easing:MOTION.ease
          }
        );

        animateOptionLabel(option,true);
      });

      schedulePreviewCleanup(token,()=>{
        inactive.forEach(option=>{
          const label=optionLabel(option);
          if(label){
            label.style.removeProperty("opacity");
            label.style.removeProperty("transform");
          }
          restoreMotionStyle(option);
        });
        active.forEach(restoreMotionStyle);
        scrollGroups.forEach(updateChoiceScrollAffordance);
      });
    }

    if(previewBtn&&recordFooter&&recordApp)previewBtn.onclick=()=>{
      autoSaveNow(v);

      const on=!recordFooter.classList.contains("preview-mode");
      clearTimeout(previewUnlockTimer);

      if(on){
        // Close the keyboard before locking the form.
        if(document.activeElement instanceof HTMLElement){
          document.activeElement.blur();
        }

        stopPreviewOptionMotion(false);
        setMaterialPreviewCompaction(true);
        recordApp.classList.add("preview-mode");
        setPreviewInteractionLocked(true);
        recordFooter.classList.add("preview-mode");
        collapsePreviewOptions();

        previewBtn.setAttribute("aria-pressed","true");
        previewBtn.setAttribute("aria-label","プレビューを閉じる");
        return;
      }

      stopPreviewOptionMotion(true);
      recordFooter.classList.remove("preview-mode");
      recordApp.classList.remove("preview-mode");
      setMaterialPreviewCompaction(false);
      expandPreviewOptions();
      previewBtn.setAttribute("aria-pressed","false");
      previewBtn.setAttribute("aria-label","プレビュー");

      previewUnlockTimer=setTimeout(()=>{
        // Unlock exactly when the shared preview morph finishes.
        // If preview was reopened during the morph, keep editing controls locked.
        if(recordFooter.classList.contains("preview-mode"))return;
        setPreviewInteractionLocked(false);
      },MOTION.move);
    };

    document.querySelectorAll("[data-dt-part]").forEach(select=>{
      select.onchange=()=>{
        const part=select.dataset.dtPart;
        const raw=select.value;
        if(part==="time"){
          const [hour,minute]=raw.split(":").map(Number);
          v.dt.hour=hour;
          v.dt.minute=minute;
        }else if(part==="duration"){
          v.duration=Number(raw);
        }else{
          v.dt[part]=Number(raw);
        }
        refreshDateTimeBlocks(v);
        autoSaveNow(v);
      };
    });

    document.querySelectorAll("[data-type]").forEach(b=>b.onclick=()=>{
      document.querySelectorAll("[data-type]").forEach(x=>{
        const selected=x===b;
        x.classList.toggle("active",selected);
        x.setAttribute("aria-pressed",String(selected));
      });
      v.type=b.dataset.type;
      autoSaveNow(v);
    });

    document.querySelectorAll("[data-instructor]").forEach(b=>b.onclick=()=>{
      document.querySelectorAll("[data-instructor]").forEach(x=>{
        const selected=x===b;
        x.classList.toggle("active",selected);
        x.setAttribute("aria-pressed",String(selected));
      });
      v.instructor=b.dataset.instructor;
      autoSaveNow(v);
    });

    const subjectButtons=[...document.querySelectorAll("#subjectChoices [data-subject]")];
    subjectButtons.forEach(b=>b.onclick=()=>{
      const selected=subjectButtons.filter(x=>x.classList.contains("active"));
      if(b.classList.contains("active")&&selected.length===1)return;
      b.classList.toggle("active");
      b.setAttribute("aria-pressed",String(b.classList.contains("active")));
      v.subjects=subjectButtons.filter(x=>x.classList.contains("active")).map(x=>x.dataset.subject);
      autoSaveNow(v);
    });

    const materialEntries=document.getElementById("materialEntries");
    const materialCardNumber=document.getElementById("materialCardNumber");
    const deleteFirstMaterialBtn=document.getElementById("deleteFirstMaterialBtn");
    const addMaterialBtn=document.getElementById("addMaterialBtn");

    const materialEntryList=()=>[
      ...materialEntries.querySelectorAll("[data-material-entry]")
    ];

    const setRangeNumberText=(rangeNumber,symbol,indexText)=>{
      const symbolEl=rangeNumber?.querySelector("[data-range-number-symbol]");
      const indexEl=rangeNumber?.querySelector("[data-range-number-index]");
      if(symbolEl)symbolEl.textContent=symbol;
      if(indexEl)indexEl.textContent=indexText;
    };

    const refreshRangeNumber=(rangeNumber,symbol,indexText,visible,animate=true)=>{
      if(!rangeNumber)return;

      const currentSymbol=rangeNumber.querySelector("[data-range-number-symbol]")?.textContent||"";
      const currentIndex=rangeNumber.querySelector("[data-range-number-index]")?.textContent||"";
      const nextText=symbol+indexText;
      const currentText=currentSymbol+currentIndex;
      const wasVisible=rangeNumber.classList.contains("is-visible");

      rangeNumber.getAnimations().forEach(animation=>animation.cancel());

      if(!visible){
        rangeNumber.classList.remove("is-visible");
        rangeNumber.setAttribute("aria-hidden","true");
        return;
      }

      rangeNumber.setAttribute("aria-hidden","false");

      if(!wasVisible){
        setRangeNumberText(rangeNumber,symbol,indexText);
        if(!animate||prefersReducedMotion()){
          rangeNumber.classList.add("is-visible");
          return;
        }
        requestAnimationFrame(()=>{
          requestAnimationFrame(()=>rangeNumber.classList.add("is-visible"));
        });
        return;
      }

      if(currentText===nextText)return;

      if(!animate||prefersReducedMotion()){
        setRangeNumberText(rangeNumber,symbol,indexText);
        return;
      }

      /* One 210ms trajectory: old number exits to -4px, content swaps while
         fully transparent, then the new number returns along the same path. */
      const midpoint=MOTION.move/2;
      const swapAnimation=rangeNumber.animate(
        [
          {opacity:1,transform:"translateX(0)",offset:0},
          {opacity:0,transform:"translateX(-4px)",offset:.48},
          {opacity:0,transform:"translateX(-4px)",offset:.52},
          {opacity:1,transform:"translateX(0)",offset:1}
        ],
        {
          duration:MOTION.move,
          easing:MOTION.ease
        }
      );

      const swapTimer=setTimeout(()=>{
        setRangeNumberText(rangeNumber,symbol,indexText);
      },midpoint);

      swapAnimation.onfinish=()=>{
        clearTimeout(swapTimer);
        setRangeNumberText(rangeNumber,symbol,indexText);
      };
      swapAnimation.oncancel=()=>clearTimeout(swapTimer);
    };

    const refreshMaterialEntryLabels=({animateRangeNumbers=true}={})=>{
      const entries=materialEntryList();
      const multiple=entries.length>1;
      const atLimit=entries.length>=MATERIAL_MAX;

      addMaterialBtn.classList.toggle("hidden",atLimit);
      addMaterialBtn.setAttribute("aria-hidden",String(atLimit));

      materialCardNumber.textContent="①";
      materialCardNumber.classList.toggle("is-visible",multiple);
      deleteFirstMaterialBtn.classList.toggle("is-visible",multiple);
      deleteFirstMaterialBtn.setAttribute("aria-hidden",String(!multiple));

      entries.forEach((entry,index)=>{
        const number=materialNumberLabel(index+1);
        const title=entry.querySelector("[data-material-entry-title]");
        const deleteBtn=entry.querySelector("[data-delete-material]");

        entry.classList.toggle("is-primary",index===0);
        if(title)title.textContent="使用教材"+number;
        if(deleteBtn){
          deleteBtn.classList.add("is-visible");
          deleteBtn.setAttribute("aria-label","教材"+number+"を削除");
        }

        const ranges=[...entry.querySelectorAll("[data-material-range]")];
        const showRangeNumbers=ranges.length>1;

        ranges.forEach((range,rangeIndex)=>{
          const rangeNumber=range.querySelector("[data-range-number]");
          refreshRangeNumber(
            rangeNumber,
            showRangeNumbers?number:"",
            showRangeNumbers?"-"+(rangeIndex+1):"",
            showRangeNumbers,
            animateRangeNumbers
          );
        });
      });

      if(multiple){
        deleteFirstMaterialBtn.setAttribute("aria-label","教材①を削除");
      }
    };

    const revealCollapsedShell=(shell,onStart)=>{
      if(prefersReducedMotion()){
        onStart?.(false);
        shell.classList.remove("is-collapsed");
        return;
      }

      /* The shell must first be painted in its closed state so the browser has
         a real transition origin. Related numbering/delete UI is deliberately
         deferred to that same reveal frame, not started earlier. */
      requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{
          onStart?.(true);
          shell.classList.remove("is-collapsed");
        });
      });
    };

    function setMaterialPreviewCompaction(compact){
      const entries=materialEntryList();

      if(!compact){
        entries.forEach(entry=>{
          entry.classList.remove("is-preview-empty");
          entry.removeAttribute("aria-hidden");

          entry.querySelectorAll("[data-material-range]").forEach(range=>{
            range.classList.remove("is-preview-empty","is-preview-last-visible");
            range.removeAttribute("aria-hidden");
          });
        });

        refreshMaterialEntryLabels({animateRangeNumbers:false});
        return;
      }

      entries.forEach((entry,index)=>{
        const ranges=[...entry.querySelectorAll("[data-material-range]")];
        const hasRangeValue=ranges.some(range=>{
          const from=range.querySelector("[data-material-page-from]")?.value.trim()||"";
          const to=range.querySelector("[data-material-page-to]")?.value.trim()||"";
          return !!(from||to);
        });

        const material=entry.querySelector("[data-material-select]")?.value||"";
        const custom=entry.querySelector("[data-custom-material]")?.value.trim()||"";
        const isDraft=entry.dataset.materialDraft==="true";

        /* The first material is the card's primary value and is never omitted.
           Extra entries disappear only when they are still an untouched draft,
           or when "自由入力" contains no actual material name or range. */
        const hideEntry=index>0 && (
          (isDraft&&!hasRangeValue) ||
          (material==="__custom__"&&!custom&&!hasRangeValue) ||
          (!material&&!hasRangeValue)
        );

        entry.classList.toggle("is-preview-empty",hideEntry);
        if(hideEntry)entry.setAttribute("aria-hidden","true");
        else entry.removeAttribute("aria-hidden");

        ranges.forEach(range=>{
          const from=range.querySelector("[data-material-page-from]")?.value.trim()||"";
          const to=range.querySelector("[data-material-page-to]")?.value.trim()||"";
          const hideRange=!(from||to);

          range.classList.toggle("is-preview-empty",hideRange);
          range.classList.remove("is-preview-last-visible");
          if(hideRange)range.setAttribute("aria-hidden","true");
          else range.removeAttribute("aria-hidden");
        });
      });

      const visibleEntries=entries.filter(entry=>!entry.classList.contains("is-preview-empty"));
      const multipleMaterials=visibleEntries.length>1;

      materialCardNumber.textContent="①";
      materialCardNumber.classList.toggle("is-visible",multipleMaterials);

      visibleEntries.forEach((entry,visibleEntryIndex)=>{
        const number=materialNumberLabel(visibleEntryIndex+1);
        const title=entry.querySelector("[data-material-entry-title]");
        if(title)title.textContent="使用教材"+number;

        const visibleRanges=[...entry.querySelectorAll("[data-material-range]")]
          .filter(range=>!range.classList.contains("is-preview-empty"));

        visibleRanges.at(-1)?.classList.add("is-preview-last-visible");

        const showRangeNumbers=visibleRanges.length>1;
        visibleRanges.forEach((range,visibleRangeIndex)=>{
          refreshRangeNumber(
            range.querySelector("[data-range-number]"),
            showRangeNumbers?number:"",
            showRangeNumbers?"-"+(visibleRangeIndex+1):"",
            showRangeNumbers,
            false
          );
        });
      });
    }

    const NATIVE_CONFIRM_DISMISS_MS=180;

    const runAfterNativeConfirmDismiss=callback=>{
      setTimeout(()=>{
        requestAnimationFrame(()=>{
          requestAnimationFrame(callback);
        });
      },NATIVE_CONFIRM_DISMISS_MS);
    };

    const requestMaterialDelete=entry=>{
      const entries=materialEntryList();
      if(entries.length<=1)return;

      const index=entries.indexOf(entry);
      if(index<0)return;

      const number=materialNumberLabel(index+1);
      if(window.confirm("教材"+number+"を削除しますか？")){
        runAfterNativeConfirmDismiss(()=>removeMaterialEntry(entry));
      }
    };

    const readMaterialEntry=entry=>{
      const material=entry.querySelector("[data-material-select]")?.value||"";
      const customMaterial=entry.querySelector("[data-custom-material]")?.value||"";
      const ranges=[...entry.querySelectorAll("[data-material-range]")]
        .map(range=>{
          const from=range.querySelector("[data-material-page-from]")?.value||"";
          const to=range.querySelector("[data-material-page-to]")?.value||"";
          return {from,to};
        })
        .filter(range=>range.from||range.to);
      return {
        material,
        customMaterial,
        ranges,
        draft:entry.dataset.materialDraft==="true"
      };
    };

    const animateMaterialTitleSwap=(title,nextText)=>{
      if(!title||title.textContent===nextText){
        if(title)title.textContent=nextText;
        return;
      }

      title.getAnimations().forEach(animation=>animation.cancel());

      if(prefersReducedMotion()){
        title.textContent=nextText;
        return;
      }

      /* Renumber on one shared 210ms trajectory.
         The old label exits to -4px, swaps while fully transparent,
         then the new label returns along the same path. */
      const midpoint=MOTION.move/2;
      const animation=title.animate(
        [
          {opacity:1,transform:"translateX(0)",offset:0},
          {opacity:0,transform:"translateX(-4px)",offset:.48},
          {opacity:0,transform:"translateX(-4px)",offset:.52},
          {opacity:1,transform:"translateX(0)",offset:1}
        ],
        {
          duration:MOTION.move,
          easing:MOTION.ease
        }
      );

      const swapTimer=setTimeout(()=>{
        title.textContent=nextText;
      },midpoint);

      animation.onfinish=()=>{
        clearTimeout(swapTimer);
        title.textContent=nextText;
      };
      animation.oncancel=()=>clearTimeout(swapTimer);
    };

    const removeMaterialEntry=entry=>{
      const entriesBefore=materialEntryList();
      const removedIndex=entriesBefore.indexOf(entry);

      if(entriesBefore.length===2){
        materialCardNumber.classList.remove("is-visible");
        deleteFirstMaterialBtn.classList.remove("is-visible");
        deleteFirstMaterialBtn.setAttribute("aria-hidden","true");
      }

      if(removedIndex===0 && entriesBefore[1]){
        entriesBefore[1].classList.add("is-primary");
      }

      entriesBefore.slice(removedIndex+1).forEach((remaining,offset)=>{
        const nextIndex=removedIndex+offset;
        const nextNumber=materialNumberLabel(nextIndex+1);
        const title=remaining.querySelector("[data-material-entry-title]");
        const nextText="使用教材"+nextNumber;

        if(nextIndex===0){
          if(title)title.textContent=nextText;
        }else{
          animateMaterialTitleSwap(title,nextText);
        }

        /* Renumber the surviving material's ranges in the same motion window
           as the material itself collapses. Previously this waited for the
           removed entry to leave the DOM and refreshMaterialEntryLabels(). */
        const ranges=[...remaining.querySelectorAll("[data-material-range]")];
        const showRangeNumbers=ranges.length>1;
        ranges.forEach((range,rangeIndex)=>{
          refreshRangeNumber(
            range.querySelector("[data-range-number]"),
            showRangeNumbers?nextNumber:"",
            showRangeNumbers?"-"+(rangeIndex+1):"",
            showRangeNumbers,
            true
          );
        });

        const deleteBtn=remaining.querySelector("[data-delete-material]");
        if(deleteBtn){
          deleteBtn.setAttribute(
            "aria-label",
            "教材"+nextNumber+"を削除"
          );
        }
      });

      const finish=()=>{
        entry.remove();
        refreshMaterialEntryLabels({animateRangeNumbers:false});
        v.materials=capture(v).materials;
        autoSaveNow(v);
      };

      if(prefersReducedMotion()){
        finish();
        return;
      }

      let finished=false;
      const finishOnce=()=>{
        if(finished)return;
        finished=true;
        finish();
      };

      entry.addEventListener("transitionend",e=>{
        if(e.target===entry && e.propertyName==="grid-template-rows"){
          finishOnce();
        }
      },{once:true});

      entry.classList.add("is-collapsed");
      setTimeout(finishOnce,MOTION.move+80);
    };

    const bindMaterialEntry=entry=>{
      const mat=entry.querySelector("[data-material-select]");
      const customWrap=entry.querySelector("[data-custom-material-wrap]");
      const customInput=entry.querySelector("[data-custom-material]");
      const rangeList=entry.querySelector("[data-material-range-list]");
      const addRangeBtn=entry.querySelector("[data-add-range]");
      const deleteBtn=entry.querySelector("[data-delete-material]");

      const rangeItems=()=>[...entry.querySelectorAll("[data-material-range]")];

      const syncRangeChrome=({excluding=null,animateNumbers=true}={})=>{
        const allRanges=rangeItems();
        const remainingRanges=excluding
          ? allRanges.filter(range=>range!==excluding)
          : allRanges;
        const multiple=remainingRanges.length>1;
        const materialIndex=materialEntryList().indexOf(entry);
        const materialNumber=materialNumberLabel(materialIndex+1);

        allRanges.forEach(range=>{
          const deleteRangeBtn=range.querySelector("[data-delete-range]");
          const isRemaining=range!==excluding;
          const showDelete=isRemaining&&multiple;

          if(deleteRangeBtn){
            deleteRangeBtn.classList.toggle("is-visible",showDelete);
            deleteRangeBtn.setAttribute("aria-hidden",String(!showDelete));
          }
        });

        remainingRanges.forEach((range,index)=>{
          refreshRangeNumber(
            range.querySelector("[data-range-number]"),
            multiple?materialNumber:"",
            multiple?"-"+(index+1):"",
            multiple,
            animateNumbers
          );
        });
      };

      const updateRangeDeleteVisibility=()=>syncRangeChrome({
        animateNumbers:false
      });

      const updateRangeUnit=range=>{
        const from=range.querySelector("[data-material-page-from]")?.value||"";
        const to=range.querySelector("[data-material-page-to]")?.value||"";
        const unitDisplay=range.querySelector("[data-material-unit]");
        const units=unitListForRanges(mat?.value,(from||to)?[{from,to}]:[]);

        if(unitDisplay){
          unitDisplay.innerHTML=units.length
            ? '<span class="material-unit-track">'+units.map(esc).join(" ／ ")+'</span>'
            : "";
          unitDisplay.scrollLeft=0;
        }
      };

      const bindRange=range=>{
        range.querySelectorAll("[data-material-page-from],[data-material-page-to]").forEach(input=>{
          input.oninput=()=>{
            entry.dataset.materialDraft="false";
            updateRangeUnit(range);
            scheduleAutoSave(v);
          };
        });

        const deleteRangeBtn=range.querySelector("[data-delete-range]");
        if(deleteRangeBtn){
          deleteRangeBtn.onclick=()=>{
            if(rangeItems().length<=1)return;

            const finish=()=>{
              range.remove();
              syncRangeChrome({animateNumbers:false});
              refreshMaterialEntryLabels({animateRangeNumbers:false});
              v.materials=capture(v).materials;
              autoSaveNow(v);
            };

            if(prefersReducedMotion()){
              finish();
              return;
            }

            /* Start the surviving rows' UI transition at the exact same time
               as the deleted row starts collapsing. Previously these updates
               waited until transitionend, so delete buttons / numbering moved
               only after the row had already closed. */
            syncRangeChrome({
              excluding:range,
              animateNumbers:true
            });

            let finished=false;
            const finishOnce=()=>{
              if(finished)return;
              finished=true;
              finish();
            };

            range.addEventListener("transitionend",e=>{
              if(e.target===range && e.propertyName==="grid-template-rows"){
                finishOnce();
              }
            },{once:true});

            range.classList.add("is-collapsed");
            setTimeout(finishOnce,MOTION.move+80);
          };
        }
      };

      rangeItems().forEach(bindRange);
      updateRangeDeleteVisibility();

      addRangeBtn.onclick=()=>{
        const holder=document.createElement("div");
        holder.innerHTML=materialRangeMarkup({from:"",to:""},mat?.value||"",true);
        const range=holder.firstElementChild;
        range.classList.add("is-collapsed");
        rangeList.append(range);
        bindRange(range);

        revealCollapsedShell(range,animate=>{
          /* Existing range numbers / delete actions and the new row now start
             their motion in the same reveal frame. */
          syncRangeChrome({animateNumbers:animate});
        });

        v.materials=capture(v).materials;
        autoSaveNow(v);
      };

      const updateCustomMaterialVisibility=()=>{
        const open=mat.value==="__custom__";
        customWrap?.classList.toggle("is-open",open);
        customWrap?.setAttribute("aria-hidden",String(!open));
        if(customInput)customInput.disabled=!open;
      };

      mat.onchange=()=>{
        entry.dataset.materialDraft="false";
        updateCustomMaterialVisibility();
        rangeItems().forEach(updateRangeUnit);
        autoSaveNow(v);
      };

      customInput?.addEventListener("input",()=>{
        entry.dataset.materialDraft="false";
        scheduleAutoSave(v);
      });

      if(deleteBtn){
        deleteBtn.onclick=()=>requestMaterialDelete(entry);
      }
    };
    materialEntries.querySelectorAll("[data-material-entry]").forEach(bindMaterialEntry);

    deleteFirstMaterialBtn.onclick=()=>{
      const first=materialEntryList()[0];
      if(first)requestMaterialDelete(first);
    };

    refreshMaterialEntryLabels({animateRangeNumbers:false});

    addMaterialBtn.onclick=()=>{
      if(materialEntryList().length>=MATERIAL_MAX)return;

      const current=capture(v);
      v.materials=current.materials;

      const newEntry=normalizeMaterialEntry(
        {draft:true},
        l.materials[0]||allMaterials[0]||""
      );
      v.materials.push(newEntry);

      const holder=document.createElement("div");
      holder.innerHTML=materialEntryMarkup(newEntry,allMaterials,false);
      const entry=holder.firstElementChild;
      entry.classList.add("is-collapsed");
      materialEntries.append(entry);
      bindMaterialEntry(entry);

      revealCollapsedShell(entry,animate=>{
        /* Material numbering/delete chrome and the new material open together.
           The two-frame wait remains only to establish the closed start state. */
        refreshMaterialEntryLabels({animateRangeNumbers:animate});
      });

      autoSaveNow(v);
    };

    document.getElementById("review").oninput=e=>{
      document.getElementById("reviewCount").textContent=e.target.value.length+"文字";
      scheduleAutoSave(v);
    };

    const prevRow=document.getElementById("prevRow");
    const prevBtn=document.getElementById("prevBtn");
    const prevBtnLabel=document.getElementById("prevBtnLabel");
    const previousReview=document.getElementById("previousReview");

    if(!l.history[0]){
      prevRow.hidden=true;
    }

    const setPreviousReviewToggle=(open,{animate=true}={})=>{
      const nextLabel=open?"前回の講評を閉じる":"前回の講評を見る";

      previousReview.classList.toggle("open",open);
      previousReview.setAttribute("aria-hidden",String(!open));
      prevBtn.setAttribute("aria-expanded",String(open));

      prevBtnLabel.getAnimations().forEach(animation=>animation.cancel());

      if(!animate||prefersReducedMotion()||prevBtnLabel.textContent===nextLabel){
        prevBtnLabel.textContent=nextLabel;
        return;
      }

      /* Same 210ms trajectory as other text substitutions:
         current text exits left, swaps while transparent, then returns. */
      const midpoint=MOTION.move/2;
      const animation=prevBtnLabel.animate(
        [
          {opacity:1,transform:"translateX(0)",offset:0},
          {opacity:0,transform:"translateX(-4px)",offset:.48},
          {opacity:0,transform:"translateX(-4px)",offset:.52},
          {opacity:1,transform:"translateX(0)",offset:1}
        ],
        {
          duration:MOTION.move,
          easing:MOTION.ease
        }
      );

      const swapTimer=setTimeout(()=>{
        prevBtnLabel.textContent=nextLabel;
      },midpoint);

      animation.onfinish=()=>{
        clearTimeout(swapTimer);
        prevBtnLabel.textContent=nextLabel;
      };
      animation.oncancel=()=>clearTimeout(swapTimer);
    };

    prevBtn.onclick=()=>{
      state.showPrev=!state.showPrev;
      setPreviousReviewToggle(state.showPrev);
    };

    document.querySelectorAll("[data-rating]").forEach(b=>b.onclick=()=>{
      state.rating=b.dataset.rating;
      document.querySelectorAll("[data-rating]").forEach(x=>x.classList.toggle("active",x.dataset.rating===state.rating));
      autoSaveNow(v);
    });

    document.querySelectorAll("[data-forgot]").forEach(b=>b.onclick=()=>{
      const x=b.dataset.forgot;
      if(x==="なし")state.forgot=new Set(["なし"]);
      else{
        state.forgot.delete("なし");
        state.forgot.has(x)?state.forgot.delete(x):state.forgot.add(x);
        if(!state.forgot.size)state.forgot.add("なし");
      }
      document.querySelectorAll("[data-forgot]").forEach(z=>z.classList.toggle("active",state.forgot.has(z.dataset.forgot)));
      document.getElementById("forgotOtherWrap").classList.toggle("open",state.forgot.has("その他"));
      autoSaveNow(v);
    });

    ["homeworkComment","nextHomework","forgotOther","note"].forEach(id=>{
      const el=document.getElementById(id);
      if(el)el.addEventListener("input",()=>scheduleAutoSave(v));
    });
  }

  window.addEventListener("resize",()=>{
    requestAnimationFrame(refreshRecordHorizontalControls);
    scheduleLineHeaderLayout();
  },{passive:true});
  if(IS_LINE_INAPP&&window.visualViewport){
    window.visualViewport.addEventListener("resize",scheduleLineHeaderLayout,{passive:true});
  }
  renderList();
})();
</script>
</body>
