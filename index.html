<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=overlays-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3f5f7">
<title>授業記録システム v0.1</title>
<!--
  ============================================================
  残課題メモ（2026-09-22）

  ■ 課題
  iOS Safari でソフトウェアキーボードを開閉すると、下部固定フッターと
  Safari 自身の visualViewport / 自動スクロール / ブラウザUI復元が干渉し、
  開始スクロール位置や開閉回数によって挙動が変わることがある。

  確認された主な症状:
  - キーボードを開いた瞬間、fixed フッターがキーボード上へ持ち上がる。
  - 閉じる途中でフッターが裏から自然に出ず、閉じ切った後にパッと出る。
  - 対策後、フッターがガタガタ震えることがある。
  - 講評 textarea の自動スクロール位置が1回目と2回目以降で変わることがある。
  - 閉じる際にページ本体がガクッと元位置へ復元されることがある。
  - 閉じる際のスクロール固定を強くすると、その後のフッターナビの移動と競合する。

  ■ これまで試した対処（現在はすべて撤去）
  1. visualViewport の縮み量を使って fixed フッターを下方向へ相殺移動。
  2. キーボード中だけ fixed → absolute に切り替え、キーボード裏へドック。
  3. visualViewport.pageTop / offsetTop / window.scrollY を使ってドック位置を追従。
  4. キーボード閉鎖時にページの visual top を一時固定して Safari の復元スクロールを抑制。
  5. textarea が見やすくなるよう、キーボード展開後に追加スクロール補正。
  6. Safari の自動スクロール終了を待ってから1回だけ補正する方式。
  7. viewport の最小高さ・回復量から opening / closing を判定する方式。
  8. 閉鎖後に absolute → fixed へ戻すタイミングを遅延・settle 判定する方式。

  上記はいずれも一部の症状を改善したが、別の症状・回数依存・震えを発生させた。
  特に「継続的な位置追従」「window.scrollTo/scrollBy によるスクロール固定」
  「fixed/absolute の動的切替」は、Safari のネイティブ挙動と競合しやすかった。

  ■ 過去の比較基準
  - keyboard-dock-05: 複雑化前の比較的安定した基準版。
  - 05c: 入力欄位置の再現性が一時改善。
  - 05d: 閉じる際のページ本体の「ガクッ」を一時抑制。
  ただし、いずれも最終的な安定解ではない。

  ■ 現在の暫定方針（fallback）
  課題を解決しようとしてフッター位置やページスクロールを操作する処理は全撤去。
  Safari のキーボード表示中はフッターを単純に visibility:hidden にするだけとする。
  キーボードが閉じて visualViewport の高さが元に戻ったら再表示する。
  ページ本体のスクロール位置は Safari に任せ、こちらから補正しない。

  ■ 再開時の注意
  - 本件は「未解決の残課題」。暫定非表示を完成仕様とはみなさない。
  - まずこの hide-only 版を壊さず比較基準にする。
  - fixed/absolute 切替、pageTop 追従、継続スクロール補正、close-lock を
    一度に再導入しない。必ず1要因ずつ検証する。
  - UIの光学補正とは別問題。1px調整等で解決しようとしない。
  ============================================================
-->
<style>
:root{
  --bg:#f3f5f7;--card:#fff;--text:#1f2933;--sub:#6b7280;--line:#d7dde4;
  --primary:#315b8a;
  --body-radius:10.5px;
  --motion-dur:.21s;
  --motion-ease:cubic-bezier(.22,.72,.26,1);
  --fade-dur:.10s
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Yu Gothic",sans-serif;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:clip}
body{min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{touch-action:manipulation}
.app{max-width:720px;margin:0 auto;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
.header{
  --header-icon-size:30px;
  --header-curve-gap:6px;
  --header-control-height:calc(var(--header-icon-size) + var(--header-curve-gap)*2);
  --header-control-radius:calc(var(--header-icon-size)/2 + var(--header-curve-gap));
  position:sticky;top:0;z-index:20;
  background:rgba(255,255,255,.96);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-bottom:0;
  margin:0 -16px;
  padding:calc(10px + env(safe-area-inset-top)) 10px 10px
}
html.line-inapp .app{
  padding-top:var(--line-header-height,0px);
}
html.line-inapp .header{
  position:fixed;
  top:0;
  left:50%;
  width:100%;
  max-width:720px;
  margin:0;
  transform:translateX(-50%);
}
.header-row{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:8px
}
.header-center{
  text-align:center;
  min-width:0;
  height:var(--header-control-height);
  display:flex;
  justify-content:center;
  align-items:center
}
.header-title{
  font-size:17px;
  font-weight:700;
  letter-spacing:.01em;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  white-space:nowrap;
  line-height:1;
  height:var(--header-control-height)
}
.header-grade{
  display:inline-flex;
  align-items:center;
  line-height:1
}
.header-sep{
  width:1px;
  height:22px;
  background:#b8c1cb;
  display:inline-block;
  align-self:center;
  margin-left:1px;
  margin-right:-1px;
  font-size:0;
  line-height:0;
  flex:0 0 1px
}
.header-right{display:flex;justify-content:flex-end}
.header-left{display:flex;justify-content:flex-start}

.header-action{
  height:var(--header-control-height);
  border-radius:var(--header-control-radius);
  display:grid;
  align-items:center;
  border:1.25px solid #cbd3dc;
  background:#fff;
  font-weight:700;
  font-size:16px;
  white-space:nowrap;
  line-height:1;
  -webkit-tap-highlight-color:transparent;
  appearance:none;
  -webkit-appearance:none;
  transition:
    background-color .16s ease,
    border-color .16s ease,
    color .16s ease,
    transform .12s ease,
    box-shadow .16s ease,
    opacity .16s ease
}
.header-action .header-icon{
  width:var(--header-icon-size);
  height:var(--header-icon-size);
  border-radius:50%;
  display:grid;
  place-items:center;
  justify-self:center;
  align-self:center
}
.header-action .header-icon svg{
  width:20px;
  height:20px;
  display:block;
  fill:none;
  stroke:currentColor;
  stroke-width:2.15;
  stroke-linecap:round;
  stroke-linejoin:round;
  shape-rendering:geometricPrecision
}
.icon-back-svg{transform:translateX(-0.45px)}
.icon-submit-svg{transform:translateY(-0.7px)}
.header-action > span:not(.header-icon){
  display:block;
}
/*
  同心円ルール：
  外カプセル高 42px → 端の半径 21px
  内円 30px → 半径 15px
  21 - 15 = 6px
  左右端の42pxゾーンの中心に内円を置くことで、
  CSS上でも円周間距離を常に6pxにする。
*/
.header-back{
  grid-template-columns:var(--header-control-height) auto;
  column-gap:2px;
  padding:0 12px 0 0;
  color:var(--text)
}
.header-back .header-icon{
  border:1.25px solid #aeb8c3;
  color:#243140;
  transition:
    background-color .16s ease,
    border-color .16s ease,
    color .16s ease,
    transform .12s ease
}
.header-submit{
  grid-template-columns:auto var(--header-control-height);
  column-gap:2px;
  padding:0 0 0 12px;
  color:#fff;
  background:linear-gradient(180deg,#2f8cff 0%, #2278ef 100%);
  border-color:#2278ef;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12)
}
.header-submit .header-icon{
  border:0;
  color:#2278ef;
  transition:
    background-color .16s ease,
    color .16s ease,
    transform .12s ease,
    opacity .16s ease
}
.header-back .header-icon,
.header-submit .header-icon{
  background:#fff;
  box-shadow:none;
}
/* 参照モックに合わせたタップ時の見え方 */
.header-back:active,
.header-back.is-pressed{
  background:#edf3f8;
  border-color:#d4dde7;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55)
}
.header-back:active .header-icon,
.header-back.is-pressed .header-icon{
  background:#fff;
  border-color:#96a4b2;
  color:#243140
}
.header-submit:active,
.header-submit.is-pressed{
  background:linear-gradient(180deg,#247cf1 0%, #1a67da 100%);
  border-color:#1a67da;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10)
}
.header-submit:active .header-icon,
.header-submit.is-pressed .header-icon{
  background:#fff;
  color:#1a67da
}
.header-action:active,
.header-action.is-pressed{transform:scale(.985)}
.badge{display:inline-block;border-radius:999px;padding:6px 10px;background:#e9edf1;color:#55606d;font-size:12px}.badge.done{background:#e7f3ea;color:#28663a}
.page-title{font-size:22px;font-weight:700;margin:20px 0 4px}.page-sub{font-size:14px;color:var(--sub);margin-bottom:14px}
.lesson-list{display:grid;gap:12px;margin-top:14px}
.lesson-card{width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--body-radius);padding:16px;display:grid;grid-template-columns:66px 1fr auto;gap:12px;align-items:center}
.lesson-time{font-weight:700}.lesson-name{font-size:18px;font-weight:700}.lesson-meta{font-size:14px;color:var(--sub);margin-top:3px}
.build-id{
  margin-top:12px;
  text-align:right;
  font-size:11px;
  font-weight:600;
  color:#9aa3ad;
  letter-spacing:.01em;
  user-select:text;
}
.record-form{
  margin:0;
  padding:0;
  border:0;
}

.record-section{
  --record-list-inset:15px;
  --record-status-size:10.5px;
  --record-mark-size:10.5px;
  --record-mark-stroke:1.75px;
  --record-mark-optical-y:.5px;
  --record-label-gap:7px;
  --record-half-label-gap:3.5px;
  --record-field-gap:8px;
  --record-content-gap:12px;
  --record-item-gap:16px;
  --record-horizontal-space-preferred:10px;
  --record-horizontal-space-min:6px;
  --record-horizontal-space:var(--record-horizontal-space-preferred);
  --record-color-dur:.15s;
  --record-color-ease:cubic-bezier(.22,.72,.26,1);

  /* Body controls stay flat; header/footer own the glossy material language. */
  --record-control-height:42px;
  --record-section-title-font-size:20px;
  --record-card-title-font-size:18px;
  --record-control-font-size:16px;
  --record-label-font-size:14px;
  --record-textarea-line-height:1.65;
  --record-textarea-visual-inset:12px;
  --record-textarea-half-leading:.325em;
  --record-control-font-weight:700;
  --record-control-bg:#fff;
  --record-control-border:#cbd3dc;
  --record-control-text:#56616e;
  --record-control-active-bg:#dce9f7;
  --record-control-active-border:#7fa3cc;
  --record-control-active-text:#234e7a;
  --record-control-pressed-bg:#f2f5f8;
  --record-control-active-pressed-bg:#d2e2f3;
  --record-control-active-pressed-border:#6f95c0;

  --record-control-inset:calc(var(--record-status-size) + var(--record-half-label-gap));
  --record-divider-start:calc(var(--record-list-inset) + var(--record-control-inset));
  margin:0;
  padding-top:20px;
  padding-bottom:var(--record-item-gap);
  scroll-margin-top:86px;
  display:grid;
  row-gap:var(--record-item-gap);
}

/* Preview shows only the values that were actually selected. */
.app.preview-mode .record-section{
  --record-control-active-bg:#dcf7e9;
  --record-control-active-border:#7fcca3;
  --record-control-active-text:#237a4b;
  --record-control-active-pressed-bg:#d2f3e1;
  --record-control-active-pressed-border:#6fc095;
}
.preview-option-hidden{
  display:none!important;
}
.record-section-title{
  margin:0 4px 0;
  display:flex;
  align-items:center;
  gap:8px;
  font-size:var(--record-section-title-font-size);
  font-weight:800;
  line-height:1.2;
  letter-spacing:.01em;
}
.record-section-title::before{
  content:"";
  width:3px;
  height:1.15em;
  flex:0 0 3px;
  border-radius:999px;
  background:#44515e;
  transform:translateY(var(--record-mark-optical-y));
  transition:background-color var(--record-color-dur) var(--record-color-ease);
}
.record-section.is-current .record-section-title::before{
  background:#2278ef;
}
.app.preview-mode .record-section.is-current .record-section-title::before{
  background:#2faa68;
}
.record-section-title::after{
  content:"";
  height:1px;
  flex:1 1 auto;
  background:#cbd3dc;
}
.record-section .card-title-row{
  display:flex;
  align-items:baseline;
  gap:var(--record-label-gap);
  min-height:calc(var(--record-card-title-font-size) + 4px);
  margin:0 0 var(--record-content-gap);
}
.record-section .card-title-row .card-title{margin:0}
.material-card-title{
  display:inline-flex;
  align-items:baseline;
  flex:0 0 auto;
  line-height:1.2;
}
.material-card-number-slot{
  display:inline-block;
  width:1em;
  max-width:0;
  flex:0 0 auto;
  overflow:hidden;
  white-space:nowrap;
  opacity:0;
  line-height:1.2;
  transform:translateX(-4px);
  will-change:max-width,opacity,transform;
  transition:
    max-width var(--motion-dur) var(--motion-ease),
    transform var(--motion-dur) var(--motion-ease),
    opacity var(--fade-dur) ease;
}
.material-card-number-slot.is-visible{
  max-width:1em;
  opacity:1;
  transform:translateX(0);
}
.record-section .inline-auto-hint{
  /* Card title and right-side actions keep their intrinsic width.
     The annotation owns only the remaining space, so it is the one item
     allowed to shrink/ellipsis on narrow screens. */
  flex:1 1 auto;
  min-width:0;
  margin:0;
  align-self:baseline;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  text-align:left;
  line-height:1.2;
}

/* Preview rule: keep recorded values; remove edit/reference-only affordances. */
.preview-edit-hint{
  display:inline-block;
  max-width:14em;
  overflow:hidden;
  opacity:1;
  transform:translateX(0);
  transition:
    max-width var(--motion-dur) var(--motion-ease),
    transform var(--motion-dur) var(--motion-ease),
    opacity var(--fade-dur) ease;
  will-change:max-width,opacity,transform;
}
.app.preview-mode .preview-edit-hint{
  max-width:0;
  opacity:0;
  transform:translateX(-4px);
}

.vt-review .counter{
  max-height:1.5em;
  overflow:hidden;
  opacity:1;
  transform:translateX(0);
  transition:
    max-height var(--motion-dur) var(--motion-ease),
    margin-top var(--motion-dur) var(--motion-ease),
    transform var(--motion-dur) var(--motion-ease),
    opacity var(--fade-dur) ease;
}
.app.preview-mode .vt-review .counter{
  max-height:0;
  margin-top:0;
  opacity:0;
  transform:translateX(-4px);
}

.app.preview-mode .vt-review #review::placeholder{
  opacity:0;
}
.vt-review #review::placeholder{
  transition:opacity var(--fade-dur) ease;
}

.app.preview-mode .vt-material .record-select-icon{
  opacity:0;
}
.vt-material .record-select-icon{
  opacity:1;
  transition:
    opacity var(--fade-dur) ease,
    color var(--record-color-dur) var(--record-color-ease);
}

.review-prev-row{
  display:flex;
  justify-content:flex-start;
  margin-top:var(--record-content-gap);
  max-height:1.5em;
  overflow:hidden;
  opacity:1;
  transform:translateX(0);
  transition:
    max-height var(--motion-dur) var(--motion-ease),
    margin-top var(--motion-dur) var(--motion-ease),
    transform var(--motion-dur) var(--motion-ease),
    opacity var(--fade-dur) ease;
}
.app.preview-mode .review-prev-row{
  max-height:0;
  margin-top:0;
  opacity:0;
  transform:translateX(-4px);
  pointer-events:none;
}
.app.preview-mode .previous-review-reveal{
  grid-template-rows:0fr;
}
.app.preview-mode .previous-review-content{
  opacity:0;
  transform:translateX(-4px);
}

/* Rounded square = content/input state. */
.record-section .card-status{
  position:relative;
  width:var(--record-status-size);
  height:var(--record-status-size);
  flex:0 0 var(--record-status-size);
  box-sizing:border-box;
  transform:translateY(var(--record-mark-optical-y));
  align-self:center;
  border:var(--record-mark-stroke) solid #56616e;
  border-radius:25%;
  background:#fff;
  transition:
    background-color var(--record-color-dur) var(--record-color-ease),
    border-color var(--record-color-dur) var(--record-color-ease);
}
.record-section .card.is-complete .card-status{
  background:#56616e;
  border-color:#56616e;
}

/* Color means current location, not completion. */
.record-section.is-current .card-status{
  border-color:#2278ef;
}
.record-section.is-current .card.is-complete .card-status{
  background:#2278ef;
  border-color:#2278ef;
}
.app.preview-mode .record-section.is-current .card-status{
  border-color:#2faa68;
}
.app.preview-mode .record-section.is-current .card.is-complete .card-status{
  background:#2faa68;
  border-color:#2faa68;
}

/* Record cards are list items, not enclosing boxes. */
.record-section .card{
  position:relative;
  background:transparent;
  border:0;
  border-radius:0;
  margin:0;
  padding:0 4px var(--record-item-gap) var(--record-list-inset);
}
.record-section .card::after{
  content:"";
  position:absolute;
  left:var(--record-divider-start);
  right:4px;
  bottom:0;
  height:1px;
  background:#d7dde4;
}

/* Body and separator share the midpoint between status square and title. */
.record-section .card-body{
  margin-left:var(--record-control-inset);
  min-width:0;
}

.card-title{font-size:var(--record-card-title-font-size);font-weight:700;line-height:1.2;margin:0 0 4px}.hint{font-size:var(--record-label-font-size);color:var(--sub);margin:0 0 12px}
.readonly{
  min-height:var(--record-control-height,42px);
  display:flex;
  align-items:center;
  border:1px solid var(--line);
  background:#f7f8fa;
  border-radius:var(--body-radius);
  padding:8px var(--record-horizontal-space,10px);
  line-height:1.45;
}

/* Direct-edit date/time blocks.
   Layout is structural: the date/time group stays intact, while duration
   naturally moves to the next line when the row becomes too narrow. */
.datetime-blocks{
  --record-horizontal-space:var(--record-horizontal-space-preferred);
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:var(--record-horizontal-space);
  min-width:0;
  width:100%;
}
.datetime-main{
  display:grid;
  grid-template-columns:max-content max-content max-content max-content;
  align-items:center;
  column-gap:var(--record-horizontal-space);
  min-width:0;
}
.datetime-main .dt-block,
.datetime-blocks > .dt-block{
  flex:0 0 auto;
}
.datetime-duration{
  margin-left:auto;
  flex:0 0 auto;
}
@media(max-width:380px){
  .datetime-blocks{
    --record-horizontal-space:var(--record-horizontal-space-min);
  }
}
.datetime-end-time{
  flex:0 0 auto;
  font-size:var(--record-control-font-size);
  font-weight:var(--record-control-font-weight);
  color:var(--record-control-text);
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.dt-block{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:auto;
  height:var(--record-control-height);
  min-width:0;
  border:1px solid #cbd3dc;
  background:#f7f8fa;
  border-radius:var(--body-radius);
  padding:0 var(--record-horizontal-space);
  font-weight:var(--record-control-font-weight);
  font-size:var(--record-control-font-size);
  color:var(--record-control-text);
  white-space:nowrap;
  box-shadow:0 1px 0 rgba(31,41,51,.02);
  -webkit-appearance:none;
  appearance:none;
  text-align:center;
  text-align-last:center;
}
.dt-block:active{background:#eef2f6}

.field{margin-top:var(--record-item-gap)}.label{display:block;font-size:var(--record-label-font-size);font-weight:600;margin-bottom:var(--record-field-gap)}
.material-entries{
  display:grid;
}
.material-entry-shell{
  display:grid;
  grid-template-rows:1fr;
  overflow:visible;
  transition:grid-template-rows var(--motion-dur) var(--motion-ease);
}
.material-entry-shell.is-collapsed{
  grid-template-rows:0fr;
}
.material-entry-clip{
  min-height:0;
  overflow:hidden;
}
.material-entry-content{
  position:relative;
  min-width:0;
  padding-top:calc(var(--record-item-gap) * 2 + 1px);
  transition:padding-top var(--motion-dur) var(--motion-ease);
}

/* Footer grammar:
   the shell clips the content while its size changes.
   Do not fade the whole material set; only label-like text fades/moves. */
.material-entry-shell.is-collapsed .material-entry-heading{
  opacity:0;
  transform:translateX(-4px);
}
.material-entry-content::before{
  content:"";
  position:absolute;
  top:var(--record-item-gap);
  left:0;
  right:0;
  height:1px;
  background:var(--line);
  opacity:1;
  transition:opacity var(--fade-dur) ease;
}
.material-entry-heading{
  display:flex;
  align-items:center;
  height:calc(var(--record-card-title-font-size) + 4px);
  overflow:hidden;
  line-height:1.2;
  margin-bottom:var(--record-content-gap);
  opacity:1;
  transform:translateX(0);
  transition:
    height var(--motion-dur) var(--motion-ease),
    margin-bottom var(--motion-dur) var(--motion-ease),
    transform var(--motion-dur) var(--motion-ease),
    opacity var(--fade-dur) ease;
}
.material-entry-shell.is-primary .material-entry-content{
  padding-top:0;
}
.material-entry-shell.is-primary .material-entry-content::before{
  opacity:0;
}
.material-entry-shell.is-primary .material-entry-heading{
  height:0;
  margin-bottom:0;
  opacity:0;
  transform:translateX(-4px);
  pointer-events:none;
}
.material-entry-title{
  font-size:var(--record-card-title-font-size);
  font-weight:700;
  line-height:1.2;
}
.material-entry{
  display:grid;
  gap:0;
}
.material-entry>.field,
.material-detail-field{
  margin-top:0;
}
.material-selection-stack{
  display:grid;
}
.material-custom-shell{
  display:grid;
  grid-template-rows:0fr;
  pointer-events:none;
  transition:grid-template-rows var(--motion-dur) var(--motion-ease);
}
.material-custom-shell.is-open{
  grid-template-rows:1fr;
  pointer-events:auto;
}
.material-custom-clip{
  min-height:0;
  overflow:hidden;
}
.material-custom-content{
  padding-top:var(--record-item-gap);
  opacity:0;
  transform:translateX(-4px);
  transition:
    transform var(--motion-dur) var(--motion-ease),
    opacity var(--fade-dur) ease;
}
.material-custom-shell.is-open .material-custom-content{
  opacity:1;
  transform:translateX(0);
}
.material-custom-field{
  margin-top:0;
}
.material-range-list{
  display:grid;
  gap:0;
  margin-top:var(--record-item-gap);
}
.material-range-shell{
  display:grid;
  grid-template-rows:1fr;
  transition:grid-template-rows var(--motion-dur) var(--motion-ease);
}
.material-range-shell.is-collapsed{
  grid-template-rows:0fr;
}
.material-range-clip{
  min-height:0;
  overflow:hidden;
}
.material-range-content{
  min-width:0;
  /* In edit mode each range owns the following 16px spacing so add/remove
     motion stays inside the collapsible shell. */
  padding-bottom:var(--record-item-gap);
  transition:padding-bottom var(--motion-dur) var(--motion-ease);
}
/* Preview may omit empty ranges. The last range that actually remains visible
   releases the edit-mode spacer before "＋範囲を追加"; the card itself keeps
   the single 16px spacing before the divider. */
.app.preview-mode .material-range-shell.is-preview-last-visible .material-range-content{
  padding-bottom:0;
}
.app.preview-mode .material-range-shell.is-preview-empty,
.app.preview-mode .material-entry-shell.is-preview-empty{
  grid-template-rows:0fr;
  pointer-events:none;
}
.app.preview-mode .material-entry-shell.is-preview-empty .material-entry-heading{
  opacity:0;
  transform:translateX(-4px);
}
.material-range-delete{
  grid-column:3;
  grid-row:1;
  justify-self:end;
  align-self:baseline;
  position:static;
  padding:0;
  border:0;
  background:none;
  color:var(--primary);
  white-space:nowrap;
  opacity:0;
  transform:translateX(-4px);
  pointer-events:none;
  transition:
    transform var(--motion-dur) var(--motion-ease),
    opacity var(--fade-dur) ease;
  will-change:opacity,transform;
}
.material-range-delete.is-visible{
  opacity:1;
  transform:translateX(0);
  pointer-events:auto;
}
.material-range-add-action{
  gap:6px;
  margin-top:0;
  max-height:1.5em;
  overflow:hidden;
  opacity:1;
  transform:translateX(0);
  transition:
    max-height var(--motion-dur) var(--motion-ease),
    transform var(--motion-dur) var(--motion-ease),
    opacity var(--fade-dur) ease;
  will-change:max-height,opacity,transform;
}
.app.preview-mode .material-range-add-action{
  max-height:0;
  opacity:0;
  transform:translateX(-4px);
  pointer-events:none;
}
.app.preview-mode .material-range-delete{
  opacity:0;
  transform:translateX(-4px);
  pointer-events:none;
}
.material-detail-stack{
  --material-page-input-width:calc(3ch + var(--record-horizontal-space)*2 + 6px);
  --material-range-separator-width:var(--record-control-font-size);
  --material-line-width:14px;
  display:grid;
  /* Let the first track measure the real rendered width of the page-range
     controls. Do not recalculate that width in the parent with another 3ch. */
  grid-template-columns:
    max-content
    var(--material-line-width)
    minmax(0,1fr);
  grid-template-rows:auto var(--record-control-height);
  column-gap:var(--record-horizontal-space);
  row-gap:var(--record-field-gap);
  align-items:stretch;
}

/* The two labels and both controls live on one shared parent grid.
   This keeps their control row identical in portrait and landscape. */
.material-detail-field{
  display:contents;
}

.material-detail-stack > .material-detail-field:first-of-type > .label{
  grid-column:1;
  grid-row:1;
}
.material-detail-stack > .material-detail-field:first-of-type > .material-range-controls{
  grid-column:1;
  grid-row:2;
}
.material-detail-stack > .material-detail-field:last-of-type > .label{
  grid-column:3;
  grid-row:1;
  justify-self:start;
}
.material-detail-stack > .material-detail-field:last-of-type > .material-unit-window{
  grid-column:3;
  grid-row:2;
}
.material-detail-label,
.material-range-delete{
  font-size:var(--record-label-font-size);
  font-weight:600;
  line-height:1.2;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
.material-detail-label{
  margin:0;
  align-self:baseline;
}
.material-range-label{
  display:block;
}
.material-range-number{
  /* inline-block + overflow:hidden uses the box bottom as its baseline,
     which lifted ①-1 / ①-2 like a superscript. An inline flex container
     derives its baseline from the text inside, while still allowing the
     horizontal clipping needed for the number reveal animation. */
  display:inline-flex;
  align-items:baseline;
  max-width:0;
  overflow:hidden;
  white-space:nowrap;
  opacity:0;
  transform:translateX(-4px);
  vertical-align:baseline;
  font-size:inherit;
  font-weight:inherit;
  will-change:max-width,opacity,transform;
  transition:
    max-width var(--motion-dur) var(--motion-ease),
    transform var(--motion-dur) var(--motion-ease),
    opacity var(--fade-dur) ease;
}
.material-range-number.is-visible{
  max-width:4em;
  opacity:1;
  transform:translateX(0);
}
.material-range-number-symbol{
  font-size:inherit;
  font-weight:700;
}
.material-relation-line{
  grid-column:2;
  grid-row:2;
  width:var(--material-line-width);
  height:var(--record-mark-stroke);
  align-self:center;
  justify-self:center;
  margin:0;
  transform:translateY(var(--record-mark-optical-y));
  border-radius:999px;
  background:#aeb8c3;
}
.material-range-controls{
  display:grid;
  /* The inputs own their width. max-content makes the grid use those actual
     rendered widths, so both 10px gaps remain exactly 10px. */
  grid-template-columns:
    max-content
    var(--material-range-separator-width)
    max-content;
  column-gap:var(--record-horizontal-space);
  align-items:center;
  width:max-content;
  min-height:var(--record-control-height);
}
.material-page-input{
  flex:0 0 var(--material-page-input-width);
  width:var(--material-page-input-width);
  min-width:var(--material-page-input-width);
  height:var(--record-control-height);
  padding:0 var(--record-horizontal-space);
  font-weight:var(--record-control-font-weight);
  color:var(--record-control-text);
  text-align:center;
  -moz-appearance:textfield;
}
.material-unit-window{
  width:100%;
  min-width:0;
  height:var(--record-control-height);
  overflow-x:auto;
  overflow-y:hidden;
  border:1px solid #b9c3cd;
  border-radius:var(--body-radius);
  background:#e2e7ec;
  padding:0 var(--record-horizontal-space);
  white-space:nowrap;
  color:#4f5b67;
  font-weight:var(--record-control-font-weight);
  display:flex;
  align-items:center;
  line-height:1.45;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-x;
  transition:
    background-color var(--record-color-dur) var(--record-color-ease),
    border-color var(--record-color-dur) var(--record-color-ease);
}
.app.preview-mode .material-unit-window{
  background:var(--record-control-bg);
  border-color:var(--record-control-border);
}
.material-unit-window::-webkit-scrollbar{
  display:none;
}
.material-unit-track{
  display:inline-block;
  min-width:max-content;
  padding-right:2px;
  line-height:1.45;
}
.material-text-action{
  display:inline-flex;
  align-items:center;
  padding:0;
  border:0;
  background:none;
  color:var(--primary);
  font-size:16px;
  font-weight:700;
  line-height:1.2;
}
.material-text-action:active{
  opacity:.58;
}
.material-add-action,
.material-range-add-action{
  display:flex;
  width:max-content;
}
.material-add-action{
  gap:6px;
  margin-top:var(--record-item-gap);
  max-height:1.5em;
  overflow:hidden;
  opacity:1;
  transform:translateX(0);
  transition:
    max-height var(--motion-dur) var(--motion-ease),
    margin-top var(--motion-dur) var(--motion-ease),
    transform var(--motion-dur) var(--motion-ease),
    opacity var(--fade-dur) ease;
  will-change:max-height,margin-top,opacity,transform;
}
.material-delete-action{
  width:0;
  flex:0 0 auto;
  margin-left:auto;
  overflow:hidden;
  white-space:nowrap;
  pointer-events:none;
  transition:width var(--motion-dur) var(--motion-ease);
  will-change:width;
}
.material-delete-action.is-visible{
  width:2em;
  pointer-events:auto;
}
.material-delete-label{
  display:inline-block;
  width:2em;
  max-width:0;
  overflow:hidden;
  white-space:nowrap;
  opacity:0;
  transform:translateX(-4px);
  transition:
    max-width var(--motion-dur) var(--motion-ease),
    transform var(--motion-dur) var(--motion-ease),
    opacity var(--fade-dur) ease;
  will-change:max-width,opacity,transform;
}
.material-delete-action.is-visible .material-delete-label{
  max-width:2em;
  opacity:1;
  transform:translateX(0);
}
.app.preview-mode .material-add-action{
  max-height:0;
  margin-top:0;
  opacity:0;
  transform:translateX(-4px);
  pointer-events:none;
}
.app.preview-mode .material-delete-action{
  width:0;
  pointer-events:none;
}
.app.preview-mode .material-delete-action .material-delete-label{
  max-width:0;
  opacity:0;
  transform:translateX(-4px);
}

@media (prefers-reduced-motion:reduce){
  .record-section button,
  .record-section .card-status,
  .record-section-title::before,
  .choice-scroll-chevron,
  .material-unit-window,
  .preview-edit-hint,
  .material-card-number-slot,
  .material-range-number,
  .material-range-delete,
  .material-range-add-action,
  .material-add-action,
  .material-delete-action,
  .material-delete-label,
  .material-entry-shell,
  .material-range-shell,
  .material-range-content,
  .material-custom-shell,
  .material-custom-content,
  .material-entry-content,
  .material-entry-content::before,
  .material-entry-heading,
  .vt-material .record-select-icon,
  .previous-review-reveal,
  .previous-review-content,
  .review-close-icon,
  .review-prev-row,
  .vt-review .counter,
  .vt-review #review::placeholder{
    transition:none;
  }
}

.record-action-icon{
  width:var(--record-status-size);
  height:var(--record-status-size);

}
.record-action-icon svg{

  width:100%;
  height:100%;
  fill:none;
  stroke:currentColor;
  stroke-width:var(--record-mark-stroke);
  stroke-linecap:round;
}
.material-page-input::-webkit-inner-spin-button,
.material-page-input::-webkit-outer-spin-button{
  -webkit-appearance:none;
  margin:0;
}
.material-range-separator{
  width:var(--material-range-separator-width);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:var(--record-control-text);
  font-size:var(--record-control-font-size);
  font-weight:var(--record-control-font-weight);
}
input,textarea,select{
  width:100%;
  max-width:100%;
  min-width:0;
  border:1px solid #cbd3dc;
  border-radius:var(--body-radius);
  background:#fff;
  padding:12px var(--record-horizontal-space,10px);
  outline:none;
}
.record-section input,
.record-section textarea,
.record-section select,
.record-section .readonly,
.record-section .dt-block,
.record-section .material-unit-window{
  font-size:var(--record-control-font-size);
}
.record-section input,
.record-section textarea,
.record-section select,
.record-section .readonly,
.record-section .dt-block{
  font-weight:var(--record-control-font-weight);
  color:var(--record-control-text);
}
input,
select{
  height:var(--record-control-height);
  padding-top:0;
  padding-bottom:0;
}
select{
  -webkit-appearance:none;
  appearance:none;
  background-image:none;
  padding-right:32px;
}
select.dt-block{padding-right:var(--record-horizontal-space)}

.record-select-shell{
  position:relative;
  width:100%;
}
.record-select-shell select{
  display:block;
  width:100%;
  padding-right:calc(var(--record-mark-size) + 30px);
  font-weight:var(--record-control-font-weight);
  color:var(--record-control-text);
}
.record-select-shell select[data-material-select]{
  padding-left:var(--record-horizontal-space);
}
.record-select-icon{
  position:absolute;
  top:50%;
  right:var(--record-horizontal-space);
  width:var(--record-mark-size);
  height:var(--record-mark-size);
  transform:translateY(calc(-50% + var(--record-mark-optical-y)));
  color:var(--record-control-text);
  pointer-events:none;
}
.record-select-icon svg{
  width:100%;
  height:100%;
  display:block;
  fill:none;
  stroke:currentColor;
  stroke-width:var(--record-mark-stroke);
  stroke-linecap:round;
  stroke-linejoin:round;
  shape-rendering:geometricPrecision;
}
textarea{
  min-height:140px;
  resize:vertical;
  line-height:var(--record-textarea-line-height,1.65);
}
.record-section textarea{
  /* 16px × 1.65 creates 5.2px of half-leading above the glyphs.
     Subtract that from the CSS padding so the visible top inset is 12px. */
  padding-top:calc(var(--record-textarea-visual-inset) - var(--record-textarea-half-leading));
  padding-bottom:calc(var(--record-textarea-visual-inset) - var(--record-textarea-half-leading));
  padding-left:var(--record-horizontal-space);
  padding-right:var(--record-horizontal-space);
}
.record-section input::placeholder,

  font-size:var(--record-control-font-size);
  font-weight:var(--record-control-font-weight);

  padding-right:var(--record-horizontal-space);
}

  touch-action:pan-y;
  caret-color:transparent;
}
input:focus,textarea:focus,select:focus{border-color:#7a9ec7;box-shadow:0 0 0 3px rgba(49,91,138,.10)}
.row{

  grid-template-columns:1fr 1fr;
  gap:var(--record-horizontal-space);
}
.row input{

}

  overflow-x:auto;

.choice-scroll-affordance{

}

.record-section button{

.record-option-label{

.review-prev-toggle{

  align-items:center;

  padding:0;

  color:var(--primary);

.review-close-icon{

  flex:0 0 0;
  margin-right:0;
  overflow:hidden;
  opacity:0;
  transform:translateX(-4px) translateY(var(--record-mark-optical-y));
  transition:
    width var(--motion-dur) var(--motion-ease),
    flex-basis var(--motion-dur) var(--motion-ease),
    margin-right var(--motion-dur) var(--motion-ease),
    transform var(--motion-dur) var(--motion-ease),
    opacity var(--fade-dur) ease;
  will-change:width,flex-basis,margin-right,opacity,transform;
}
.review-prev-toggle[aria-expanded="true"] .review-close-icon{
  width:var(--record-status-size);
  flex-basis:var(--record-status-size);
  margin-right:var(--review-action-gap);
  opacity:1;
  transform:translateX(0) translateY(var(--record-mark-optical-y));
}
#prevBtnLabel{
  display:inline-block;
  transform:translateX(0);
  will-change:opacity,transform;
}
.previous-review-reveal{
  display:grid;
  grid-template-rows:0fr;
  transition:grid-template-rows var(--motion-dur) var(--motion-ease);
}
.previous-review-reveal.open{
  grid-template-rows:1fr;
}
.previous-review-clip{
  min-height:0;
  overflow:hidden;
}
.previous-review-content{
  padding-top:var(--record-content-gap);
  padding-left:calc(var(--record-status-size) + var(--review-action-gap));
  opacity:0;
  transform:translateX(-4px);
  transition:
    transform var(--motion-dur) var(--motion-ease),
    opacity var(--fade-dur) ease;
}
.previous-review-reveal.open .previous-review-content{
  opacity:1;
  transform:translateX(0);
}
.previous-review-text{
  margin:0;
  font-size:var(--record-control-font-size);
  font-weight:var(--record-control-font-weight);
  color:var(--record-control-text);
  line-height:1.65;
}
.previous-review-body,
.previous-review-meta{
  display:block;
}
.previous-review-meta{
  text-align:right;
  font-size:var(--record-label-font-size);
  font-weight:600;
}

.rating{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:var(--record-horizontal-space);
}
.rating button{
  height:var(--record-control-height);
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--record-control-border);
  background:var(--record-control-bg);
  border-radius:var(--body-radius);
  padding:0 var(--record-horizontal-space);
  font-size:var(--record-control-font-size);
  font-weight:700;
  color:var(--record-control-text);
  box-shadow:none;
}
.rating button.active{
  background:var(--record-control-active-bg);
  border-color:var(--record-control-active-border);
  color:var(--record-control-active-text);
}
.rating button.active:active{
  background:var(--record-control-active-pressed-bg);
  border-color:var(--record-control-active-pressed-border);
}
.chips{
  --record-horizontal-space:var(--record-horizontal-space-preferred);
  display:flex;
  flex-wrap:nowrap;
  gap:var(--record-horizontal-space);
  min-width:0;
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-x;
  overscroll-behavior-x:contain;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;
  height:var(--record-control-height);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--record-control-border);
  background:var(--record-control-bg);
  border-radius:var(--body-radius);
  padding:0 var(--record-horizontal-space);
  white-space:nowrap;
}
.chip.active{
  background:var(--record-control-active-bg);
  border-color:var(--record-control-active-border);
  color:var(--record-control-active-text);
  font-weight:700;
}
.hidden{display:none!important}

/* Motion: layout itself moves; no page-level crossfade */
@media (prefers-reduced-motion:no-preference){
  .soft-reveal{
    display:grid;
    grid-template-rows:0fr;
    opacity:0;
    transform:translateY(-5px) scale(.995);
    margin-top:0!important;
    pointer-events:none;
    transition:
      grid-template-rows 360ms cubic-bezier(.16,1,.3,1),
      opacity 180ms ease-out,
      transform 360ms cubic-bezier(.16,1,.3,1),
      margin-top 360ms cubic-bezier(.16,1,.3,1);
  }
  .soft-reveal>*{overflow:hidden;min-height:0}
  .soft-reveal.open{
    grid-template-rows:1fr;
    opacity:1;
    transform:translateY(0) scale(1);
    margin-top:14px!important;
    pointer-events:auto;
  }
}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#20252b;color:#fff;padding:10px 14px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1}
.note{font-size:12px;color:var(--sub);line-height:1.6}

/* Record footer navigation */
.record-footer{
  --footer-outer-h:62px;
  --footer-outer-r:calc(var(--footer-outer-h)/2);
  --footer-item-h:42px;
  --footer-item-r:calc(var(--footer-item-h)/2);
  --footer-icon-scale:.7142857;

  /* Motion */
  --footer-color-dur:.15s;
  --footer-color-ease:cubic-bezier(.22,.72,.26,1);

  /* Shared materials */
  --footer-white-bg:linear-gradient(180deg,#ffffff 0%,#edf1f5 100%);
  --footer-white-outline:#cbd3dc;
  --footer-white-shadow:
    inset 0 0 0 1.25px var(--footer-white-outline),
    inset 0 1px 0 rgba(255,255,255,1),
    inset 0 -1px 0 rgba(31,41,51,.035);

  --footer-blue-bg:linear-gradient(180deg,#3993ff 0%,#1f73e6 100%);
  --footer-blue-outline:#2278ef;
  --footer-blue-shadow:
    inset 0 0 0 1.25px var(--footer-blue-outline),
    inset 0 1px 0 rgba(255,255,255,.16);

  --footer-green-bg:linear-gradient(180deg,#56cf8d 0%,#35b978 100%);
  --footer-green-outline:#2faa68;
  --footer-green-shadow:
    inset 0 0 0 1.25px var(--footer-green-outline),
    inset 0 1px 0 rgba(255,255,255,.16);

  --footer-completed-bg:linear-gradient(180deg,#e1e5e9 0%,#d5dbe1 46%,#c5cdd5 100%);
  --footer-completed-outline:#9faab6;
  --footer-completed-shadow:
    inset 0 0 0 1.25px var(--footer-completed-outline),
    inset 0 1px 0 rgba(255,255,255,.76),
    inset 0 -1px 0 rgba(31,41,51,.05);
  position:fixed;
  left:50%;
  bottom:10px;
  z-index:30;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:10px;
  width:min(calc(100vw - 20px),700px);
}
/* Installed Web App only:
   JS measures the real physical top gap of the header capsule and mirrors it
   at the bottom for the footer's inner 42px capsule. This avoids relying only
   on env(safe-area-inset-top), which may be 0 when standalone content begins
   below the status bar. */
.record-footer{
  --standalone-footer-bottom:10px;
}
@media (orientation:portrait) and (display-mode:standalone){
  .record-footer{
    bottom:var(--standalone-footer-bottom);
  }
}
@media (orientation:portrait){
  html.standalone-app .record-footer{
    bottom:var(--standalone-footer-bottom);
  }
}


/* iOS Safari keyboard fallback (unresolved issue):
   Do not reposition or animate the footer while the software keyboard is
   active. Hiding it is intentionally boring but avoids compositor shaking,
   fixed/absolute hand-offs, and scroll-lock conflicts. */
.record-footer.is-keyboard-hidden{
  visibility:hidden;
  pointer-events:none;
}

.record-nav-shell{
  position:relative;
  flex:1 1 auto;
  min-width:0;
  height:var(--footer-outer-h);
  border:1px solid var(--line);
  border-radius:var(--footer-outer-r);
  background:rgba(255,255,255,.96);
  box-shadow:none;
  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);
  padding:10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  overflow:hidden;
}
.record-nav-shell::before{
  content:"";
  position:absolute;
  z-index:0;
  top:50%;
  left:calc(10px + var(--footer-item-h)/2);
  right:calc(10px + var(--footer-item-h)/2);
  height:1.25px;
  background:#cbd3dc;
  transform:translateY(-50%);
  pointer-events:none;
}
.record-nav-item{
  position:relative;
  z-index:1;
  height:var(--footer-item-h);
  width:var(--footer-item-h);
  min-width:var(--footer-item-h);
  border:0;
  border-radius:var(--footer-item-r);
  padding:0;
  background:var(--footer-white-bg);
  box-shadow:var(--footer-white-shadow);
  color:#243140;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:0;
  flex:0 0 auto;
  overflow:hidden;
  isolation:isolate;
  font-size:16px;
  -webkit-tap-highlight-color:transparent;
  appearance:none;
  -webkit-appearance:none;
  transition:
    width var(--motion-dur) var(--motion-ease),
    padding var(--motion-dur) var(--motion-ease),
    background var(--footer-color-dur) var(--footer-color-ease),
    border-color var(--footer-color-dur) var(--footer-color-ease),
    box-shadow var(--footer-color-dur) var(--footer-color-ease),
    color var(--footer-color-dur) var(--footer-color-ease),
    transform .14s ease;
  will-change:width;
}
.record-nav-item:active{transform:none}

.record-nav-item .record-icon-circle{
  position:relative;
  z-index:1;
  width:var(--footer-item-h);
  height:var(--footer-item-h);
  flex:0 0 var(--footer-item-h);
  border-radius:50%;
  border:0;
  background:transparent;
  color:#243140;
  display:grid;
  place-items:center;
}
.record-nav-item .record-icon-circle::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  border:0;
  background:transparent;
  box-shadow:none;
  transform:scale(1);
  transform-origin:50% 50%;
  will-change:transform;
  transition:
    transform var(--motion-dur) var(--motion-ease),
    background var(--footer-color-dur) var(--footer-color-ease),
    box-shadow var(--footer-color-dur) var(--footer-color-ease);
}
.record-nav-item .record-icon-circle svg{
  position:relative;
  z-index:1;
  transform:translateZ(0);
}
.record-nav-item[data-footer-section="basic"] .record-icon-circle svg{
  transform:translateY(-0.5px) translateZ(0);
}
.record-nav-item[data-footer-section="lesson"] .record-icon-circle svg{
  transform:scale(1.08) translateZ(0);
  stroke-width:1.76;
}
.record-nav-item[data-footer-section="homework"] .record-icon-circle svg{
  transform:translateY(-0.4px) scale(1.04) translateZ(0);
  stroke-width:1.83;
}
.record-preview-button .preview-frame{
  opacity:.42;
  stroke-width:1.15;
}
.record-preview-button .preview-pupil{
  fill:currentColor;
  stroke:none;
}
.record-nav-item svg,
.record-preview-button svg{
  width:21px;
  height:21px;
  display:block;
  fill:none;
  stroke:currentColor;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round;
  shape-rendering:geometricPrecision;
}
.record-nav-label{
  position:relative;
  z-index:1;
  width:4em;
  max-width:0;
  opacity:0;
  overflow:hidden;
  white-space:nowrap;
  margin-left:0;
  transform:translateX(-4px);
  font-size:1em;
  font-weight:700;
  line-height:1;
  will-change:max-width,opacity,transform;
  transition:
    max-width var(--motion-dur) var(--motion-ease),
    margin-left var(--motion-dur) var(--motion-ease),
    transform var(--motion-dur) var(--motion-ease),
    opacity var(--fade-dur) ease;
}
.record-nav-item.active{
  width:calc(var(--footer-item-h) + 2px + 4em + 12px);
  padding:0 12px 0 0;
  color:#fff;
  background:var(--footer-blue-bg);
  box-shadow:var(--footer-blue-shadow);
}
.record-nav-item.active .record-icon-circle{
  color:var(--footer-blue-outline);
}
.record-nav-item.active .record-icon-circle::before{
  transform:scale(var(--footer-icon-scale));
  background:#fff;
  box-shadow:none;
}
.record-nav-item.completed:not(.active){
  background:var(--footer-completed-bg);
  box-shadow:var(--footer-completed-shadow);
  color:#44515e;
}
.record-nav-item.completed:not(.active) .record-icon-circle{
  color:#44515e;
}
.record-nav-item.completed:not(.active) .record-icon-circle::before{
  background:transparent;
  box-shadow:none;
}
.record-nav-item.active .record-nav-label{
  max-width:4em;
  opacity:1;
  margin-left:2px;
  transform:translateX(0);
}
.record-preview-button{
  --preview-label-w:5em;
  --preview-text-pad:12px;
  --preview-text-gap:2px;
  --preview-inner-w:calc(var(--preview-text-pad) + var(--preview-label-w) + var(--preview-text-gap) + var(--footer-item-h));
  --preview-outer-w:calc(var(--preview-inner-w) + 20px);
  position:relative;
  width:var(--footer-outer-h);
  height:var(--footer-outer-h);
  flex:0 0 auto;
  padding:0;
  border-radius:var(--footer-outer-r);
  border:1px solid #c5cdd6;
  background:#e5e9ee;
  box-shadow:none;
  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);
  display:block;
  color:#243140;
  cursor:pointer;
  overflow:hidden;
  font-size:16px;
  -webkit-tap-highlight-color:transparent;
  transition:
    width var(--motion-dur) var(--motion-ease),
    border-radius var(--motion-dur) var(--motion-ease),
    background-color var(--footer-color-dur) var(--footer-color-ease),
    border-color var(--footer-color-dur) var(--footer-color-ease),
    transform .14s ease;
  will-change:width;
}
.record-preview-button:active{transform:none}
.record-preview-button .record-icon-circle{
  position:absolute;
  right:9px;
  top:50%;
  transform:translateY(-50%);
  width:var(--footer-item-h);
  height:var(--footer-item-h);
  box-sizing:border-box;
  border-radius:var(--footer-item-r);
  border:1.25px solid var(--footer-white-outline);
  background:var(--footer-white-bg);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,1),
    inset 0 -1px 0 rgba(31,41,51,.035);
  display:block;
  overflow:hidden;
  transition:
    width var(--motion-dur) var(--motion-ease),
    border-radius var(--motion-dur) var(--motion-ease),
    background var(--footer-color-dur) var(--footer-color-ease),
    border-color var(--footer-color-dur) var(--footer-color-ease),
    box-shadow var(--footer-color-dur) var(--footer-color-ease),
    color var(--footer-color-dur) var(--footer-color-ease);
  will-change:width;
}
.preview-icon-slot{
  position:absolute;
  right:9px;
  top:50%;
  width:var(--footer-item-h);
  height:var(--footer-item-h);
  transform:translateY(-50%);
  display:grid;
  place-items:center;
  isolation:isolate;
  color:#243140;
  z-index:2;
  transition:color var(--footer-color-dur) var(--footer-color-ease);
}
.preview-icon-slot::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  border:0;
  background:var(--footer-white-bg);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,1),
    inset 0 -1px 0 rgba(31,41,51,.035);
  transform:scale(.94047619);
  transform-origin:50% 50%;
  z-index:0;
  will-change:transform;
  transition:
    transform var(--motion-dur) var(--motion-ease),
    background var(--footer-color-dur) var(--footer-color-ease),
    box-shadow var(--footer-color-dur) var(--footer-color-ease);
}
.record-preview-button .preview-icon-slot svg{
  position:absolute;
  left:50%;
  top:50%;
  z-index:1;
  transform:translate(-50%,-50%) translateZ(0);
}
.preview-label{
  position:absolute;
  left:var(--preview-text-pad);
  top:50%;
  width:var(--preview-label-w);
  max-width:0;
  opacity:0;
  overflow:hidden;
  white-space:nowrap;
  transform:translateY(-50%) translateX(-4px);
  font-size:1em;
  font-weight:700;
  line-height:1;
  text-align:left;
  will-change:max-width,opacity,transform;
  transition:
    max-width var(--motion-dur) var(--motion-ease),
    transform var(--motion-dur) var(--motion-ease),
    opacity var(--fade-dur) ease,
    color var(--footer-color-dur) var(--footer-color-ease);
}
.record-preview-button:active .record-icon-circle{
  background:linear-gradient(180deg,#f7f9fb 0%,#e7ecf1 100%);
}
.record-footer.preview-mode .record-preview-button:active .record-icon-circle{
  background:linear-gradient(180deg,#31ca6d 0%,#20aa54 100%);
}

/* Preview mode: footer total width stays fixed; the two large capsules trade width. */
.record-footer.preview-mode .record-preview-button{

  background:rgba(255,255,255,.96);
  box-shadow:none;
}
.record-footer.preview-mode .record-preview-button .record-icon-circle{

}
.record-footer.preview-mode .record-preview-button .preview-icon-slot{

}
.record-footer.preview-mode .record-preview-button .preview-icon-slot::before{
  transform:scale(var(--footer-icon-scale));
  background:#fff;
  box-shadow:none;
}
.record-footer.preview-mode .preview-label{
  max-width:var(--preview-label-w);
  color:#fff;
  opacity:1;
  transform:translateY(-50%) translateX(0);
}


/* In preview mode the TOC is icon-only; the selected item uses the preview green. */
.record-footer.preview-mode .record-nav-item,
.record-footer.preview-mode .record-nav-item.active{
  width:var(--footer-item-h);
  min-width:var(--footer-item-h);

}

.record-footer.preview-mode .record-nav-item.active .record-nav-label{
  max-width:0;
  opacity:0;

}
.record-footer.preview-mode .record-nav-item.active{
  border:0;
  background:var(--footer-green-bg);
  box-shadow:var(--footer-green-shadow);
}
.record-footer.preview-mode .record-nav-item.active .record-icon-circle{
  color:var(--footer-green-outline);
}
.record-footer.preview-mode .record-nav-item.active .record-icon-circle::before{
  transform:scale(var(--footer-icon-scale));
  background:#fff;
  box-shadow:none;
}

/* Preview mode ignores "completed" gray: unselected items return to normal white. */

/* iPhone landscape: keep every section-navigation capsule open.
   Colors/states remain exactly the same as portrait. */
@media (orientation:landscape) and (max-height:500px) and (min-width:600px){
  /* Open every section capsule using the exact same geometry as
     the portrait active capsule. Only visibility changes here;
     each item's portrait color/state rules continue to win. */
  .record-nav-item,
  .record-nav-item.active,
  .record-footer.preview-mode .record-nav-item,
  .record-footer.preview-mode .record-nav-item.active{
    width:calc(var(--footer-item-h) + 2px + 4em + 12px);
    min-width:calc(var(--footer-item-h) + 2px + 4em + 12px);
    padding:0 12px 0 0;
    justify-content:flex-start;
  }

  .record-nav-item .record-nav-label,
  .record-nav-item.active .record-nav-label,
  .record-footer.preview-mode .record-nav-item .record-nav-label,
  .record-footer.preview-mode .record-nav-item.active .record-nav-label{
    width:4em;
    max-width:4em;
    opacity:1;
    margin-left:2px;
    transform:translateX(0);
    text-align:left;
  }
  /* Unselected open capsules use the same visual language as the header's
     "一覧" capsule: pale outer capsule + white outlined inner circle. */
  .record-nav-item:not(.active),
  .record-nav-item.completed:not(.active),
  .record-footer.preview-mode .record-nav-item:not(.active),
  .record-footer.preview-mode .record-nav-item.completed:not(.active){
    color:#243140;
    background:linear-gradient(180deg,#ffffff 0%,#f2f5f8 100%);
    box-shadow:
      inset 0 0 0 1.25px #cbd3dc,
      inset 0 1px 0 rgba(255,255,255,.98);
  }

  function springProgress(t){
    if(t<=0)return 0;
    if(t>=1)return 1;
    return 1-Math.exp(-12*t)*(Math.cos(11*t)+0.35*Math.sin(11*t));
  }

  function heightSpringFrames(from,to,steps=30){
    return Array.from({length:steps+1},(_,i)=>{
      const t=i/steps,p=i===steps?1:springProgress(t);
      return {height:(from+(to-from)*p)+"px",offset:t};
    });
  }

    const portrait=window.innerHeight>=window.innerWidth;

  function updateStandaloneFooterInset(){
    if(!IS_STANDALONE_APP)return;
    if(window.matchMedia("(orientation: landscape)").matches)return;

    const footer=document.querySelector(".record-footer");
    const headerCapsule=
      document.querySelector(".header-back") ||
      document.querySelector(".header-submit");
    const shell=footer?.querySelector(".record-nav-shell");
    const innerCapsule=footer?.querySelector(".record-nav-item");

    if(!footer||!headerCapsule||!shell||!innerCapsule)return;

    /* If the software keyboard is active, keep the last normal-screen value.
       The footer is covered during keyboard use and should not be re-laid out
       against the shrunken visual viewport. */
    if(isKeyboardEntryControl(document.activeElement))return;

    const screenTopOutsideViewport=Math.max(
      0,
      currentScreenHeight()-window.innerHeight
    );

    const headerTopFromPhysicalScreen=
      screenTopOutsideViewport +
      headerCapsule.getBoundingClientRect().top;

    const shellRect=shell.getBoundingClientRect();
    const innerRect=innerCapsule.getBoundingClientRect();
    const innerBottomInset=Math.max(0,shellRect.bottom-innerRect.bottom);

    /* Desired:
       physical screen top -> header capsule top
       ==
       physical screen bottom -> footer inner capsule bottom

       footer bottom + footer's internal bottom inset = header top gap */
    const footerBottom=Math.max(
      0,
      headerTopFromPhysicalScreen-innerBottomInset
    );

    footer.style.setProperty(
      "--standalone-footer-bottom",
      footerBottom+"px"
    );
  }

  function unbindStandaloneFooterInset(){
    if(!standaloneFooterResizeHandler)return;
    window.removeEventListener("resize",standaloneFooterResizeHandler);
    window.removeEventListener("orientationchange",standaloneFooterResizeHandler);
    standaloneFooterResizeHandler=null;

    if(!IS_STANDALONE_APP)return;

    standaloneFooterResizeHandler=()=>{
      requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{
          updateStandaloneFooterInset();

    window.addEventListener(

    );

  function unbindBrowserFooterKeyboardOpening(){
    const viewport=window.visualViewport;

    if(footerKeyboardViewportHandler&&viewport){
      viewport.removeEventListener("resize",footerKeyboardViewportHandler);
      viewport.removeEventListener("scroll",footerKeyboardViewportHandler);
      footerKeyboardViewportHandler=null;

      document.removeEventListener("focusin",footerKeyboardFocusInHandler);
      footerKeyboardFocusInHandler=null;

    if(footerKeyboardFocusOutHandler){
      document.removeEventListener("focusout",footerKeyboardFocusOutHandler);
      footerKeyboardFocusOutHandler=null;
    }

    const footer=document.querySelector(".record-footer");
    if(footer)footer.classList.remove("is-keyboard-hidden");

    footerKeyboardBaselineHeight=0;
    footerKeyboardSession=false;
    footerKeyboardHasShrunk=false;

  function bindBrowserFooterKeyboardOpening(){
    unbindBrowserFooterKeyboardOpening();

    /* Installed/PWA mode uses its own footer inset handling. This fallback is
       for ordinary iOS Safari browser mode only. */
    if(IS_STANDALONE_APP)return;

    const footer=document.querySelector(".record-footer");
    const viewport=window.visualViewport;
    if(!footer||!viewport)return;

    footerKeyboardBaselineHeight=viewport.height;

    const hideFooter=()=>{
      footer.classList.add("is-keyboard-hidden");
    };

    const showFooter=()=>{
      footer.classList.remove("is-keyboard-hidden");
      footerKeyboardSession=false;
      footerKeyboardHasShrunk=false;
      footerKeyboardBaselineHeight=viewport.height;
    };

    const viewportRecovered=()=>
      viewport.height>=footerKeyboardBaselineHeight-24;

    const sync=()=>{
      if(!footerKeyboardSession){
        if(!isKeyboardEntryControl(document.activeElement)){
          footerKeyboardBaselineHeight=viewport.height;
        }
        return;
      }

      /* No page movement, no footer movement, no visualViewport chasing.
         First wait until a real software-keyboard shrink has actually been
         observed; otherwise Safari can emit an early viewport scroll event
         before the keyboard resizes and accidentally reveal the footer again. */
      const shrink=footerKeyboardBaselineHeight-viewport.height;
      if(shrink>80)footerKeyboardHasShrunk=true;
      if(footerKeyboardHasShrunk&&viewportRecovered())showFooter();
    };

    footerKeyboardFocusInHandler=e=>{
      if(!isKeyboardEntryControl(e.target))return;

      /* Capture a fresh baseline only at the start of a new keyboard session.
         Focus transfers between fields while the keyboard is open keep the
         original baseline. Hide immediately so Safari never gets a chance to
         visibly hoist the fixed footer above the keyboard. */
      if(!footerKeyboardSession){
        footerKeyboardBaselineHeight=viewport.height;
        footerKeyboardSession=true;
        footerKeyboardHasShrunk=false;
      }
      hideFooter();
    };

    footerKeyboardFocusOutHandler=()=>{
      /* Blur alone is not a reliable "keyboard closed" signal on iOS. If a
         software keyboard really opened, wait for viewport recovery. If no
         shrink ever happened (hardware keyboard / cancelled focus), reveal. */
      requestAnimationFrame(()=>{
        if(!footerKeyboardHasShrunk)showFooter();
        else sync();
      });
    };

    footerKeyboardViewportHandler=()=>requestAnimationFrame(sync);

    document.addEventListener("focusin",footerKeyboardFocusInHandler);
    document.addEventListener("focusout",footerKeyboardFocusOutHandler);
    viewport.addEventListener(
      "resize",
      footerKeyboardViewportHandler,
      {passive:true}
    );
    viewport.addEventListener(
      "scroll",
      footerKeyboardViewportHandler,
      {passive:true}
    );
  }

  function renderList(){
    unbindStandaloneFooterInset();

  function openRecord(id){
    state.lessonId=id;state.showPrev=false;
    const l=getLesson(),r=getRecord();
    state.rating=r?.rating||"";
    state.forgot=new Set(r?.forgot||["なし"]);

    const dt=r?.performedAt||lessonBase(l),
      duration=Number(r?.duration||l.duration||70),
      materials=materialsFromRecord(r,l);

    const subjectOptions=subjectsForGrade(l.grade);
    const savedSubjects=(Array.isArray(r?.subjects)?r.subjects:(r?.subject?[r.subject]:[]))
      .map(subject=>normalizeSubjectForGrade(subject,l.grade));
    const subjects=subjectOptions.filter(subject=>savedSubjects.includes(subject));
    if(!subjects.length)subjects.push(normalizeSubjectForGrade(l.subject,l.grade));

    const instructor=INSTRUCTORS.includes(r?.instructor)?r.instructor:l.instructor;

    renderRecord({
      dt,
      duration,
      materials,
      review:r?.review||"",
      homeworkComment:r?.homeworkComment||"",
      nextHomework:r?.nextHomework||"",
      note:r?.note||"",
      forgotOther:r?.forgotOther||"",
      type:r?.type||l.type,
      instructor,
      subjects
    });
  }

  function endTimeLabel(dt,duration){
    const total=(Number(dt.hour)*60+Number(dt.minute)+Number(duration||70))%(24*60);
    return "〜"+pad(Math.floor(total/60))+":"+pad(total%60);
  }

  function datetimeBlocks(v){
    const dt=v.dt;
    const monthOptions=Array.from({length:12},(_,i)=>i+1).map(value=>'<option value="'+value+'" '+(Number(dt.month)===value?'selected':'')+'>'+pad(value)+'月</option>').join("");
    const maxDay=new Date(dt.year,dt.month,0).getDate();
    const dayOptions=Array.from({length:maxDay},(_,i)=>i+1).map(value=>'<option value="'+value+'" '+(Number(dt.day)===value?'selected':'')+'>'+pad(value)+'日</option>').join("");
    const timeOptions=["11:00","13:00","14:20","15:40","17:00","18:20","19:40"].map(value=>'<option value="'+value+'" '+((pad(dt.hour)+':'+pad(dt.minute))===value?'selected':'')+'>'+value+'</option>').join("");
    const durationOptions=[70,30].map(value=>'<option value="'+value+'" '+(Number(v.duration||70)===value?'selected':'')+'>'+value+'分</option>').join("");
    return '<div class="datetime-blocks" aria-label="実施日時">'+
      '<div class="datetime-main">'+
        '<select class="dt-block" data-dt-part="month" aria-label="月を変更">'+monthOptions+'</select>'+
        '<select class="dt-block" data-dt-part="day" aria-label="日を変更">'+dayOptions+'</select>'+
        '<select class="dt-block datetime-start-time" data-dt-part="time" aria-label="開始時刻を変更">'+timeOptions+'</select>'+
        '<span class="datetime-end-time" id="dtEndTimeValue" aria-label="終了時刻">'+endTimeLabel(dt,v.duration)+'</span>'+
      '</div>'+
      '<select class="dt-block datetime-duration" data-dt-part="duration" aria-label="授業時間を変更">'+durationOptions+'</select>'+
    '</div>';
  }

  function updateChoiceScrollAffordance(group){
    const shell=group.closest(".card")?.querySelector(".card-title-row .choice-scroll-affordance");
    if(!shell)return;

    const maxScroll=Math.max(0,group.scrollWidth-group.clientWidth);
    const scrollable=maxScroll>1;
    const left=shell.querySelector('[data-scroll-direction="left"]');
    const right=shell.querySelector('[data-scroll-direction="right"]');

    shell.classList.toggle("is-visible",scrollable);
    if(!scrollable)return;

    const current=Math.max(0,group.scrollLeft);
    left?.classList.toggle("is-muted",current<=1);
    right?.classList.toggle("is-muted",current>=maxScroll-1);
  }

  function setupChoiceScrollAffordances(){
    document.querySelectorAll("[data-choice-scroll]").forEach(group=>{
      const card=group.closest(".card");
      const titleRow=card?.querySelector(".card-title-row");
      let affordance=titleRow?.querySelector(".choice-scroll-affordance");

      if(titleRow&&!affordance){
        affordance=document.createElement("div");
        affordance.className="choice-scroll-affordance";
        affordance.setAttribute("aria-hidden","true");
        affordance.innerHTML=
          '<span class="choice-scroll-chevron" data-scroll-direction="left">'+
            '<svg viewBox="0 0 10.5 10.5"><path d="M.875 2.65 5.25 7.025 9.625 2.65"/></svg>'+
          '</span>'+
          '<span class="choice-scroll-chevron" data-scroll-direction="right">'+
            '<svg viewBox="0 0 10.5 10.5"><path d="M.875 2.65 5.25 7.025 9.625 2.65"/></svg>'+
          '</span>';
        titleRow.append(affordance);

        let raf=0;
        group.addEventListener("scroll",()=>{
          cancelAnimationFrame(raf);
          raf=requestAnimationFrame(()=>updateChoiceScrollAffordance(group));
        },{passive:true});
      }

      updateChoiceScrollAffordance(group);
    });
  }

  function refreshRecordHorizontalControls(){
    setupChoiceScrollAffordances();
  }

  function refreshDateTimeBlocks(v){
    const dt=v.dt;
    const monthEl=document.querySelector('[data-dt-part="month"]');
    const dayEl=document.querySelector('[data-dt-part="day"]');
    const timeEl=document.querySelector('[data-dt-part="time"]');
    const durationEl=document.querySelector('[data-dt-part="duration"]');
    const endTimeEl=document.getElementById("dtEndTimeValue");

    if(monthEl)monthEl.value=String(dt.month);
    if(dayEl){
      const maxDay=new Date(dt.year,dt.month,0).getDate();
      if(dt.day>maxDay)dt.day=maxDay;
      dayEl.innerHTML=Array.from({length:maxDay},(_,i)=>i+1).map(value=>'<option value="'+value+'">'+pad(value)+'日</option>').join("");
      dayEl.value=String(dt.day);
    }
    if(timeEl)timeEl.value=pad(dt.hour)+':'+pad(dt.minute);
    if(durationEl)durationEl.value=String(Number(v.duration||70));
    if(endTimeEl)endTimeEl.textContent=endTimeLabel(dt,v.duration);
    requestAnimationFrame(refreshRecordHorizontalControls);
  }


  function capture(v){
    return {
      dt:v.dt,
      duration:Number(v.duration||70),
      materials:[...document.querySelectorAll("[data-material-entry]")].map((entry,index)=>{
        const fallback=v.materials?.[index]||{};
        const material=entry.querySelector("[data-material-select]")?.value||fallback.material||"";
        const customMaterial=entry.querySelector("[data-custom-material]")?.value||"";
        const ranges=[...entry.querySelectorAll("[data-material-range]")]
          .map(range=>{
            const from=range.querySelector("[data-material-page-from]")?.value||"";
            const to=range.querySelector("[data-material-page-to]")?.value||"";
            return {from,to};
          })
          .filter(range=>range.from||range.to);
        return {
          material,
          customMaterial,
          ranges,
          draft:entry.dataset.materialDraft==="true"
        };
      }),
      review:document.getElementById("review")?.value??v.review,
      homeworkComment:document.getElementById("homeworkComment")?.value??v.homeworkComment,
      nextHomework:document.getElementById("nextHomework")?.value??v.nextHomework,
      note:document.getElementById("note")?.value??v.note,
      forgotOther:document.getElementById("forgotOther")?.value??v.forgotOther,
      type:document.querySelector("#typeSegment .active")?.dataset.type||v.type,
      instructor:document.querySelector("#instructorChoices .active")?.dataset.instructor||v.instructor,
      subjects:[...document.querySelectorAll("#subjectChoices [data-subject].active")].map(button=>button.dataset.subject)
    };
  }

  function setFooterActive(key){
    document.querySelectorAll("[data-footer-section]").forEach(btn=>{
      const on=btn.dataset.footerSection===key;
      btn.classList.toggle("active",on);
      if(on)btn.setAttribute("aria-current","true");
      else btn.removeAttribute("aria-current");
    });
    document.querySelectorAll("[data-record-section]").forEach(section=>{
      section.classList.toggle("is-current",section.dataset.recordSection===key);
    });
  }

  function updateCardCompletion(c){
    if(!document.querySelector("[data-card-status]"))return;
    const completed={
      datetime:true,
      type:!!String(c.type||"").trim(),
      instructor:!!String(c.instructor||"").trim(),
      subject:Array.isArray(c.subjects)&&c.subjects.length>0,
      material:!!c.materials?.length && c.materials.every(entry=>{
        const hasMaterial=entry.material==="__custom__"
          ? !!String(entry.customMaterial||"").trim()
          : !!String(entry.material||"").trim();

        const ranges=Array.isArray(entry.ranges)?entry.ranges:[];
        const rangesAreValid=ranges.every(range=>{
          const from=String(range?.from||"").trim();
          const to=String(range?.to||"").trim();

          /* Page ranges are optional because some materials (e.g. handouts)
             have no meaningful page number. If a range is used, however,
             it must have a start page; an end-page-only range is incomplete. */
          return (!from && !to) || !!from;
        });

        return hasMaterial && rangesAreValid;
      }),
      review:!!String(c.review||"").trim(),
      prevhomework:!!(
        state.rating ||
        String(c.homeworkComment||"").trim()
      ),
      nexthomework:!!String(c.nextHomework||"").trim(),
      forgot:state.forgot.size>0 && (
        !state.forgot.has("その他") ||
        !!String(c.forgotOther||"").trim()
      ),
      note:!!String(c.note||"").trim()
    };
    document.querySelectorAll("[data-card-status]").forEach(card=>{
      card.classList.toggle("is-complete",!!completed[card.dataset.cardStatus]);
    });
  }

  function updateFooterCompletion(c){
    if(!document.querySelector("[data-footer-section]"))return;
    updateCardCompletion(c);

    document.querySelectorAll("[data-footer-section]").forEach(btn=>{
      const section=document.querySelector(
        '[data-record-section="'+btn.dataset.footerSection+'"]'
      );
      const items=section
        ? [...section.querySelectorAll("[data-card-status]")]
        : [];
      const completed=items.length>0 &&
        items.every(item=>item.classList.contains("is-complete"));

  function bindRecordFooter(v){
    const targets={
      basic:document.querySelector('[data-record-section="basic"]'),
      lesson:document.querySelector('[data-record-section="lesson"]'),
      homework:document.querySelector('[data-record-section="homework"]'),
      other:document.querySelector('[data-record-section="other"]')
    };

    const headerBottom=()=>{
      const header=document.querySelector(".header");
      if(!header)return 0;
      // Use the header's actual viewport position, not only its height.
      // In in-app browsers (e.g. LINE), the sticky header's rect can be
      // offset while browser chrome / the visual viewport is changing.
      return Math.max(0,header.getBoundingClientRect().bottom);
    };

    const targetDelta=target=>
      target.getBoundingClientRect().top-headerBottom();

    const unlockFooterScroll=(runSpy=true)=>{
      footerScrollLock=null;
      clearTimeout(footerScrollUnlockTimer);
      footerScrollUnlockTimer=null;
      if(runSpy && footerScrollHandler)requestAnimationFrame(footerScrollHandler);
    };

    const finalizeFooterScroll=()=>{
      if(!footerScrollLock)return;

      const target=footerScrollLock.target;
      const delta=targetDelta(target);

      // One exact geometry-based correction after the smooth scroll settles.
      // This absorbs LINE/Safari toolbar and visualViewport changes without
      // changing the section's own 20px top-padding rule.
      if(Math.abs(delta)>.5){
        window.scrollBy({top:delta,behavior:"auto"});
      }

      requestAnimationFrame(()=>unlockFooterScroll(true));
    };

    document.querySelectorAll("[data-footer-section]").forEach(btn=>{
      btn.onclick=()=>{
        const active=document.activeElement;
        if(isKeyboardEntryControl(active))active.blur();

        const key=btn.dataset.footerSection,target=targets[key];
        if(!target)return;

        const delta=targetDelta(target);

        // During a tap-triggered smooth scroll, keep the tapped tab selected.
        // This prevents the scroll-spy from activating sections merely passed en route.
        footerScrollLock={key,target,started:performance.now()};
        clearTimeout(footerScrollUnlockTimer);
        setFooterActive(key);

        // Scroll by the measured viewport delta. This remains correct even when
        // the sticky header is not sitting at viewport y=0 in an in-app browser.
        window.scrollBy({top:delta,behavior:"smooth"});

        // Final geometry correction after mobile browser chrome has settled.
        footerScrollUnlockTimer=setTimeout(finalizeFooterScroll,900);
      };
    });

    if(footerScrollHandler)window.removeEventListener("scroll",footerScrollHandler);
    let ticking=false;
    footerScrollHandler=()=>{
      if(ticking)return;
      ticking=true;
      requestAnimationFrame(()=>{
        ticking=false;

        if(footerScrollLock){
          const distance=Math.abs(targetDelta(footerScrollLock.target));
          const elapsed=performance.now()-footerScrollLock.started;

          // Keep the requested section active until the scroll actually arrives.
          setFooterActive(footerScrollLock.key);

          if(distance<=1){
            // Do not unlock immediately: the visual viewport can still move
            // for a moment in LINE/Safari. Let finalizeFooterScroll verify it.
            return;
          }
          if(elapsed>1100){
            finalizeFooterScroll();
          }
          return;
        }

        const probe=headerBottom()+24;
        let active="basic";
        [["lesson",targets.lesson],["homework",targets.homework],["other",targets.other]].forEach(([key,target])=>{
          if(target&&target.getBoundingClientRect().top<=probe)active=key;
        });
        setFooterActive(active);
      });
    };
    window.addEventListener("scroll",footerScrollHandler,{passive:true});
    footerScrollHandler();
  }

  function bindRecord(v){
